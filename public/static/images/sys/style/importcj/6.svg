<svg xmlns="http://www.w3.org/2000/svg" width="180" height="101" viewBox="0 0 180 101" role="img" aria-labelledby="title desc">
  <title id="title">弹幕星河主题预览</title>
  <desc id="desc">深海蓝背景上的多轨道星光弹幕</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06152b"/>
      <stop offset="1" stop-color="#111439"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#61e8ff"/>
      <stop offset="1" stop-color="#8d82ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="101" rx="8" fill="url(#bg)"/>
  <circle cx="90" cy="54" r="32" fill="#15254a" stroke="#f6c860" stroke-opacity=".45"/>
  <circle cx="90" cy="54" r="23" fill="#0b1831" stroke="#61e8ff" stroke-opacity=".35"/>
  <g fill="#f6c860" opacity=".7">
    <circle cx="15" cy="14" r="1"/><circle cx="43" cy="25" r=".8"/><circle cx="155" cy="18" r="1"/><circle cx="166" cy="78" r=".8"/><circle cx="22" cy="86" r="1"/>
  </g>
  <g filter="url(#glow)" font-family="Arial, sans-serif" font-weight="700" font-size="6">
    <g transform="translate(8 18)"><rect width="50" height="12" rx="6" fill="#18395f" stroke="#61e8ff" stroke-opacity=".6"/><circle cx="8" cy="6" r="3.2" fill="url(#cyan)"/><text x="15" y="8.1" fill="#fff">林晓宇</text></g>
    <g transform="translate(122 29)"><rect width="50" height="12" rx="6" fill="#3a244f" stroke="#ff91ca" stroke-opacity=".7"/><circle cx="8" cy="6" r="3.2" fill="#ff91ca"/><text x="15" y="8.1" fill="#fff">May Chen</text></g>
    <g transform="translate(10 61)"><rect width="55" height="12" rx="6" fill="#40361c" stroke="#f6c860" stroke-opacity=".7"/><circle cx="8" cy="6" r="3.2" fill="#f6c860"/><text x="15" y="8.1" fill="#fff">周子涵</text></g>
    <g transform="translate(112 76)"><rect width="58" height="12" rx="6" fill="#18395f" stroke="#61e8ff" stroke-opacity=".6"/><circle cx="8" cy="6" r="3.2" fill="url(#cyan)"/><text x="15" y="8.1" fill="#fff">赵一鸣</text></g>
  </g>
  <path d="M28 48h32M120 56h38" stroke="#61e8ff" stroke-opacity=".3" stroke-linecap="round"/>
</svg>
