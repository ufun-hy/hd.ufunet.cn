<div class="alert alert-danger">
	注:在线人数仅做参考，可能偶发人数统计误差，可以通过cpu占用率预估系统最多可承受人数
</div>
<div class="zam-confirmBox showuserAlert">
	<div class="col-lg-6 col-md-6">
		<div class="zam-confirmBox-item">
			<span class="zam-confirmBox-left col-lg-6">系统总在线:</span>
			<div class="zam-confirmBox-right col-lg-4">
				<span class="label label-danger p-l-10 p-r-10 fa-1-5x">{$total}</span>
			</div>
		</div>
	</div>
	<div class="col-lg-6 col-md-6">
		<div class="zam-confirmBox-item">
			<span class="zam-confirmBox-left col-lg-6">后台总在线:</span>
			<div class="zam-confirmBox-right col-lg-4">
				<span class="label label-success p-l-10 p-r-10 fa-1-5x">{$web}</span>
			</div>
		</div>
	</div>
	<div class="col-lg-6 col-md-6">
		<div class="zam-confirmBox-item">
			<span class="zam-confirmBox-left col-lg-6">所有活动总在线:</span>
			<div class="zam-confirmBox-right col-lg-4">
				<span class="label label-warning p-l-10 p-r-10 fa-1-5x">{$app}</span>
			</div>
		</div>
	</div>
	<div class="col-lg-6 col-md-6">
		<div class="zam-confirmBox-item">
			<span class="zam-confirmBox-left col-lg-6">当前活动在线:</span>
			<div class="zam-confirmBox-right col-lg-4">
			  <span class="label label-primary p-l-10 p-r-10 fa-1-5x">{$hd}</span>
			</div>
		</div>
	</div>
	<div class="text-center"><a class="btn btn-primary"><span><i class="mdi mdi-refresh"></i> 刷新</span></a></div>
</div>
