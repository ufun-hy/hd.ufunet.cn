<style>
	.addcatemodulelist li{
		text-align:center;
		margin:8px;
	}
	.addcatemoduleitem .moduleinfo{
		position:relative;
		left:10px;
		width:112px;
		font-size:15px;
		background-color:#fff;
		cursor:pointer;
		border:1px solid #dfe6ec;
	}
	.addcatemoduleitem .moduleinfo:hover{
		box-shadow: -3px 5px 15px rgba(64,102,178,.3);
	}
	.addcatemoduleitem .moduleinfo .moduleicon,.addcatemoduleitem .moduleinfo .modulename{
		display:inline-block;
		text-align:center;
		width: 100%;
		height: 30px;
		line-height: 30px;
	}
	.addcatemoduleitem .moduleinfo .moduleicon i{
		font-size:14px;
	}
	.addcatemoduleitem .zam-typeselected {
		position: absolute;
		top: -3px;
		right: 3px;
		display: none;
		font-size: 12px;
		color: #fff;
		text-align: center;
		transition: 0.3s;
		-moz-transition: 0.3s;
		-o-transition: 0.3s;
		-webkit-transition: 0.3s;
	}
	.addcatemoduleitem .zam-righttriangle{
		position: absolute;
		top: -1px;
		right: -1px;
		border-top: 25px solid #4886ff;
		border-left: 35px solid transparent;
		display:none;
	}
	.moduleinfo.active .zam-typeselected{
		display:block
	}
	.moduleinfo.active .zam-righttriangle{
		display:block
	}
</style>
<div class="row">
<ul class="addcatemodulelist clearfix">
{if !empty($canmodules)}
{foreach $canmodules as $mkey=>$module}
{if isset($modulelist[$module]) && !empty($modulelist[$module])}
	<li class="addcatemoduleitem col-lg-2 col-md-3">
		<div class="moduleinfo text-primary" data-id="{$modulelist[$module]['id']}" data-modulefield="{$modulelist[$module]['modulefield']}" data-modulename="{$modulelist[$module]['modulename']}">
			<span class="zam-righttriangle"></span>
			<i class="mdi mdi-check-circle zam-typeselected"></i>
			<span class="moduleicon hidden"><i class="{$modulelist[$module]['moduleicon']}"></i></span>
			<span class="modulename">{$modulelist[$module]['modulename']}</span>
		</div>
	</li>
{/if}
{/foreach}
{else}
<p style="padding:20px;" class="text-error">当前已无可选模块</p>
{/if}
</ul>
</div>
<script>
$(function(){
	$(".addcatemodulelist .moduleinfo").on('click',function(){
		if(!$(this).hasClass('active')){
			$(this).addClass('active');
		}else{
			$(this).removeClass('active');
		}
	});
});
</script>
