<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <title>{$title}</title>
    <meta name="author" content="株洲米波网络科技有限公司">
    <meta name="copyright" content="株洲米波网络科技有限公司">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <link href="__STATIC__/css/bootstrap.min.css" rel="stylesheet">
    <link href="__STATIC__/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="__STATIC__/css/style2.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100%;
            background: #edf1f4;
            text-rendering: optimizeLegibility;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", 微软雅黑, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .weberror-page .error-content {
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 30px rgba(99, 99, 99, 0.06);
            padding: 50px;
            background-color: #fff;
            width: 100%;
            max-width: 560px;
        }

        .weberror-page .error-header {
            font-size: 40px;
            line-height: 60px;
            letter-spacing: -1px;
            margin-bottom: 20px;
            color: #777;
        }

        .error-header .waring {
            color: #faa64b
        }

        .error-header .error {
            color: red;
        }

        .error-header .success {
            color: #2ecc71;
        }

        .weberror-page .error-des {
            font-size: 26px;
            line-height: 46px;
            color: #494949;
        }

        .weberror-page .hr {
            height: 1px;
            background-color: #eee;
            width: 80%;
            max-width: 350px;
            margin: 25px auto;
        }

        .weberror-page .error-btns {
            margin-top: 35px;
            overflow: hidden;
        }

        @media screen and (max-width:580px) {
            .weberror-page {
                padding: 30px 5%;
            }

            .weberror-page .error-content {
                padding: 37px
            }

            .weberror-page .error-header {
                font-size: 36px;
            }

            .weberror-page .error-des {
                font-size: 20px;
                line-height: 37px;
            }

            .weberror-page .hr {
                margin: 30px auto;
                width: 215px;
            }
        }

        @media screen and (max-width:450px) {
            .weberror-page {
                padding: 30px;
            }

            .weberror-page .error-header {
                font-size: 32px;
            }

            .weberror-page .hr {
                margin: 25px auto;
                width: 180px;
            }

            .weberror-page .error-btns {
                margin-top: 29px;
            }
        }
    </style>
</head>

<body class="weberror-page">
    <div class="error-content">
        <div class="error-header">
            <i
                class="mdi mdi-{if $status=='2'}alert{elseif $status=='3'}close{else /}check{/if}-circle {if $status=='2'}waring{elseif $status=='3'}error{else /}success{/if}"></i>
        </div>
        <div class="error-des">{$errmsg}</div>
        <div class="hr"></div>
        {if empty($redirect) && (!isset($hasredirect) || $hasredirect == '1')}
        <div class="error-btns">
            <a class="btn btn-primary" href="javascript:void(0)" onclick="javascript:window.history.back();">返回上一页</a>
        </div>
        {/if}
    </div>
</body>
<script type="text/javascript">
    var hasredirect = "{if !isset($hasredirect) || $hasredirect == '1'}1{else /}2{/if}", redirectUrl = "{$redirect??''}";
    window.onload = function () {
        if (hasredirect === '1') {
            setTimeout(function () {
                if (redirectUrl == '') {
                    window.history.back()
                } else {
                    window.location.href = redirectUrl;
                }
            }, 3e3);
        }
    }
</script>

</html>
