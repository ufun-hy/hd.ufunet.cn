<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
<meta http-equiv="X-UA-Compatible" content="ie=edge">
<title>{$title??'404 not found'}</title>
<meta name="author" content="株洲米波网络科技有限公司">
<meta name="copyright" content="株洲米波网络科技有限公司"> 
<style type="text/css">
body{
  position: absolute;
  top:0;
  left: 0;
  width: 100%;
  height: 100%;
}
.zam-flex-column-center {
    display:-webkit-box;
    display:-moz-box;
    display:-ms-flexbox;
    display:-webkit-flex;
    display:flex;
    -webkit-box-align:center;
    -webkit-align-items:center;
    -ms-flex-align:center;
    align-items:center;
    -webkit-box-pack:center;
    -webkit-justify-content:center;
    -ms-flex-pack:center;
    justify-content:center;
    -webkit-box-orient:vertical;
    -webkit-box-direction:normal;
    -webkit-flex-direction:column;
    -ms-flex-direction:column;
    flex-direction:column;
}
* {
    padding:0;
    margin:0;
    font-family: 'Microsoft Yahei';
}
a {
    text-decoration:none
}
.notfoud-container .img-404 {
    height:155px;
    margin-top:40px;
    margin-bottom:20px;
    background:url({:tomedia('static/images/sys/404.png')}) center center no-repeat;
    background-size:150px auto;
}
.notfoud-container .notfound-p {
    line-height:22px;
    font-size:17px;
    padding-bottom:15px;
    border-bottom:1px solid #f6f6f6;
    text-align:center;
    color:#262b31
}
.notfoud-container .notfound-reason {
    color:#9ca4ac;
    font-size:13px;
    line-height:13px;
    text-align:left;
    width:210px;
    margin:0 auto
}
.notfoud-container .notfound-reason p {
    margin-top:13px
}
.notfoud-container .notfound-reason ul li {
    margin-top:10px;
    margin-left:36px
}
.notfoud-container .notfound-btn-container {
    margin:40px auto 0;
    text-align:center
}
.notfoud-container .notfound-btn-container .notfound-btn {
    display:inline-block;
    border:1px solid #ebedef;
    background-color:#239bf0;
    color:#fff;
    font-size:15px;
    border-radius:5px;
    text-align:center;
    padding:10px;
    line-height:16px;
    white-space:nowrap
}
</style>
</head>
<body class="zam-flex-column-center">
<div class="notfoud-container">
    <div class="img-404"></div>
    <p class="notfound-p">哎呀迷路了...</p>
    <div class="notfound-reason">
        <p>可能的原因：</p>
        <ul>
            <li>原来的页面不存在了</li>
            <li>我们的服务器被外星人劫持了</li>
        </ul>
    </div>
    <div class="notfound-btn-container">
        <a class="notfound-btn" href="javascript:void(0)" onclick="javascript:window.history.back();">返回上一页</a>
    </div>
</div>
</body>
{if $autogo}
<script type="text/javascript">
window.onload = function(){
    setTimeout(function(){
        window.history.back();
    },2e3);
}
</script>
{/if}
</html>
