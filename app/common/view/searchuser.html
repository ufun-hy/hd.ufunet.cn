<style>
.user-item{position:relative;width:100px;min-height:100px;}
.user-item .zam-select{position:absolute;top:20px;left:0px;}
.user-item img{width:50px;height:50px;border-radius:50%;}
.resultuser{
	flex-wrap: wrap;
    justify-content: center;
}
</style>
<div id="formBox" class="zam-formvalidation form-horizontal">
<div class="form-group">
	<div class="zam-confirmBox-right col-md-12">
		<div class="input-group">
			<input type="text" class="form-control username" name="username" placeholder="请输入用户名或手机号">
			<div class="input-group-addon btn btn-primary searchone"><i class="mdi mdi-magnify"></i> 搜索</div>
		</div>
	</div>
</div>
<div class="form-group">
<ul class="resultuser zam-flex"></ul>
</div>
</div>
<script id="user-tpl" type="text/template">
	<li class="zam-flex-column-center user-item m-b-10">
		<span class="zam-select">
			<label class=" lyear-checkbox checkbox-primary ">
              <input value="<% d.id %>" name="selectuser[]" type="checkbox">
              <span></span>
            </label>
		</span>
		<div><% d.user_name %></div>
		<div><% d.user_mobile %></div>
	</li>
</script>
<script>
require(["webcore","zamnotice"],function(webcore,zamnotice){
	$(".searchone").on('click',function(){
		var searchval = $(".username").val();
		if(searchval=='') return zamnotice.showTips('error','请先输入搜索内容');
		webcore.ajaxSubmit("{:gocommon('basic/searchuser')}",{search:searchval},'正在拼命查找用户...').then(function(json){
			if(json.code==0){
				var html = '';
				$.each(json.msg,function(i,v){
					 html += webcore.tpl($("#user-tpl"),v);
				});
				$(".resultuser").html(html);
				if(html==''){
					zamnotice.showTips('error','未搜索到相关用户');
				}
			}else{
				$(".resultuser").html('');
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
});
</script>
