<div class="xjhbbox{if isset($sendhbtype) && $sendhbtype!='1'} hidden{/if}">
<div class="form-group">
  <label class="col-lg-2 control-label">* 发放主题名</label>
  <div class="col-lg-7">
    <input class="form-control inputneedmax" type="text"  name="sendredpackinfo[act_name]" placeholder="" value="{$config['sendredpackinfo']['act_name']}" maxlength="10">
    <span class="help-block">限10个字内</span>
  </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">* 发放主办方</label>
  <div class="col-lg-7">
    <input class="form-control inputneedmax" type="text"  name="sendredpackinfo[send_name]" placeholder="" value="{$config['sendredpackinfo']['send_name']}" maxlength="10">
    <span class="help-block">限10个字内</span>
  </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">* 发放祝福</label>
  <div class="col-lg-7">
    <input class="form-control inputneedmax" type="text"  name="sendredpackinfo[wishing]" placeholder="" value="{$config['sendredpackinfo']['wishing']}" maxlength="42">
    <span class="help-block">限42个字内</span>
  </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">* 发放备注</label>
  <div class="col-lg-7">
    <input class="form-control inputneedmax" type="text"  name="sendredpackinfo[remark]" placeholder="" value="{$config['sendredpackinfo']['remark']}" maxlength="85">
    <span class="help-block">限85个字内</span>
  </div>
</div>
</div>
<div class="qyfk{if isset($sendhbtype) && $sendhbtype=='1'} hidden{/if}">
<div class="form-group">
  <label class="col-lg-2 control-label">* 发放备注(企业付款或商家转账接口)</label>
  <div class="col-lg-7">
    <input class="form-control inputneedmax" type="text"  name="sendredpackinfo[desc]" placeholder="" value="{$config['sendredpackinfo']['desc']}" maxlength="32">
    <span class="help-block">限32个字内</span>
  </div>
</div>
</div>
