<script id='multiimg-item-tpl' type="text/template">
    <div class="multi-item">
        <img src="<% d.filesrc %>" onerror="this.src='/static/images/sys/nopic.jpg'; this.title='图片未找到'" class="img-responsive img-thumbnail">
        <input type="hidden" name="<% d.inputname %>[]" value="<% d.filepath %>" >
        <i class="mdi mdi-close" title="删除图片" onclick="javascript:$(this).parent().remove()"></i>
    </div>
</script>
<script id='importxls-tpl' type="text/template">
<div class="form-horizontal confirmbox-pop">
    <%# if(d.moban!=''){ %>
    <div class="form-group">
        <span class="col-lg-3 text-right">模板</span>
        <div class="col-lg-6">
            <a href="<% d.moban %>" class="btn btn-success btn-sm">点击下载模板</a>
        </div>
    </div>
    <%# } %>
    <div class="form-group">
        <span class="col-lg-3 text-right">上传</span>
        <div class="col-lg-9">
            <a href="javascript:;" class="btn btn-primary btn-sm" style="pointer-events:none"><% d.uptxt %></a>
            <input  style="position: absolute;opacity:0;top: 0;left: 0;z-index: 1;" class="xlsfile" type="file" name="file" onchange="readexcl(this)" data-filetype="<% d.filetype %>" accept="<%# if(d.filetype=='xls'){ %>.xls<%# }else{ %>text/plain<%# } %>" />
            <div class="help-block"><% d.xlstxt %></div>
        </div>
    </div>
    <div class="form-group placefilename hidden">
        <span class="col-lg-3 text-right">本地<% d.filetype %>文件</span>
        <div class="col-lg-9">
            <div class="filename"><span class="text-danger"></span></div>
        </div>
    </div>
</div>
</div>
</script>
