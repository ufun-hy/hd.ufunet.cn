<input type="hidden" class="styleid" name="styleid" value="{if isset($config['id'])}{$config['id']}{/if}">
<div class="form-group">
    <label class="col-lg-2 control-label">* 是否开启</label>
    <div class="col-lg-8">
        {:tpl_switch('status',$config['status'])}
        <span class="zam-help-block">关闭后用户无法选择该风格</span>
    </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">* 排序</label>
  <div class="col-lg-7">
    <input class="form-control" type="text"  name="displayorder" placeholder="请填写数字" value="{$config['displayorder']}">
    <div class="help-block">注:序号越大风格将越在前面，具体风格排序先按排序序号大小降序，再按风格id大小升序</div>
  </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">* 风格名称</label>
  <div class="col-lg-7">
    <input class="form-control" type="text"  name="stylename" placeholder="请务必填写一个您觉得唯一的名称" value="{$config['stylename']}">
    <div class="help-block">注:部分游戏在微信端或大屏幕菜单会使用此风格名次作为游戏名称</div>
  </div>
</div>
<div class="form-group">
    <label class="col-lg-2 control-label">* 预览图</label>
    <div class="col-lg-8">
        {:tpl_image_one('styleimg',$config['styleimg'])}
        <span class="help-block">尺寸控制在180*101px内</span>
    </div>
</div>
