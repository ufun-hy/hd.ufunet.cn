<div class="config-titlebox"><span class="config-titlename">音效与启动过渡</span></div>
{include file="$Wpath/common/configscreenmusic" /}
<div class="form-group">
    <label class="col-lg-2 control-label">抽奖进行中音效</label>
    <div class="col-lg-8">
        {:tpl_audio('iscjingmusic',$config['iscjingmusic'])}
        <span class="help-block">尽量控制在200KB内</span>
    </div>
</div>
<div class="form-group">
    <label class="col-lg-2 control-label">中奖揭晓音效</label>
    <div class="col-lg-8">
        {:tpl_audio('iscjendmusic',$config['iscjendmusic'])}
        <span class="help-block">尽量控制在200KB内</span>
    </div>
</div>
<div class="form-group">
		<label class="col-lg-2 control-label">开始抽奖过渡视频</label>
		<div class="col-lg-8">
			{:tpl_video('styleconfig[hidevideo]',$config['styleconfig']['hidevideo'])}
			<span class="help-block">规格:1920px * 1080px。设置后，播放结束再开始抽奖动画。</span>
		</div>
	</div>
