<div class="form-group">
    <label class="col-lg-2 control-label">* 自定义欢迎页大图</label>
    <div class="col-lg-8">
        {:tpl_switch('welcometoptype',$config['welcometoptype'],'openwelcometop')}
        <span class="help-block">默认使用风格内的欢迎页大图</span>
    </div>
</div>
<div class="form-group welcometopbox{if $config['welcometoptype']=='2'} hidden{/if}">
    <label class="col-lg-2 control-label">* 欢迎页顶部大图</label>
    <div class="col-lg-8">
        {:tpl_image_one('welcometop',$config['welcometop'])}
        <span class="help-block">{$welcometopdes}</span>
    </div>
</div>
<script type="text/javascript">
function openwelcometop(obj,status,url){
    if(status=='1'){
        obj.prev().val('2');
        obj.attr('data-status','2');
        $(".welcometopbox").addClass('hidden');
    }else{
        obj.prev().val('1');
        obj.attr('data-status','1');
        $(".welcometopbox").removeClass('hidden');
    }
    obj.prev().prev().prop("checked",status=='1'?false:true);
}
</script>
