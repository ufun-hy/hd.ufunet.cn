<div class="form-group">
<label class="col-lg-3  control-label">* 抽奖3D图形选择</label>
<div class="col-lg-8">   
    <select name="anishape" class="form-control">
        {volist name="shapes" id="shape" key='skey'}
            <option value="{$skey}" {if $config['anishape']==$skey}selected="selected"{/if}>{$shape}</option>
        {/volist}
    </select>
    <div class="help-block">每种图形都不一样可以给不同的[title]设置不同的3D图形</div>
</div>
</div>
