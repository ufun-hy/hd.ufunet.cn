<div class="form-group{if !dzcjgroupnums()} hidden{/if}">
    <label class="col-lg-2 control-label">* 设置分组抽取人数</label>
    <div class="col-lg-8">
        {:tpl_switch('setonegroupnum',$config['setonegroupnum']??'2')}
        <span class="help-block">
            <div>开启此项则奖品所选签到分组或自定义分组时支持给每个组设置抽取人数</div>
            <div><span class="text-danger">注意事项:</span></div>
            <div>1 奖品设置了某个分组抽取人数后，必须设置单次抽取人数与奖品总数相等，即为同一个奖品不能分多次抽取</div>
            <div>2 奖品若添加了特殊用户会导致部分分组设置的人数名额被特殊用户占用</div>
            <div>3 开启按轮次抽奖则分组设置的抽取人数会无效</div>
        </span>
    </div>
</div>
