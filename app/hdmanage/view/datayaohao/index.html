{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-group m-l-5">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">选择轮次</span>
          <select id="rotateid" class="form-control">
            {if empty($rotates)}
                <option value="0">暂无轮次</option>
            {/if}
            {foreach $rotates as $key=>$rotate} 
                <option value="{$rotate['id']}" {if $rotateid==$rotate['id']}selected{/if}>{$rotate['rotatetitle']}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    <a class="btn btn-success btn-sm btn-export2" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出全部</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('datayaohao/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            del:true,
        },
        func:{
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要删除该中奖记录数据么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('datayaohao/dellucker',['hdid'=>$hdid])}",{rotateid:$("#rotateid option:selected").val(),userid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'rotatetitle',
            title: '轮次',
            align: 'center',
        }
        {foreach $fieldconfig as $fkey=>$fval}
        ,{
            field: '{$fkey}',
            title: '{$fval['fieldname']}',
            align: 'center',
        }
        {/foreach}
        ,{
            field: 'create_time',
            title: '时间',
            align: 'center',
        }
    ],
    searchParamas:[{'type':'2','id':'rotateid'}],
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要删除选中的中奖记录么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datayaohao/dellucker',['hdid'=>$hdid])}",{rotateid:$("#rotateid option:selected").val(),userid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所选轮次内的所有中奖记录并且无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datayaohao/resetlucker',['hdid'=>$hdid])}",{rotateid:$("#rotateid option:selected").val()}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$('#rotateid').change(function(e) {
    webtable.refresh();
});
$('.btn-export').on('click',function(){
    var rotateid = $("#rotateid option:selected").val()||'';
    if(+rotateid < 1) {
        return zamnotice.showTips('info','请选择轮次');
    }
    webcore.ajaxSubmit("{:gohdmanage('datayaohao/exportlucker',['hdid'=>$hdid])}",{rotateid:rotateid}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = `{:gohdmanage('datayaohao/exportlucker',['hdid'=>$hdid])}&rotateid=${rotateid}`;
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
$('.btn-export2').on('click',function(){
    webcore.ajaxSubmit("{:gohdmanage('datayaohao/exportlucker',['hdid'=>$hdid,'type'=>'2'])}",{}).then(function(json){
        if(json.code != 0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = "{:gohdmanage('datayaohao/exportlucker',['hdid'=>$hdid,'type'=>'2'])}";
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
});
</script>
