{include file='$Wpath/common/header'}
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('configdhh/cate',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:true,
            del:true,
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑分类","{:gohdmanage('configdhh/addcate',['hdid'=>$hdid])}",{ishtml:'1',cateid:row.id},'html','col-lg-10 col-lg-offset-1',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.cateid = row.id;
                    postData.ishtml = '2';
                    webcore.ajaxSubmit("{:gohdmanage('configdhh/addcate',['hdid'=>$hdid])}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('configdhh/delcate',['hdid'=>$hdid])}",{cateid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            }
        }
    },
    columns:[{
            checkbox: true,
            width:'5',
        }, 
        {
            field: 'id',
            title: 'Id',
            align: 'center',
            visible: false,
            width:'5',
        },{
            field: 'catename',
            title: '分类名称',
            align: 'center',
            width:'15',
        },{
            field: 'goodsnum',
            title: '商品',
            align: 'center',
            width:'30',
            formatter:function(value,row,index){
                return `<div class="m-b-5">${value}种</div>`;
                //<a href="javascript:;" class="btn btn-primary btn-sm btn-detail-row" data-id="'+row.id+'"">商品一览</a>';
            }
        },
        {
            field: 'create_time',
            title: '创建时间',
            align: 'center',
            width:'11',
        }
        
    ],
    searchParamas:[],
    toolbar:{
        add:function(){
            var confirmObj = jconfirmBox.ajaxconfirm("新增分类","{:gohdmanage('configdhh/addcate',['hdid'=>$hdid])}",{ishtml:'1'},'html','col-lg-10 col-lg-offset-1',function(e){
                var postData = webcore.serializeObject(e.find('form'));
                postData.ishtml = '2';
                webcore.ajaxSubmit("{:gohdmanage('configdhh/addcate',['hdid'=>$hdid])}",postData,'正在新增分类...').then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','创建成功');
                        confirmObj.close();
                    }else{
                        zamnotice.showTips('error',json.msg);
                         return false;
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                     return false;
                });
            });
        },
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('configdhh/delcate',['hdid'=>$hdid])}",{cateid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有分类并无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('configdhh/resetcate',['hdid'=>$hdid])}",{}).then(function(json){
                    webtable.refresh();
                    zamnotice.showTips('success','操作成功');
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                });
            });
        }
    },
};
webtable.init(initConfig);
$("#listtable").on('click','.btn-detail-row',function() {
    var cateid = $(this).attr('data-id');
    var confirmobj = jconfirmBox.ajaxconfirm("本轮商品下单一览","{:gohdmanage('configdhh/categoods',['hdid'=>$hdid])}",{cateid:cateid},'html','col-lg-10 col-lg-offset-1',function(e){},false,'2');
});
});
</script>
{include file='$Wpath/common/footer'}
