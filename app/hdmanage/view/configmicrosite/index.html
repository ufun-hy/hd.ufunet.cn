{include file='$Wpath/common/header'}
<div class="alert alert-danger">请务必设置一个页面作为默认页面</div>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">页面标题</span>
        <input type="text" class="form-control" value="" id="keyword" name="keyword" placeholder="请输入页面标题">
      </div>
    </div>
    <div class="form-group">
        <div class="input-group input-group-sm">
          <span class="input-group-addon">默认首页</span>
            <select id="isindex" class="form-control js_select2"  style="width:120px">
                <option value="">请选择</option>
                <option value="-1" selected>全部</option>
                <option value="1">是</option>
                <option value="2">否</option>
            </select>
          </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('configmicrosite/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:true,
            {if request()->hdinfo['hdmode']=='1'}
                shenhe:{title:"二维码与链接",icon:"mdi-qrcode",class:"primary"},
            {/if}
            refund:{title:"复制",icon:"mdi-content-copy",class:'primary btn-copyrotate'},
            del:true,
        },
        func:{
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('configmicrosite/del',['hdid'=>$hdid])}",{pageid:row.id},'处理中..').then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑页面","{:gohdmanage('configmicrosite/edit',['hdid'=>$hdid])}",{ishtml:'1',pageid:row.id},'html','col-lg-8 col-lg-offset-2',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.pageid = row.id;
                    postData.ishtml = '2';
                    webcore.ajaxSubmit("{:gohdmanage('configmicrosite/edit',['hdid'=>$hdid])}",postData,'正在提交....').then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                            return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                        return false;
                    });
                });
            },
            shenhe:function(value, row, index){
                var confirmobj = jconfirmBox.ajaxconfirm("页面二维码与链接","{:gohdmanage('configmicrosite/qrcode',['hdid'=>$hdid])}",{pageid:row.id},'html','col-lg-8 col-lg-offset-2',function(e){
                    confirmobj.close();
                },false,'2');
            },
            refund:function(value, row, index){
                jconfirmBox.confirm('温馨提示','复制将使用选择的页面数据来生成一个新页面，您确定要复制当前页面么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('configmicrosite/copy',['hdid'=>$hdid])}",{pageid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','复制成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            width:'6%',
            visible: false
        }, {
            field: 'displayorder',
            title: '排序序号',
            align:'center',
            width:'6%',
        }, {
            field: 'diydata',
            title: '页面名称',
            align:'center',
            formatter: function (value, row, index) {
                var html = `<div>${value.pageset.name || value.pageset.title}${!row.diydata ? '<span class="text-danger" style="font-size:12px">(未添加页面组件)</span>': ''}</div>`;
                html += `<a href="{:gohdmanage('configmicrosite/diy',['hdid'=>$hdid])}&pageid=${row.id}" target="__blank" class="btn btn-primary btn-xs mt10"><i class="mdi mdi-pencil"></i> 页面装修</a>`
                return html;
            },
        },{
            field: 'isindex',
            title: '默认页面',
            align: 'center',
            width:'10%',
            formatter: function(value, row, index){
                var html = '',checked = value == '1' ? "checked='checked'" : "";
                html += '<label class="lyear-switch switch-primary switch-solid" style="height:38px"><input type="checkbox" '+checked+'><span class="default-span" data-pageid="'+row.id+'"></span></label>';
                return html;
            },
        }, {
            field: 'previewimg',
            title: '预览图',
            align:'center',
            width:'20%',
            formatter: function (value, row, index) {
                return value ? '<img width="50px" src="'+value+'" onclick="prevshowattachs(this,1);" style="cursor:pointer">' : '-';
            },
        }, {
            field: 'pageset',
            title: '访问方式',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                var html = '<div>'+(row.diydata.pageset.browsertype == '1' ? '<span class="label label-danger">仅限微信</span>' : '<span class="label label-success">所有浏览器均可</span>')+'</div>';
                html += '<div class="mt10">微信访问跳过登录: '+(row.diydata.pageset.wxskiplogin == '1' ? '<span class="label label-danger">是</span>' : '<span class="label label-success">否</span>')+'</div>';
                return html
            },
        },  {
            field: 'create_time',
            title: '创建时间',
            align: 'center',
            width:'12%',
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'},{'type':'2','id':'isindex'}],
    toolbar:{
        add:function(){
            var confirmObj = jconfirmBox.ajaxconfirm("新增页面","{:gohdmanage('configmicrosite/add',['hdid'=>$hdid])}",{ishtml:'1'},'html','col-lg-8 col-lg-offset-2',function(e){
                var postData = webcore.serializeObject(e.find('form'));
                postData.ishtml = '2';
                webcore.ajaxSubmit("{:gohdmanage('configmicrosite/add',['hdid'=>$hdid])}",postData,'正在提交....').then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','新增成功');
                        confirmObj.close();
                    }else{
                        zamnotice.showTips('error',json.msg);
                         return false;
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                     return false;
                });
            });
        },
        del:function(ajaxurl){
            var getSelects = webtable.getSelections();
            if(getSelects.length>0){
                jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除选中的数据么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('configmicrosite/del',['hdid'=>$hdid])}",{pageid:getSelects},'处理中..').then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差,操作失败');
                    });
                });
            }else{
                zamnotice.showTips('info','请先选择您要操作的数据');
            }
        }
    },
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
     webtable.refresh();
});
$("#listtable").on('click','.default-span',function(){
    var $this = $(this).prev(),pageid = $(this).attr('data-pageid');
    webcore.ajaxSubmit("{:gohdmanage('configmicrosite/setindex',['hdid'=>$hdid])}",{pageid:pageid}).then(function(json){
        if(json.code!=0){
            $this.prop('checked',checked);
            zamnotice.showTips('error',json.msg);
        }else{
            webtable.refresh();
            zamnotice.showTips('success','设置默认页面成功');
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
        $this.prop('checked',checked);
    });
});
});
</script>
{include file='$Wpath/common/footer'}
