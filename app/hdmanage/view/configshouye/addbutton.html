<div class="form-horizontal confirmbox-pop">
  <form class="confirm-formbox" method="post">
  <div class="carditem">
    <div class="form-group">
      <label class="col-lg-3 control-label">* 按钮名</label>
      <div class="col-lg-7">
        <input class="form-control" type="text"  name="name" placeholder="请输入文字内容" value="">
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 背景色</label>
      <div class="col-lg-7">
         {:tpl_color('bgcolor','#ffffff')}
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 链接</label>
      <div class="col-lg-7">
        <input type="text" class="form-control" name="url" value="">
      </div>
    </div>
 </div>
</form>
</div>
<script type="text/javascript">
$(function(){
  $(".js-colorpicker").each(function(){
        tpl_colorpicker(this);
  });
})
</script>
