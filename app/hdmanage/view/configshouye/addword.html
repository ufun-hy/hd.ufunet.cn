<div class="form-horizontal confirmbox-pop">
  <form class="confirm-formbox" method="post">
  <div class="carditem">
    <div class="form-group">
      <label class="col-lg-3 control-label">* 内容</label>
      <div class="col-lg-7">
        <input class="form-control" type="text"  name="content" placeholder="请输入文字内容" value="">
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 颜色</label>
      <div class="col-lg-7">
         {:tpl_color('color','#ffffff')}
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 大小</label>
      <div class="col-lg-7">
        <div class="input-group">
            <input type="text" class="form-control" name="size" value="16">
            <div class="input-group-addon">px</div>
        </div>
      </div>
    </div>
 </div>
</form>
</div>
<script type="text/javascript">
$(function(){
  $(".js-colorpicker").each(function(){
        tpl_colorpicker(this);
  });
})
</script>
