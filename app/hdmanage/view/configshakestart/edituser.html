<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
 <div class="form-group{if !isset($dluser['id'])} hidden{/if}">
    <label class="col-lg-3 control-label">* 状态</label>
    <div class="col-lg-8">
      <label class="lyear-radio radio-inline radio-primary" onclick="showMoneyBox(this)">
       <input type="radio" name="status" value="1" {if $dluser['status']=='1'}checked{/if}><span>已点亮</span>
      </label>
      <label class="lyear-radio radio-inline radio-primary" onclick="showMoneyBox(this)">
       <input type="radio" name="status" value="2" {if $dluser['status']=='2'}checked{/if}><span>待点亮</span>
      </label>
    </div>
 </div>
 <div class="form-group">
	<label class="col-lg-3 control-label">* 用户头像</label>
	<div class="col-lg-8">
	   {:tpl_image_one('userimg',$dluser['userimg'])}
	   <span class="zam-help-block">规格:200*200px</span>
	</div>
 </div>
 <div class="form-group">
	<label class="col-lg-3 control-label">* 用户名</label>
	<div class="col-lg-8">
	  <input type="text" class="form-control"  name="username" value="{$dluser['username']}" maxlength="20" placeholder="20字内">
	</div>
 </div>
 <div class="form-group">
	<label class="col-lg-3 control-label">* 编号</label>
	<div class="col-lg-8">
	  <input type="text" class="form-control"  name="usernumber" value="{$dluser['usernumber']}" maxlength="20" placeholder="20字内">
	</div>
 </div>
</form>
</div>
