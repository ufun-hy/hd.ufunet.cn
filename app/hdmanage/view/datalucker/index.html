{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">昵称/姓名/手机</span>
        <input type="text" class="form-control" value="" id="keyword" name="username" placeholder="请输入昵称/姓名/手机号">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">功能</span>
          <select id="fromtype" class="form-control js_select2">
          	<option value="0">全部功能</option>
            {foreach $modulelists as $k=>$v } 
            <option value="{$k}">{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group m-l-5">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">核销状态</span>
          <select id="hxtype" class="form-control js_select2">
            {foreach $hxtypes as $k=>$v} 
                <option value="{$k}" {if $k == '0'}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group m-l-5">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">红包发放状态</span>
          <select id="sendtype" class="form-control js_select2">
            {foreach $sendtypes as $k=>$v} 
                <option value="{$k}" {if $k == '0'}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('datalucker/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            del:true,
        },
        func:{
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除中奖记录将无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('datalucker/dellist',['hdid'=>$hdid])}",{recordid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'userinfohtml',
            title: '用户',
            align: 'center',
            width:'15',
        },{
            field: 'fromtypehtml',
            title: '来源',
            align: 'center',
        },{
            field: 'prizetypetxt',
            title: '奖品类型',
            align: 'center',
        },  {
            field: 'prizeinfohtml',
            title: '奖品信息',
            align: 'center',
        },  {
            field: 'raddresshtml',
            title: '收货信息',
            align: 'center',
            width:'15%',
        },  {
            field: 'hxsendmorehtml',
            title: '核销/发放',
            align: 'center',
            width:'15%',
        },  {
            field: 'create_time',
            title: '中奖时间',
            align: 'center',
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'},{'type':'2','id':'fromtype'},{'type':'2','id':'hxtype'},{'type':'2','id':'sendtype'}],
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除选中的中奖记录么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datalucker/dellist',['hdid'=>$hdid])}",{recordid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有中奖记录并且无法恢复，您确定要清空所有的中奖记录么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datalucker/resetall',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        export:function(){
            webcore.ajaxSubmit("{:gohdmanage('datalucker/export',['hdid'=>$hdid])}",{}).then(function(json){
                if(json.code!=0){
                    zamnotice.showTips('error',json.msg);
                }else{
                    window.location.href = "{:gohdmanage('datalucker/export',['hdid'=>$hdid])}";
                }
            }, function(json){
                zamnotice.showTips('error','网络差,操作失败');
            });
        },
    },
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
     webtable.refresh();
});
})
</script>
{include file='$Wpath/common/footer'}
