<style type="text/css">
.pulladdrAlert .btn.isdoing{cursor: not-allowed;pointer-events: none;}
.processbox{font-size: 24px;}
.processbox .hadnum{color: red}
</style>
<div class="alert alert-danger">
	注:批量获取用户ip地址时间比较长，请耐心等待获取完成<br>
	仅系统内置ip库未获取到用户ip地址的用户才能发起获取，如需获取活动全部用户ip地址请选择获取全部用户<br>
	此操作耗时耗资源推荐服务器空闲时间进行
</div>
<div class="zam-confirmBox form-horizontal pulladdrAlert">
	<div class="form-group">
	    <label class="col-lg-4 control-label">* 类型</label>
	    <div class="col-lg-6">
	        <label class="lyear-radio radio-inline radio-primary">
	            <input type="radio" name="usertype" checked value="1"><span>无ip地址用户</span>
	        </label>
	        <label class="lyear-radio radio-inline radio-primary">
	            <input type="radio" name="usertype" value="2"><span>活动全部用户</span>
	        </label>
	    </div>
	</div>
	<div class="form-group">
	    <label class="col-lg-4 control-label">* 用户量</label>
	    <div class="col-lg-6">
	    	<div class="form-control-static"><span class="totalnum typepersonnum">{$count}</span>人</div>
	    </div>
	</div>
	<div class="form-group">
		<div class="text-center m-t-10">
			<a class="btn btn-primary btn-start m-r-15"><span>立即启动</span></a>
			<a class="btn btn-warning btn-cancel m-l-15"><span>取消</span></a>
		</div>
	</div>
	<div class="text-center processbox m-t-15 hidden">已完成：<span class="hadnum">0</span> <span>/</span> <span>共：<span class="totalnum">{$count}</span></span></div>
</div>
