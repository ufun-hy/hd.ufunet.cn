{include file='$Wpath/common/header'}
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice','clipboard','layerBox','jcode'],function(webcore,webtable,jconfirmBox,zamnotice,Clipboard,layerBox){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('configjika/cate',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:true,
            del:true,
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑分类","{:gohdmanage('configjika/editcate',['hdid'=>$hdid])}",{cateid:row.id},'html','col-lg-10 col-lg-offset-1',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.cateid = row.id;
                    webcore.ajaxSubmit("{:gohdmanage('configjika/savecate',['hdid'=>$hdid])}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除将删除当前卡包以及对应的卡包集卡数据无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('configjika/delcate',['hdid'=>$hdid])}",{cateid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center'
        }
        , {
            field: 'catename',
            title: '卡包名称',
            align: 'center',
        }, {
            field: 'cateimg',
            title: '卡图',
            align: 'center',
            formatter:function(value,row,index){
                return '<img src="'+value+'" width="100px;" />';
            }
        }, {
            field: 'cardnums',
            title: '碎片数量',
            align: 'center',
            formatter:function(value,row,index){
                return '<div><span>'+value+'个碎片</span></div><div class="m-t-5"><a class="btn btn-primary btn-cards btn-xs " href="javascript:void(0)">管理碎片</a></div>';
            },
            events: {
                'click .btn-cards': function (event, value, row, index) {
                    var rotateid = $(this).attr('data-rotateid');
                    var confirmobj = jconfirmBox.ajaxconfirm("碎片管理","{:gohdmanage('configjika/showallcards',['hdid'=>$hdid])}",{cateid:row.id},'html','col-lg-10 col-lg-offset-1',function(e){
                            
                    },false,'2');
                },
            }
        }
        ,{
            field: 'create_time',
            title: '创建时间',
            align: 'center',
        }
    ],
    searchParamas:[],
    toolbar:{
        add:function(){
            var confirmObj = jconfirmBox.ajaxconfirm("新增分类","{:gohdmanage('configjika/editcate',['hdid'=>$hdid])}",{},'html','col-lg-10 col-lg-offset-1',function(e){
                var postData = webcore.serializeObject(e.find('form'));
                webcore.ajaxSubmit("{:gohdmanage('configjika/savecate',['hdid'=>$hdid])}",postData).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','创建成功');
                        confirmObj.close();
                    }else{
                        zamnotice.showTips('error',json.msg);
                         return false;
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                     return false;
                });
            });
        },
        del:function(){
            var getSelects = webtable.getSelections();
            if(getSelects.length>0){
                jconfirmBox.confirm('温馨提示','删除将同步删除所选卡包以及卡包对应的所有集卡数据并且无法恢复，您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('configjika/delcate',['hdid'=>$hdid])}",{cateid:getSelects}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差,操作失败');
                    });
                });
            }else{
                zamnotice.showTips('info','请先选择您要操作的数据');
            }
        },
        shenhe:function(){
            var getSelects = webtable.getSelections();
            if(getSelects.length>0){
                jconfirmBox.confirm('温馨提示','重置将删除所选卡包对应的所有集卡数据，无法恢复恢复,您确定要重置么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('configjika/resetcate',['hdid'=>$hdid])}",{cateid:getSelects}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','重置成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差,操作失败');
                    });
                });
            }else{
                zamnotice.showTips('info','请先选择您要操作的数据');
            }
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有卡包数据以及所有卡包的集卡数据并且无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('configjika/resetallcate',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$("body").on('click','.btn-addcard',function(){
    var cateid = $(this).data('cateid');
    var confirmObj = jconfirmBox.ajaxconfirm("新增碎片","{:gohdmanage('configjika/editcard',['hdid'=>$hdid])}",{cateid:cateid},'html','col-lg-10 col-lg-offset-1',function(e){
        var postData = webcore.serializeObject(e.find('form'));
        postData.cateid = cateid;
        webcore.ajaxSubmit("{:gohdmanage('configjika/savecard',['hdid'=>$hdid])}",postData).then(function(json){
            if(json.code==0){
                $(".cardsBox-card").append(webcore.tpl($("#onecard-tpl"),json.msg));
                zamnotice.showTips('success','新增成功');
                confirmObj.close();
            }else{
                zamnotice.showTips('error',json.msg);
                 return false;
            }
        }, function(json){
            zamnotice.showTips('error','网络差。操作失败');
             return false;
        });
    });
});
$("body").on('click','.btn-editone',function(){
    var cateid = $(this).data('cateid'),cardid = $(this).data('cardid'),fdom = $(this).parent().parent();
    var confirmObj = jconfirmBox.ajaxconfirm("编辑碎片","{:gohdmanage('configjika/editcard',['hdid'=>$hdid])}",{cateid:cateid,cardid:cardid},'html','col-lg-10 col-lg-offset-1',function(e){
        var postData = webcore.serializeObject(e.find('form'));
        postData.cateid = cateid;
        postData.cardid = cardid;
        webcore.ajaxSubmit("{:gohdmanage('configjika/savecard',['hdid'=>$hdid])}",postData).then(function(json){
            if(json.code==0){
                fdom.find('td').eq(0).text(json.msg.cardname);
                fdom.find('td').eq(1).find('img').attr('src',json.msg.waitcardimg);
                fdom.find('td').eq(2).find('img').attr('src',json.msg.cardimg);
                zamnotice.showTips('success','新增成功');
                confirmObj.close();
            }else{
                zamnotice.showTips('error',json.msg);
                 return false;
            }
        }, function(json){
            zamnotice.showTips('error','网络差。操作失败');
             return false;
        });
    });
});
$("body").on('click','.btn-delcard',function(){
    var cardid = $(this).data('cardid'),fdom = $(this).parent().parent();
    jconfirmBox.confirm('温馨提示','删除将同步删除该碎片的用户集卡数据，无法恢复，您确定要删除么？',function(){
        webcore.ajaxSubmit("{:gohdmanage('configjika/delcard',['hdid'=>$hdid])}",{cardid:cardid}).then(function(json){
            if(json.code==0){
                fdom.remove();
                zamnotice.showTips('success','删除成功');
            }else{
                zamnotice.showTips('error',json.msg);
            }
        }, function(json){
            zamnotice.showTips('error','网络差,操作失败');
        });
    });
});
});
</script>
