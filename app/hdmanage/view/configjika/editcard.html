<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
    <div class="carditem">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 碎片名</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="cardname" value="{$config['cardname']}">
            </div>
        </div>
    </div>
    <div class="carditem">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 未获得碎片图</label>
            <div class="col-lg-8">
                {:tpl_image_one('waitcardimg',$config['waitcardimg'])}
            </div>
        </div>
    </div>
    <div class="carditem">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 碎片图</label>
            <div class="col-lg-8">
                {:tpl_image_one('cardimg',$config['cardimg'])}
            </div>
        </div>
    </div>
</form>
</div>
