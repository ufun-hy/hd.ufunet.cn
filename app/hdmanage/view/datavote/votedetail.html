<div class="zam-inline-searchbar searchplan">
	<div class="input-group zam-flex col-md-7">
		<input type="text" class="form-control" id="keyword" placeholder="请输入用户微信名">
		<span class="input-group-btn">
			<button onclick="plansearch(this)" class="btn btn-primary btn-search"><i class="mdi mdi-magnify"></i> 搜索</button>
		</span>
	</div>
</div>
<table class="table" style="margin-bottom:0px;">
<thead>
  <tr>
  	<th style="width:20%;text-align:center;">用户</th>
	<th style="width:30%;text-align:center;">票数</th>
	<th style="width:30%;text-align:center;">时间</th>
	<th style="width:20%;text-align:center;">操作</th>
  </tr>
</thead>
<tbody class="pf-lists"></tbody>
</table>
<div class="pf-pager" style="padding:10px;text-align: center;"></div>
<script id="detailpf-tpl" type="text/template">
	<tr>
		<td class="text-center">
			<div><img src="<% d.avatar %>" style="max-width:50px"/></div>
			<div class="m-t-10"><span class="label label-primary"><% d.nickname %></span></div>
		</td>
		<td class="text-center">
			1票
		</td>
		<td class="text-center">
			<% d.create_time %>
		</td>
		<td class="text-center">
			<a class="btn btn-danger btn-xs btn-del" data-recordid="<% d.id %>" title="删除" onclick="delvoterecord(this)"><i class="mdi mdi-close"></i></a>
		</td>
	</tr>
</script>
<script>
function ajaxvotelist(page,obj){ 
	require(["zamnotice","webcore"],function(zamnotice,webcore){
		webcore.ajaxSubmit("{:gohdmanage('datavote/votedetail',['hdid'=>$hdid])}",{ajaxtype:'2',rotateid:"{$rotateid}",voteid:"{$voteid}",page:page,nickname:$(".searchplan input").val()},'正在加载..').then(function(json){
			if(json.code==0){
				rushhtml(json);
			}else{
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
}
function initvotelist(){
	require(["zamnotice","webcore"],function(zamnotice,webcore){
		webcore.ajaxSubmit("{:gohdmanage('datavote/votedetail',['hdid'=>$hdid])}",{ajaxtype:'2',rotateid:"{$rotateid}",voteid:"{$voteid}",nickname:$(".searchplan input").val()},'正在加载..').then(function(json){
			var html = '';
			if(json.code==0){
				rushhtml(json);
			}else{
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
}
function plansearch(obj){ 
	require(["zamnotice","webcore"],function(zamnotice,webcore){
		var nickname = $(obj).parent().prev().val();
		if(nickname=='') return zamnotice.showTips('warning','请先输入微信昵称');
		webcore.ajaxSubmit("{:gohdmanage('datavote/votedetail',['hdid'=>$hdid])}",{ajaxtype:'2',rotateid:"{$rotateid}",voteid:"{$voteid}",nickname:nickname},'正在加载..').then(function(json){
			var html = '';
			if(json.code==0){
				rushhtml(json);
			}else{
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
}
function rushhtml(json){
	require(["webcore"],function(webcore){
		var html = '';
		var detaildata = json.msg.item;
		$.each(detaildata,function(i,v){
			v.detail = '';
			html += webcore.tpl($("#detailpf-tpl"),v);
		});
		$(".pf-lists").html(html);
		$(".pf-pager").html(json.msg.pager);
	});
}
function delvoterecord(obj){
	var recordid = $(obj).attr('data-recordid');
	require(["webcore","zamnotice","jconfirmBox"],function(webcore,zamnotice,jconfirmBox){
		jconfirmBox.confirm('温馨提示','您确定要删除该条投票记录么？',function(){
			webcore.ajaxSubmit("{:gohdmanage('datavote/delonerecord',['hdid'=>$hdid])}",{rotateid:"{$rotateid}",voteid:"{$voteid}",recordid:recordid},'正在加载..').then(function(json){
				if(json.code==0){
					zamnotice.showTips('success','删除成功');
					ajaxvotelist(1);
				}else{
					zamnotice.showTips('error',json.msg);
				}
			}, function(json){
				zamnotice.showTips('error','网络差。操作失败');
			});
		});
	});

}
initvotelist();
</script>
