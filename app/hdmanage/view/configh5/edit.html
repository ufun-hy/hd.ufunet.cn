{include file='$Wpath/common/header'}
<form id="formBox" class="zam-formvalidation form-horizontal" method="post">
<input type="hidden"  name="artid" value="{if isset($config['id'])}{$config['id']}{/if}">
<div class="form-group">
  <label class="col-lg-2 control-label">* 文章标题</label>
  <div class="col-lg-8">
    <input class="form-control" type="text"  name="apptitle" placeholder="请输入文章标题" value="{$config['apptitle']}">
  </div>
</div>
<div class="form-group">
  <label class="col-lg-2 control-label">文章内容</label>
  <div class="col-lg-8">
    {:tpl_ueditor('content',$config['content'])}
  </div>
</div>
{include file='$Wpath/common/cancelsavepanel'}
</form>
<script type="text/javascript">
require(['webcore','jconfirmBox','zamnotice','zvalidator'],function(webcore,jconfirmBox,zamnotice){
  $('#formBox').formValidation({
      framework: 'bootstrap',
      excluded: [':disabled'],
      message: '您填写的内容无效',
      fields: {}
  }).on('success.form.fv', function(e) {
    e.preventDefault();
    var $form = $(e.target);
    var postData = webcore.serializeObject($form);
    var bload = $form.find(".zam-fixedbottom button").lyearloading({opacity: 0.2,spinnerSize: 'nm'});
    $form.formValidation('disableSubmitButtons', true);
    webcore.ajaxSubmit("{:gohdmanage('configh5/edit',['hdid'=>$hdid])}",postData).then(function(json){
      bload.hide();
      if(json.code==0){
          $form.formValidation('disableSubmitButtons', false);
          zamnotice.showTips('success','{if isset($config['id'])}保存成功{else /}新增成功{/if}',1e3,function(){
            window.location.href = "{:gohdmanage('configh5/index',['hdid'=>$hdid])}";
          });
        }else{
            zamnotice.showTips('error',json.msg);
            $form.formValidation('disableSubmitButtons', false);
        }
    }, function(json){
      bload.hide();
      zamnotice.showTips('error','网络差。操作失败');
      $form.formValidation('disableSubmitButtons', false);
    });
  });
});
</script>
{include file='$Wpath/common/footer'}
