{include file='$Wpath/common/header'}
<style type="text/css">
.articlebox{
	max-height:100px;
    max-width: 100%;
	overflow: hidden;
}
</style>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">文章标题</span>
        <input type="text" class="form-control" value="" id="keyword" placeholder="请输入文章标题">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice','clipboard'],function(webcore,webtable,jconfirmBox,zamnotice,Clipboard){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('configh5/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:true,
            refund:{title:"复制链接",icon:"mdi-content-copy",class:"primary"},
            del:true,
        },
        func:{
            edit:function(value, row, index){
                window.location.href = "{:gohdmanage('configh5/edit',['hdid'=>$hdid])}&artid="+row.id;
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('configh5/del',['hdid'=>$hdid])}",{artid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
            refund:function(value, row, index){
                var link = "{:gowechat('apph5/index',['hdid'=>$hdid],true)}&artid="+row.id;
                var clipboard = new Clipboard('.btn-refund-one', {
                    text: function(e) {
                      return link;
                    }
                  });
                  clipboard.on('success',function(e) {
                     zamnotice.showTips('success','复制成功',2e3);
                     return;
                  })
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false,
            width:'10%',
        },{
            field: 'apptitle',
            title: '文章标题',
            align: 'center',
            width:'60%',
        }
        ,{
            field: 'create_time',
            title: '创建时间',
            align: 'center',
            width:'15%',
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'}],
    toolbar:{
        add:function(){
        	window.location.href = "{:gohdmanage('configh5/edit',['hdid'=>$hdid])}";
        },
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要删除选中的文章么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('configh5/del',['hdid'=>$hdid])}",{artid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
});
</script>
{include file='$Wpath/common/footer'}
