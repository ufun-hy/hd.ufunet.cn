<style type="text/css">
.edui-default .edui-toolbar .edui-for-fullscreen {
    display: none!important
}
#edui_fixedlayer{z-index: 1037!important}
</style>
<div class="form-horizontal confirmbox-pop">
  <div class="form-group">
	<label class="col-lg-2 control-label text-center">* 题目</label>
	<div class="col-lg-8">
	  {:tpl_ueditor('questitle', $config['questitle'],['height'=>'160','textareaclass'=>'questitle'])}
	</div>
  </div>
  <div class="form-group">
		<label class="col-lg-12 control-label" style="text-align: left;">* 题目选项与答案<span class="text-danger">(选项A与选项B必须填写，正确答案至少勾选一个)</span></label>
  </div>
  <div class="form-group">
		<label class="col-lg-2 control-label text-center">*A</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answera" name="answera" value="{$config['answera']}"  placeholder="此项必填">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
                        <input type="checkbox" name="yesanswer" value="A" {if strexists($config['yesanswer'],'A')}checked{/if}>
                        <span>正确答案</span>
                    </label>
                </div>
			</div>
		</div>
   </div>
   <div class="form-group">
		<label class="col-lg-2 control-label text-center">*B</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answerb" name="answerb" value="{$config['answerb']}" placeholder="此项必填">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
                        <input type="checkbox" name="yesanswer" value="B" {if strexists($config['yesanswer'],'B')}checked{/if}>
                        <span>正确答案</span>
                    </label>
                </div>
			</div>
		</div>
   </div>
   <div class="form-group">
		<label class="col-lg-2 control-label text-center">C</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answerc" name="answerc" value="{$config['answerc']}">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
                        <input type="checkbox" name="yesanswer" value="C" {if strexists($config['yesanswer'],'C')}checked{/if}>
                        <span>正确答案</span>
                    </label>
                </div>
			</div>
		</div>
   </div>
   <div class="form-group">
		<label class="col-lg-2 control-label text-center">D</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answerd" name="answerd" value="{$config['answerd']}">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
                        <input type="checkbox" name="yesanswer" value="D" {if strexists($config['yesanswer'],'D')}checked{/if}>
                        <span>正确答案</span>
                    </label>
                </div>
			</div>
		</div>
   </div>
   <div class="form-group">
		<label class="col-lg-2 control-label text-center">E</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answere" name="answere" value="{$config['answere']??''}">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
                        <input type="checkbox" name="yesanswer" value="E" {if strexists($config['yesanswer']??'','E')}checked{/if}>
                        <span>正确答案</span>
                    </label>
                </div>
			</div>
		</div>
   </div>
   	<div class="form-group answerfbox hidden">
		<label class="col-lg-2 control-label text-center">F</label>
		<div class="col-lg-8">
			<div class="input-group">
				<input type="text" class="form-control answerf" name="answerf" value="{$config['answerf']??''}">
				<div class="input-group-addon">
					<label class="lyear-checkbox checkbox-primary">
						<input type="checkbox" name="yesanswer" value="F" {if strexists($config['yesanswer']??'','F')}checked{/if}>
						<span>正确答案</span>
					</label>
				</div>
			</div>
		</div>
	</div>
  </div>
</div>
<script type="text/javascript">
require(['webcore',"ueditor"],function(webcore,UE){
	if($("#edui_fixedlayer").length > 0) UE.getEditor('questitle').destroy();
    $(function(){
      tpl_ueditor(); 
    })
});
</script>
