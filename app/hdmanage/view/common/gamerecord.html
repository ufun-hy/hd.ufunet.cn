{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-group m-l-5">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">选择轮次</span>
          <select id="rotateid" class="form-control">
            {if empty($rotates)}
                <option value="0">暂无轮次</option>
            {/if}
            {foreach $rotates as $key=>$rotate} 
                <option value="{$rotate['id']}" {if $rotateid == $rotate['id']}selected{/if}>{$rotate['title']}</option>
            {/foreach}
          </select>
        </div>
    </div>
    {if $gametype == 'tug'}
        <div class="form-group m-l-5">
          <div class="input-group input-group-sm">
            <span class="input-group-addon">选择队伍</span>
              <select id="teamid" class="form-control">
                {if !empty($rotateid) && isset($rotates[$rotateid])}
                <option value="1">{$rotates[$rotateid]['redname']}</option>
                <option value="2">{$rotates[$rotateid]['bluename']}</option>
                {/if}
              </select>
            </div>
        </div>
    {else}
        <div class="form-group m-l-5">
          <div class="input-group input-group-sm">
            <span class="input-group-addon">选择团队</span>
              <select id="teamid" class="form-control">
                <option value="0" selected>全部</option>
                {if !empty($rotateid) && isset($rotates[$rotateid]) && isset($rotates[$rotateid]['teams'])}
                    {foreach $rotates[$rotateid]['teams'] as $oneteam}
                    <option value="{$oneteam['id']}">{$oneteam['teamname']}</option>
                    {/foreach}
                {/if}
              </select>
            </div>
        </div>
    {/if}
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">昵称或表单内容</span>
        <input type="text" class="form-control" value="" id="keyword" placeholder="请输入用户昵称或表单内容">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    {if $gametype=='answerbs'}
        <a class="btn btn-warning btn-sm btn-exportquestiondata" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出答题明细数据</a>
    {/if}
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
var $rotates = {:json_encode($rotates)};
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var searchParams = [{'type':'1','id':'keyword'},{'type':'2','id':'rotateid'},{'type':'2','id':'teamid'}];
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('common/gamerecord',['hdid'=>$hdid,'gametype'=>$gametype])}",
    columnoperate:{
        btns:{
            del:true,
        },
        func:{
            del:function(value, row, index){
                var rotateid = $("#rotateid").find('option:selected').val()||'';
                if(+rotateid < 1){
                    return zamnotice.showTips('info','请选择轮次');
                }
                jconfirmBox.confirm('温馨提示','删除用户成绩将同步删除用户中奖数据，您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('common/delgamerecord',['hdid'=>$hdid])}",{gametype:"{$gametype}",recordid:row.id,rotateid:rotateid},'删除中...').then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            }
        }
    },
    columns:[
        {
            checkbox: true,
        },{
            field: 'id',
            title: 'Id',
            align: 'center',
            visible: false
        },{
            field: 'key',
            title: '排名',
            align: 'center',
            width:'10%',
            formatter: function(value, row, index){
                var pageSize = $('#listtable').bootstrapTable('getOptions').pageSize;
                var pageNumber = $('#listtable').bootstrapTable('getOptions').pageNumber;
                return pageSize * (pageNumber - 1) + index + 1;
            },
        },{
            field: 'nickname',
            title: '用户',
            align: 'center',
            width:'15',
            formatter:function(value,row,index){
                return `
                <div class='zam-flex-column-center'>
                    <img src="${row.avatar}" class="avatarImg" />
                    <span>${value||'已删除'}</span>
                </div>
                `;
            }
        },{
            field: 'teamname',
            title: '团队',
            align: 'center',
        },{
            field: 'score',
            title: '成绩',
            align: 'center',
        },{
            field: 'create_time',
            title: '时间',
            align: 'center',
        }
    ],
    searchParamas:searchParams,
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            var rotateid = $("#rotateid").find('option:selected').val()||'';
            if(+rotateid < 1){
                return zamnotice.showTips('info','请选择轮次');
            }
            jconfirmBox.confirm('温馨提示','删除用户成绩将同步删除用户中奖数据，您确定要删除选中的用户么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('common/delgamerecord',['hdid'=>$hdid])}",{gametype:"{$gametype}",recordid:getSelects,rotateid:rotateid},'删除中...').then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            var rotateid = $("#rotateid").find('option:selected').val()||'';
            if(+rotateid < 1){
                return zamnotice.showTips('info','请选择轮次');
            }
            jconfirmBox.confirm('温馨提示','清空将删除本轮所有用户成绩以及用户中奖数据，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('common/resetgamerecord',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:rotateid}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$('#rotateid').change(function(e) {
    var selroundid = $(e.target).find("option:selected").val(),selround = $rotates[selroundid]||false;
    if(!selround) return;
    if("{$gametype}" == 'tug'){
        var html = `
        <option value="1">${selround.redname}</option>
        <option value="2">${selround.bluename}</option>
        `;
    }else{
        var html = `<option value="0" selected>全部</option>`;
        if(selround.teams.length) {
            $.each(selround.teams,function(i,v){
                html += `<option value="${v.id}">${v.teamname}</option>`;
            });
        }
    }
    $("#teamid").html(html);
    webtable.refresh();
});
$('#teamid').change(function(e) {
    webtable.refresh();
});
$('.btn-export').on('click',function(){
    var rotateid = $("#rotateid").find('option:selected').val()||'';
    if(+rotateid < 1){
        return zamnotice.showTips('info','请选择轮次');
    }
    webcore.ajaxSubmit("{:gohdmanage('common/gamerecordexport',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:rotateid}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = `{:gohdmanage('common/gamerecordexport',['hdid'=>$hdid])}&gametype={$gametype}&rotateid=${rotateid}`;
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
{if $gametype == 'answerbs'}
$('.btn-exportquestiondata').on('click',function(){
    var rotateid = $("#rotateid").find('option:selected').val()||'';
    if(+rotateid < 1){
        return zamnotice.showTips('info','请选择轮次');
    }
    webcore.ajaxSubmit("{:gohdmanage('common/exportquestiondata',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:rotateid}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = `{:gohdmanage('common/exportquestiondata',['hdid'=>$hdid])}&gametype={$gametype}&rotateid=${rotateid}`;
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
{/if}
});
</script>
{include file='$Wpath/common/footer'}
