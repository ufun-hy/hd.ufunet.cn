{include file='$Wpath/common/header'}
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('common/ajaxgamerotate',['hdid'=>$hdid,'gametype'=>$gametype])}",
    columnoperate:{
        btns:{
            edit:true,
            del:true,
            data:true,
            reset:{title:"重置",icon:"mdi-gavel",'except':{'not':['1']}},
            shenhe:{title:"跳过",icon:"mdi-gavel",class:"danger",'except':{'only':['1']}},
            refund:{title:"复制",icon:"mdi-content-copy",class:'primary btn-copyrotate'},
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑轮次","{:gohdmanage('common/editgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:row.id},'html','col-lg-10 col-lg-offset-1',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.gametype = "{$gametype}";
                    postData.rotateid = row.id;
                    webcore.ajaxSubmit("{:gohdmanage('common/savegamerotate',['hdid'=>$hdid])}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差，操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除将删除当前轮次用户以及中奖数据并且无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('common/delgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
            data:function(value, row, index){
                window.location.href = `{:gohdmanage('data'.$gametype.'/index',['hdid'=>$hdid])}&rotateid=${row.id}`;
            },
            reset:function(value, row, index){
                jconfirmBox.confirm('温馨提示','重置轮次将清空用户以及中奖数据，轮次重置成未开始状态，并且无法恢复，您确定要重置当前轮次么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('common/resetgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:row.id}).then(function(json){
                            webtable.refresh();
                            zamnotice.showTips('success','重置成功');
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
            shenhe:function(value, row, index){
                jconfirmBox.confirm('温馨提示','跳过当前轮次将导致当前轮次状态改成已结束，您确定要跳过当前轮次么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('common/endgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','操作成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
            refund:function(value, row, index){
                jconfirmBox.confirm('温馨提示','复制轮次将生成新的一轮答题游戏，您确定要复制当前轮次么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('common/copygamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','复制成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        } 
        {if $gametype!='tug'}
        ,{
            field: 'teammode',
            title: '竞技类型',
            align: 'center',
        }
        {/if}
        ,{
            field: 'title',
            title: '轮次',
            align: 'center',
            formatter:function(value,row,index){
                return value;
            }
        },  {
            field: 'statushtml',
            title: '状态',
            align: 'center',
            
        }, {
            field: '{if $gametype=='answerbs'}answertime{else}gametime{/if}',
            title: '{if $gametype=='answerbs'}答题{else}游戏{/if}时间(s)',
            align: 'center',
        },{
            field: 'startedjoinhtml',
            title: '开始后可加入',
            align: 'center',
        },{
            field: 'djshtml',
            title: '倒计时(s)',
            align: 'center',
        }
        {if $gametype=='answerbs'}
        ,{
            field: 'quesnum',
            title: '题目数量',
            align: 'center',
        }
        {/if}
        {if $gametype=='tug'}
        ,{
            field: 'winteam',
            title: '获取队伍',
            align: 'center',
        }
        {/if}
        ,{
            field: 'create_time',
            title: '创建时间',
            align: 'center',
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'},{'type':'2','id':'msgstatus'}],
    toolbar:{
        add:function(){
            var confirmObj = jconfirmBox.ajaxconfirm("新增轮次","{:gohdmanage('common/editgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}"},'html','col-lg-10 col-lg-offset-1',function(e){
	            var postData = webcore.serializeObject(e.find('form'));
	            postData.gametype = "{$gametype}";
	            webcore.ajaxSubmit("{:gohdmanage('common/savegamerotate',['hdid'=>$hdid])}",postData,'正在创建轮次...').then(function(json){
	                if(json.code==0){
	                    webtable.refresh();
	                    zamnotice.showTips('success','创建成功');
	                    confirmObj.close();
	                }else{
	                    zamnotice.showTips('error',json.msg);
	                     return false;
	                }
	            }, function(json){
	                zamnotice.showTips('error','网络差。操作失败');
	                 return false;
	            });
	        });
        },
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','删除将删除所选轮次下的的用户以及中奖数据并且无法恢复，您确定要删除么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('common/delgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有轮次下的的用户以及中奖数据并且无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('common/resetallgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}"}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        {/*
         当成重置
        */}
        shenhe:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','重置将删除所选轮次下的的用户以及中奖数据，轮次重置成未开始状态，并且无法恢复，您确定要重置么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('common/resetgamerotate',['hdid'=>$hdid])}",{gametype:"{$gametype}",rotateid:getSelects}).then(function(json){
                    webtable.refresh();
                    zamnotice.showTips('success','重置成功');
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
});
</script>
{include file='$Wpath/common/footer'}
