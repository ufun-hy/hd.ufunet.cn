{include file='$Wpath/common/header'}
<div class="alert alert-danger">
    已退款的消息不会展示在下面的表格里
</div>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">昵称或表单内容</span>
        <input type="text" class="form-control" value="" id="keyword" placeholder="请输入用户昵称或表单内容">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">消息内容</span>
        <input type="text" class="form-control" value="" id="content" placeholder="请输入消息内容">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">审核状态</span>
          <select id="msgstatus" class="form-control js_select2">
            {foreach $shenhetypes as $k => $v } 
            <option value="{$k}" {if $k == "0"}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">类型</span>
          <select id="msgtype" class="form-control js_select2">
            {foreach $msgtypes as $k => $v } 
            <option value="{$k}" {if $k == "0"}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">支付方式</span>
          <select id="freetype" class="form-control js_select2">
            {foreach $freetypes as $k=>$v } 
            <option value="{$k}" {if $k == "0"}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">卡券号</span>
        <input style="width:110px;"type="text" class="form-control" value="" id="cardid" placeholder="请输入卡券号">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('databaping/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            shenhe:{title:"审核通过",icon:"mdi-gavel",except:{'only':'2'}},
            refund:{
                title:"审核不通过",
                icon:"mdi-gavel",
                except:{
                    more:[
                        {'field':'status','only':'2'},
                    ],
                }
            },
            del:true,
        },
        func:{
            edit:function(value, row, index){
                console.log("编辑"+row.id);
            },
            del:function(value, row, index){
                if(row.status== '2' && $.inArray(row.type,[3,4,6]) > -1){
                    return zamnotice.showTips('warning','付费消息需要审核后才可删除');
                }
                jconfirmBox.confirm('温馨提示','您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('databaping/del',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差，操作失败');
                    });
                });
            },
            shenhe:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要审核通过当前消息么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('databaping/shenhe',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        webtable.refresh();
                        zamnotice.showTips('success','审核成功');
                    }, function(json){
                        zamnotice.showTips('error','网络差，操作失败');
                    });
                });
            },
            refund:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要审核不通过当前消息么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('databaping/refuse',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        webtable.refresh();
                        zamnotice.showTips('success','审核成功');
                    }, function(json){
                        zamnotice.showTips('error','网络差，操作失败');
                    });
                });
            },
        }
    },
    columns:[
        {
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'nickname',
            title: '用户',
            align: 'center',
            width:'15',
            formatter:function(value,row,index){
                var html = `
                <div class='zam-flex-column-center'>
                    <img src="${row.avatar}" class="avatarImg" />
                    <span>${value||'已删除'}</span>
                </div>
                `;
                return html;
            }
        },{
            field: 'statushtml',
            title: '审核状态',
            align: 'center',
            
        },{
            field: 'typehtml',
            title: '类型',
            align: 'center',
        },{
            field: 'content',
            title: '消息',
            align: 'center',
            formatter: function(value, row, index){
                var bphtml = '';
                if(row.type == '1'){
                    return webcore.emoToimg(value.toString());
                }else if(row.type == '2'){
                    return `
                    <div class="bpimgbox">
                        <img src="${value}" class="uploadImg cursor" onclick="prevshowattachs(this,1);">
                    </div>
                    `;
                }else if(row.type == '3'){
                    bphtml += `
                    <div class="m-t-10">霸屏时间:${value.bptime}秒</div>
                    <div class="m-t-10">霸屏主题:${value.bpname}</div>
                    <div class="m-t-10">霸屏费用:${value.fee}元</div>
                    ${value.bptxt ? `<div class="m-t-10">留言:${value.bptxt}</div>` : ''}
                    `;
                    if(value.bpimgs){
                        bphtml += `<div class="bpdetailbox m-t-10">霸屏图片:`;
                        $.each(value.bpimgs,function(i,v){
                            bphtml += `
                                <div class="bpimgbox">
                                    <img src="${v}" class="uploadImg cursor" onclick="prevshowattachs(this,1);">
                                </div>
                            `;
                        });
                        bphtml += `</div>`;
                    }
                    if(value.bpvideo){
                        bphtml += `
                        <div class="bpdetailbox isvideo m-t-10">霸屏视频:
                            <div class="bpvideobox">
                                <img src="${value.bpvideo.pic}" class="uploadImg">
                                <i class="mxc-video_light playicon" onclick="prevshowattachs(this,3)" src="${value.bpvideo.video}"></i>
                            </div>
                        </div>`;
                    }
                }else if(row.type == '4'){
                    bphtml += `
                    <div class="m-t-10">打赏礼物:${value.giftname}</div>
                    <div class="m-t-10">打赏金额:${value.fee}元</div>
                    <div class="m-t-10">艺人:${value.artistname}</div>
                    <div class="m-t-10">艺人分成:${value.splitfee}元</div>
                    ${value.dstxt ? `<div class="m-t-10">留言:${value.dstxt}</div>` : ''}
                    `;
                }else if(row.type == '5'){
                    bphtml += `
                    <div class="m-t-10">类型:${(value.hbtype == '2' ? `口令红包(<span class="text-error">${value.kouling}</span>)` : `拼手气红包`)}</div>
                    <div class="m-t-10">红包金额:${value.hbmoney}元</div>
                    <div class="m-t-10">红包个数:${value.hbnum}个</div>
                    ${value.hbtype == '1' ? `<div class="m-t-10">留言:${value.hbtxt||''}</div>` : ''}
                    `;
                }else if(row.type == '6'){
                    bphtml += `
                    <div class="m-t-10">歌曲名:${value.songname}</div>
                    <div class="m-t-10">支付金额:${value.fee}元</div>
                    <div class="m-t-10">艺人:${value.artistname}</div>
                    <div class="m-t-10">艺人分成:${value.splitfee}元</div>
                    ${value.songtxt ? `<div class="m-t-10">留言:${value.songtxt}</div>` : ''}
                    `;
                }
                return bphtml;
            }
        },{
            field: 'isfreepayhtml',
            title: '支付方式',
            align: 'center',
            formatter: function(value, row, index){
                $html = value;
                if(row.isfreepay == '3' && row.cardid > 0){
                    $html += `<div class="m-t-5">卡券号:${row.cardno || '已删除'}</div>`;
                }
                return $html
            }
        },{
            field: 'create_time',
            title: '发送时间',
            align: 'center',
        }
    ],
    searchParamas:[
        {'type':'1','id':'keyword'},
        {'type':'1','id':'content'},
        {'type':'2','id':'msgstatus'},
        {'type':'2','id':'msgtype'},
        {'type':'2','id':'freetype'},
        {'type':'1','id':'cardid'}
    ],
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要删除选中的数据用户么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('databaping/del',['hdid'=>$hdid])}",{msgid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差，操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有消息数据并且无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('databaping/reset',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差，操作失败');
                });
            });
        },
        shenhe:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要审核通过选中的消息么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('databaping/shenhe',['hdid'=>$hdid])}",{msgid:getSelects}).then(function(json){
                    webtable.refresh();
                    zamnotice.showTips('success','审核成功');
                }, function(json){
                    zamnotice.showTips('error','网络差，操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
     webtable.refresh();
});
$('.btn-export').on('click',function(){
    webcore.ajaxSubmit("{:gohdmanage('databaping/export',['hdid'=>$hdid])}",{}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = "{:gohdmanage('databaping/export',['hdid'=>$hdid])}";
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
});
</script>
{include file='$Wpath/common/footer'}
