<div class="form-horizontal confirmbox-pop">
  <form class="confirm-formbox" method="post">
    <div class="form-group">
      <label class="col-lg-3 control-label">* 轮次</label>
      <div class="col-lg-7">
        <select class="form-control rotateid" name="rotateid">
              <option value="">-----请选择轮次-----</option>
              {volist name="rotates" id="rotate"}
                  <option value="{$rotate['id']}">{$rotate['title']}</option>
              {/volist}
        </select>
        <span class="help-block">必须选一个轮次</span>
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 奖品</label>
      <div class="col-lg-7">
        <select class="form-control prizeid" name="prizeid">
              <option value="0">-----请选择奖品-----</option>
        </select>
        <span class="help-block">注意选了奖品的券号即为在此奖品有余量的情况下必中此奖品</span>
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">* 类型</label>
      <div class="col-lg-7">
        <label class="lyear-radio radio-inline radio-primary">
         <input type="radio" name="cardtype" value="1" checked><span>数字英文混合体 <b class="label label-success">推荐</b></span>
        </label>
        <label class="lyear-radio radio-inline radio-primary">
         <input type="radio" name="cardtype" value="2"><span>纯英文</span>
        </label>
        <label class="lyear-radio radio-inline radio-primary">
         <input type="radio" name="cardtype" value="3"><span>纯数字</span>
        </label>
        <div class="help-block">强烈推荐使用数字英文混合体</div>
      </div>
    </div>
    <div class="form-group">
      <label class="col-lg-3 control-label">券号前缀</label>
      <div class="col-lg-8">
        <input class="form-control" type="text"  name="cardprev" placeholder="可以不填写" value="" maxlength="6">
        <span class="help-block">例如：Card，NO等</span>
      </div>
    </div>
    <div class="form-group">
        <label class="col-lg-3 control-label">* 券号字符长度</label>
        <div class="col-lg-8">
            <input type="text" class="form-control numberincdec cardlen" name="cardlen" 
            data-bts-min="8" data-bts-replacement-val="8"
            data-bts-max="null"
            data-bts-step="1"
            value="8">
            <div class="help-block m-0">至少为8位，如果券号生成的数量较多推荐16位以上</div>
        </div>
     </div>
     <div class="form-group">
        <label class="col-lg-3 control-label">* 生成券号数量</label>
        <div class="col-lg-8">
            <input type="text" class="form-control numberincdec cardnum" name="cardnum" 
            data-bts-min="1" data-bts-replacement-val="1"
            data-bts-max="null"
            data-bts-step="1"
            value="8">
            <div class="help-block m-0">至少为1个，如果生成的券号数量较多耗时较长请耐心等待，一次生成数量不要超1万个</div>
        </div>
     </div>
</form>
</div>
<script type="text/javascript">
var $cardrotates = {:json_encode(array_column($rotates,null,'id'))};
require(['webcore','jconfirmBox','zamnotice','layerBox',"bootstrap-touchspin"],function(webcore,jconfirmBox,zamnotice,layerBox){
  $(".confirmbox-pop .numberincdec").TouchSpin();
  $('.rotateid').change(function(e) {
    var selroundid = $(e.target).find("option:selected").val(),selround = $cardrotates[selroundid]||false;
    if(!selround) return;
    var html = '<option value="0" selected="">-----请选择奖品-----</option>';
    if(selround.prizes.length > 0) {
        $.each(selround.prizes,function(i,v){
            if(v.prizetype!='3'){
              html += '<option value="'+v.id+'">'+v.prizename+'</option>';
            }
        });
    }
    $(".prizeid").html(html);
});
});
</script>
