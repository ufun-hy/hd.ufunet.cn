<script>
var zdconfig = {:json_encode($zd2title)};    
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('datasign/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:{title:"编辑",'except':{'field':'neededit','only':'1'}},
            del:true,
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑签到用户","{:gohdmanage('datasign/save',['hdid'=>$hdid])}",{ishtml:'1',userid:row.id},'html','col-lg-6 col-lg-offset-3',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.userid = row.id;
                    webcore.ajaxSubmit("{:gohdmanage('datasign/save',['hdid'=>$hdid])}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('datasign/del',['hdid'=>$hdid])}",{userid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
            width:'15'
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'nickname',
            title: '用户',
            align: 'center',
            width:'15',
            formatter:function(value,row,index){
                var html = `
                <div class='zam-flex-column-center'>
                    <img src="${ row.avatar }" class="avatarImg" />
                    <span>${ value || '已删除' }</span>
                </div>
                `;
                return html;
            }
        }
        {if $signconfig['appopenbd'] == '1'}
        ,{
            field: 'bddata',
            title: '表单内容',
            align: 'center',
            formatter: function(value, row, index){
                 if(value=='') return ''; 
                 return $.isEmptyObject(zdconfig)?'-':webcore.tpl($("#binddata-tpl"),{list:value,bd:zdconfig});
            },
            width:'40'
        }
        {/if}
        ,{
            field: 'create_time',
            title: '签到时间',
            align: 'center',
            width:'15'
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'},{'type':'1','id':'bdkeyword'}],
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要删除选中的数据用户么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datasign/del',['hdid'=>$hdid])}",{userid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除活动所有用户的签到并且无法恢复，您确定要清空所有的用户么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datasign/reset',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        other:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            var confirmObj = jconfirmBox.ajaxconfirm("加入自定义分组","{:gohdmanage('common/pullusergroup',['hdid'=>$hdid])}",{ishtml:'1'},'html','col-lg-8 col-lg-offset-2',function(e){
                var selectgroups = e.find("input:checked");
                if(!selectgroups.length){
                    zamnotice.showTips('error','请选择用户组');
                }
                var selgroups = [];
                selectgroups.each(function(){
                    selgroups.push($(this).val());
                });
                webcore.ajaxSubmit("{:gohdmanage('common/pullusergroup',['hdid'=>$hdid])}",{issign:'1',groupid:selgroups,userid:getSelects},'正在新增用户到用户组...').then(function(json){
                    if(json.code==0){
                        confirmObj.close();
                        zamnotice.showTips('success','操作成功');
                        webtable.refresh();
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
    webtable.refresh();
});
$('.btn-export').on('click',function(){
    webcore.ajaxSubmit("{:gohdmanage('datasign/export',['hdid'=>$hdid])}",{}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = "{:gohdmanage('datasign/export',['hdid'=>$hdid])}";
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
});
</script>
