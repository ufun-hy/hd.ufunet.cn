<form>
<div class="form-horizontal confirmbox-pop addscoredetail-pop">
    <div class="form-group">
        <label class="col-lg-3 control-label">* 类型</label>
        <div class="col-lg-8">
             <label class="lyear-radio radio-inline radio-primary">
             <input type="radio" name="type" value="1" {if $config['type']=='1'}checked{/if}><span>答对得分</span>
             </label>
             <label class="lyear-radio radio-inline radio-primary">
             <input type="radio" name="type" value="2" {if $config['type']=='2'}checked{/if}><span>答错减分</span>
             </label>
             <label class="lyear-radio radio-inline radio-primary">
             <input type="radio" name="type" value="3" {if $config['type']=='3'}checked{/if}><span>未提交减分</span>
             </label>
             <label class="lyear-radio radio-inline radio-primary">
             <input type="radio" name="type" value="4" {if $config['type']=='4'}checked{/if}><span>选择档次超时减分</span>
             </label>
        </div>
    </div>
    <div class="form-group">
        <label class="col-lg-3  control-label">代表队</label>
        <div class="col-lg-8 styleidbox">	
            <select name="user_id" class="form-control">
                <option value="">请选择代表队</option>
                {volist name="allusers" id="u"}
                 <option value="{$u['id']}">{$u['nickname']}</option>
                {/volist}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="col-lg-3  control-label">轮次</label>
        <div class="col-lg-8 styleidbox">	
            <select name="rotate_id" class="form-control">
                <option value="">请选择轮次</option>
                {volist name="rotates" id="r"}
                 <option value="{$r['id']}">{$r['title']}</option>
                {/volist}
            </select>
        </div>
    </div>
    
    <div class="form-group">
        <label class="col-lg-3 control-label">* 分数</label>
        <div class="col-lg-8">
            <input type="text" class="form-control numberincdec" name="score" 
                data-bts-min="null" data-bts-replacement-val="0"
                data-bts-max="null"
                data-bts-step="1"
                value="{$config['score']??10}">
            <span class="zam-help-block">注:加分就填写正数，减分就填写负数</span>
        </div>
    </div>
</div>
</form>
<script>
require(['webcore',"bootstrap-touchspin"],function(webcore){
    $(".addscoredetail-pop .numberincdec").TouchSpin();
});
</script>
