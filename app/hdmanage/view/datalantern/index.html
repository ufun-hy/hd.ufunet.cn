{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">昵称或表单内容</span>
        <input type="text" class="form-control" value="" id="keyword" placeholder="请输入用户昵称或表单内容">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">许愿内容</span>
        <input type="text" class="form-control" value="" id="content" placeholder="请输入许愿内容">
      </div>
    </div>
    <div class="form-group m-l-5">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">审核状态</span>
          <select id="status" class="form-control js_select2">
            {foreach $shenhetypes as $k => $v } 
            <option value="{$k}" {if $k == "0"}selected{/if}>{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('datalantern/index',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            shenhe:{title:"审核通过",icon:"mdi-gavel",'except':{'only':'2'}},
            refund:{title:"审核不通过",icon:"mdi-gavel",'except':{'only':'2'}},
            del:true,
        },
        func:{
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('datalantern/del',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
            shenhe:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要审核通过当前孔明灯么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('datalantern/shenhe',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        webtable.refresh();
                        zamnotice.showTips('success','审核成功');
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
            refund:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要审核不通过当前孔明灯么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('datalantern/refuse',['hdid'=>$hdid])}",{msgid:row.id}).then(function(json){
                        webtable.refresh();
                        zamnotice.showTips('success','审核成功');
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
        }
    },
    columns:[
        {
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'nickname',
            title: '用户',
            align: 'center',
            width:'15',
            formatter:function(value,row,index){
                return `
                <div class='zam-flex-column-center'>
                    <img src="${row.avatar}" class="avatarImg" />
                    <span>${value||'已删除'}</span>
                </div>
                `;
            }
        },{
            field: 'statushtml',
            title: '审核状态',
            align: 'center',
            
        },{
            field: 'typeimg',
            title: '类型',
            align: 'center',
            width:'10',
            formatter:function(value,row,index){
                return value != '' ? `<div class="bpimgbox"><img src="${value}" class="uploadImg cursor" onclick="prevshowattachs(this,1);"></div>` : '';
            }
        },{
            field: 'content',
            title: '消息',
            align: 'center',
        },{
            field: 'create_time',
            title: '发送时间',
            align: 'center',
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'},{'type':'1','id':'content'},{'type':'2','id':'status'}],
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要删除选中的数据用户么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datalantern/del',['hdid'=>$hdid])}",{msgid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除活动所有用户发送的孔明灯并且无法恢复，您确定要清空所有的用户的孔明灯么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datalantern/reset',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        shenhe:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','您确定要审核通过选中的孔明灯么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datalantern/shenhe',['hdid'=>$hdid])}",{msgid:getSelects}).then(function(json){
                    webtable.refresh();
                    zamnotice.showTips('success','审核成功');
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                });
            });
            
        },
    },
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
     webtable.refresh();
});
$('.btn-export').on('click',function(){
   var status = $("#signstatus").find('option:selected').val();
   webcore.ajaxSubmit("{:gohdmanage('datalantern/export',['hdid'=>$hdid])}",{status:status}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = `{:gohdmanage('datalantern/export',['hdid'=>$hdid])}&status=${status}`;
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
});
</script>
{include file='$Wpath/common/footer'}
