<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
    <div class="carditem">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 分类</label>
            <div class="col-lg-8">
                <select name="cateid" class="form-control">
					<option value="" {if !isset($cateid) || $cateid=='0'}selected{/if}>请选择分类</option>
					{volist name="cates" id="cate"}
						<option value="{$cate['id']}" {if isset($cateid) && $cateid==$cate['id']}selected{/if}>{$cate['catename']}</option>
					{/volist}
				</select>
            </div>
        </div>
    </div>
</form>
</div>
