<table class="we7-table table" style="margin-bottom:0px;">
<thead>
  <tr>
	<th style="width:40%;text-align:center;">项目</th>
	<th style="width:30%;text-align:center;">重复种类</th>
	<th style="width:30%;text-align:center;">操作</th>
  </tr>
</thead>
<tbody class="prize-lists">
	 {foreach $fieldconfig as $yhkey=>$yhfield}
	  <tr>
		<td class="text-center">
			{$yhfield['fieldname']}
		</td>
		<td class="text-center">{if $$yhkey>0}<span class="text-danger">{$$yhkey}种</span>{else}-{/if}</td>
		<td class="text-center">
			{if $$yhkey>0}<a class="btn btn-primary btn-sm btn-samedetail" data-field="{$yhkey}">详情</a>{else}-{/if}
		</td>
	 </tr>
	{/foreach}
</tbody>
</table>
