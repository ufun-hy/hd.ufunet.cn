<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
    <div class="carditem">
    	{foreach $fieldconfig as $fkey=>$field } 
        <div class="form-group">
            <label class="col-lg-3 control-label">{if $field['fieldstatus']=='1'}* {/if}{$field['fieldname']}</label>
            <div class="col-lg-8">
                <input class="form-control{if $field['fieldstatus']=='1'} mustinput{/if}" type="text"  name="{$fkey}" value="{$config[$fkey]}">
                {if $field['fieldstatus']=='1'}<span class="help-block text-danger">必填项</span>{/if}
            </div>
        </div>
        {/foreach}
        <div class="form-group">
            <label class="col-lg-3 control-label">分类</label>
            <div class="col-lg-8">
            	<select name="cateid" class="form-control">
            	<option value='' {if empty($config['cateid'])}selected{/if}>请选择分类</option>
                {volist name="cates" id="cate"}
				<option value="{$cate['id']}" {if $config['cateid']==$cate['id']}selected{/if}>{$cate['catename']}</option>
				{/volist}
				</select>
            </div>
        </div>
    </div>
</form>
