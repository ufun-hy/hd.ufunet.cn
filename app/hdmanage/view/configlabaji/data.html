{include file='$Wpath/common/header'}
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>    
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('configlabaji/data',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            edit:true,
            del:true,
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑名单","{:gohdmanage('configlabaji/editdata',['hdid'=>$hdid])}",{dataid:row.id},'html','col-lg-10 col-lg-offset-1',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.dataid = row.id;
                    webcore.ajaxSubmit("{:gohdmanage('configlabaji/savedata',['hdid'=>$hdid])}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除么？',function(){
                        webcore.ajaxSubmit("{:gohdmanage('configlabaji/deldata',['hdid'=>$hdid])}",{dataid:row.id}).then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','删除成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
            width:'5',
        }, 
        {
            field: 'id',
            title: 'Id',
            align: 'center',
            visible: false,
            width:'5',
        },{
            field: 'companyname',
            title: '地区名称',
            align: 'center',
            width:'15',
        },{
            field: 'username',
            title: '用户名',
            align: 'center',
            width:'8',
            
        }
    ],
    searchParamas:[],
    toolbar:{
        add:function(){
            var confirmObj = jconfirmBox.ajaxconfirm("新增名单","{:gohdmanage('configlabaji/editdata',['hdid'=>$hdid])}",{},'html','col-lg-10 col-lg-offset-1',function(e){
                var postData = webcore.serializeObject(e.find('form'));
                webcore.ajaxSubmit("{:gohdmanage('configlabaji/savedata',['hdid'=>$hdid])}",postData,'正在新增数据...').then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','创建成功');
                        confirmObj.close();
                    }else{
                        zamnotice.showTips('error',json.msg);
                         return false;
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                     return false;
                });
            });
        },
        del:function(){
            var getSelects = webtable.getSelections();
            if(getSelects.length>0){
                jconfirmBox.confirm('温馨提示','删除将无法恢复，您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('configlabaji/deldata',['hdid'=>$hdid])}",{dataid:getSelects}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差,操作失败');
                    });
                });
            }else{
                zamnotice.showTips('info','请先选择您要操作的数据');
            }
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空轮次将删除所有的名单数据以及中奖数据，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('configlabaji/resetalldata',['hdid'=>$hdid])}",{}).then(function(json){
                    webtable.refresh();
                    zamnotice.showTips('success','操作成功');
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                });
            });
        },
        import:function(){
            webcore.importxls({title:'导入名单数据',url:"{:gohdmanage('configlabaji/importdata',['hdid'=>$hdid])}",moban:"/{:SYSIMGURL}excel/labaji.xls",uptxt:"点击上传数据",xlstxt:"注:请务必严格按照模板内容制作xls文件"},function(){
                    webtable.refresh();
            });
        },
    },
};
webtable.init(initConfig);
});
</script>
{include file='$Wpath/common/footer'}
