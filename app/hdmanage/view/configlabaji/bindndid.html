<style>
.user-item{position:relative;width:100px;min-height:100px;}
.user-item .zam-select{position:absolute;top:20px;left:0px;}
.user-item img{width:50px;height:50px;border-radius:50%;}
.resultuser{
	flex-wrap: wrap;
    justify-content: center;
}
</style>
<div id="formBox">
<div class="form-inline">
    <div class="form-group m-b-5" style="width: 250px;">
      <input style="width: 100%;" class="form-control input-sm username" type="text" name="username" placeholder="请输完整的用户名">
    </div>
    <a class="btn btn-primary btn-sm m-b-5 searchone" href="javascript:;"><i class="mdi mdi-magnify"></i> 搜索</a>
</div>
<div class="form-group"><ul class="resultuser zam-flex"></ul></div>
</div>
<script id="user-tpl" type="text/template">
	<li class="zam-flex-column-center user-item m-b-10">
		<span class="zam-select">
			<label class="lyear-checkbox checkbox-primary">
              <input data-id="<% d.id %>" name="dataid[]" type="checkbox" />
              <span></span>
            </label>
		</span>
		<div><% d.companyname %></div>
		<div><% d.username %></div>
	</li>
</script>
<script>
require(["webcore","zamnotice"],function(webcore,zamnotice){
	$(".searchone").on('click',function(){
		var searchval = $(".username").val();
		if(searchval=='') return zamnotice.showTips('error','请先输入搜索内容');
		webcore.ajaxSubmit("{:gohdmanage('configlabaji/searchdata',['hdid'=>$hdid])}",{search:searchval},'正在拼命查找用户...').then(function(json){
			if(json.code==0){
				var html = '';
				$.each(json.msg,function(i,v){
					 html += webcore.tpl($("#user-tpl"),v);
				});
				$(".resultuser").html(html);
				if(html==''){
					zamnotice.showTips('error','未搜索到相关用户');
				}
			}else{
				$(".resultuser").html('');
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
});
</script>
