{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-inline zam-inline-searchbar">
        <div class="form-group">
            <div class="input-group input-group-sm">
              <span class="input-group-addon">提交内容</span>
              <input type="text" class="form-control" value="" id="keyword" placeholder="请输入提交内容">
            </div>
        </div>
        <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
        <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    </div>
</div>
{include file='$Wpath/common/tabletoolbar'}
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:gohdmanage('datarankreport/teamrank',['hdid'=>$hdid])}",
    columnoperate:{
        btns:{
            del:true,
        },
        func:{
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','此操作会删除该团队内所有用户的提交记录并且无法恢复，您确定要删除么？',function(){
                    webcore.ajaxSubmit("{:gohdmanage('datarankreport/delteamrank',['hdid'=>$hdid])}",{recordid:row.id}).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            }
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'id',
            align: 'center',
            visible: false
        },{
            field: 'team',
            title: '团队',
            align: 'center',
            width:"20%",
        },{
            field: 'total',
            title:"{$calcbd['bdtitle']??'目标'}总计",
            align: 'center',
            width:"20%",
        },{
            field: 'person',
            title: '人数',
            align: 'center',
            width:"20%",
        },{
            field: 'count',
            title: '提交次数',
            align: 'center',
            width:"20%",
        }
    ],
    searchParamas:[{'type':'1','id':'keyword'}],
    onloadsuccess:function(data){
    },
    toolbar:{
        del:function(){
            var getSelects = webtable.getSelections();
            if(!getSelects.length){
                return zamnotice.showTips('info','请先选择您要操作的数据');
            }
            jconfirmBox.confirm('温馨提示','此操作会删除所选团队内所有用户的提交记录并且无法恢复，您确定要删除么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datarankreport/delteamrank',['hdid'=>$hdid])}",{recordid:getSelects}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','删除成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
        reset:function(){
            jconfirmBox.confirm('温馨提示','清空将删除所有用户的提交记录并且无法恢复，您确定要清空么？',function(){
                webcore.ajaxSubmit("{:gohdmanage('datarankreport/resetteamrank',['hdid'=>$hdid])}",{}).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','清空成功');
                    }else{
                        zamnotice.showTips('error',json.msg);
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差,操作失败');
                });
            });
        },
    },
};
webtable.init(initConfig);
$('.btn-export').on('click',function(){
    webcore.ajaxSubmit("{:gohdmanage('datarankreport/exportteamrank',['hdid'=>$hdid])}",{}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = "{:gohdmanage('datarankreport/exportteamrank',['hdid'=>$hdid])}";
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
});
</script>
{include file='$Wpath/common/footer'}
