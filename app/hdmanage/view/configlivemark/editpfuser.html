<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
  <div class="form-group">
	<label class="col-lg-3 control-label">* 评分状态</label>
	<div class="col-lg-8">
		{:tpl_switch('userstatus',$config['userstatus'],'openscreenshow')}
		<span class="zam-help-block">关闭则微信端将不显示该参评选手</span>
	</div>
  </div>
  <div class="form-group">
	<label class="col-lg-3 control-label">* 大屏显示</label>
	<div class="col-lg-8">
		{:tpl_switch('screenshow',$config['screenshow'])}
		<span class="zam-help-block">关闭后大屏评分选手列表页将不显示该选手</span>
	</div>
  </div>
  <div class="form-group">
	<label class="col-lg-3 control-label">* 选手名</label>
	<div class="col-lg-8">
	  <input type="text" class="form-control" name="username" value="{$config['username']}" />
	</div>
  </div>
  <div class="form-group">
	<label class="col-lg-3 control-label">* 选手头像</label>
	<div class="col-lg-8">
		{:tpl_image_one('userimg', $config['userimg'])}
		<span class="zam-help-block">尺寸:100*100px</span>
	</div>
  </div>
  <div class="form-group">
		<label class="col-lg-3 control-label">选手简介</label>
		<div class="col-lg-8">
			<textarea class="form-control" name="userdes" rows="4" placeholder="100字内">{$config['userdes']}</textarea>
      <div class="help-block">选手简单介绍</div>
		</div>
  </div>
  <div class="form-group livemarkbasicsore">
    <label class="col-lg-3 control-label">* 超时扣分/人工调整分</label>
    <div class="col-lg-8">
        <input type="text" class="form-control numberincdec" name="basicscore" 
        data-bts-min="-1000"
        data-bts-max="100"
        data-bts-decimals="2"
        data-bts-step="1"
        data-bts-postfix="分"
        data-bts-postfix-extra-class="touchspin-postfix"
        data-bts-force-step-divisibility="xstwo"
        value="{$config['basicscore']??0}">
        <div class="help-block m-0"><span class="text-danger">超时扣分填写负数，如 -5 表示扣 5 分；人工加分填写正数；0 为不调整</span>，此项可保留2位小数</div>
    </div>
  </div>
</form>
</div>
<script type="text/javascript">
require(['webcore',"bootstrap-touchspin"],function(webcore){
	tpl_switch();
	 $(".confirmbox-pop .numberincdec").TouchSpin();
});
function openscreenshow(obj,status,url){
    if(status=='1'){
        obj.prev().val('2');
        obj.attr('data-status','2');
    }else{
        obj.prev().val('1');
        obj.attr('data-status','1');
    }
    obj.prev().prev().prop("checked",status=='1'?false:true);
}
</script>
