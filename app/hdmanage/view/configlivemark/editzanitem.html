<div class="form-horizontal confirmbox-pop">
 <div class="form-group">
	<label class="col-lg-4 control-label">* 快捷通道</label>
	<div class="col-lg-7">
		<div class="input-group">
            <div class="input-group-btn not-allow"><a class="btn btn-default">赞</a></div>
            <div class="touchspin">
                <input type="text" class="form-control numberincdec zannum" name="zannum" 
                data-bts-min="1" data-bts-replacement-val="1"
                data-bts-max="null"
                data-bts-step="1"
                value="{$zanitem['zannum']}">
            </div>
            <div class="input-group-btn not-allow"><a class="btn btn-default">个，售价</a></div>
            <div class="touchspin">
                <input type="text" class="form-control numberincdec zanfee" name="zanfee" 
                data-bts-min="0.01" data-bts-replacement-val="0.01"
                data-bts-max="null"
                data-bts-decimals="2"
                data-bts-step="1"
                data-bts-force-step-divisibility="xstwo"
                value="{$zanitem['zanfee']}">
            </div>
        </div>
		<span class="zam-help-block">赞数量与赞售价必须大于0</span>
	</div>
 </div>
</div>
<script type="text/javascript">
require(["bootstrap-touchspin"],function(){
    $(".confirmbox-pop .numberincdec").TouchSpin().on("change", function(){
        var $this = $(this),funcstr = $this.data('func');
        var func = window[funcstr];
        func && func();
    });
});
</script>
