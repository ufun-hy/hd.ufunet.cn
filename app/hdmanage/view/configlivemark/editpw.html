<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
  <div class="form-group">
	<label class="col-lg-3 control-label">* 用户名</label>
	<div class="col-lg-8">
	  <input type="text" class="form-control" name="pwname" value="{$config['pwname']}" />
	</div>
  </div>
  <div class="form-group">
		<label class="col-lg-3 control-label">* 用户头像</label>
		<div class="col-lg-8">
			{:tpl_image_one('pwimg', $config['pwimg']);}
			<span class="zam-help-block">尺寸:100*100px</span>
		</div>
  </div>
  <div class="form-group">
	<label class="col-lg-3 control-label">* 评委权重</label>
	<div class="col-lg-8">
		<input type="text" class="form-control numberincdec" name="pwweight" 
        data-bts-min="1" data-bts-replacement-val="1"
        data-bts-max="100"
        data-bts-step="1"
        value="{$config['pwweight']}">
		<span class="zam-help-block"  style="color:red">注:必须是1到100之间的数字，权重越大代表评委重要性越强，一般是需要计算加权平均分才需要设置为大于1的数值</span>
	</div>
  </div>
  <div class="form-group">
		<label class="col-lg-3 control-label">登录码<span class="text-danger">(推荐填写手机号)</span></label>
		<div class="col-lg-8">
			<input class="form-control" name="pwcode" value="{$config['pwcode']}" maxlength="12" placeholder="请输入评委登录码，最长12位字符" />
			<span class="zam-help-block" style="color:red">注:整个活动评分功能内的所有评委的登录码必须保证不能重复且唯一</span>
		</div>
  </div>
</form>
</div>
<script type="text/javascript">
require(['webcore',"bootstrap-touchspin"],function(webcore,layerBox){
    $(".confirmbox-pop .numberincdec").TouchSpin().on("change", function(){
        var $this = $(this),funcstr = $this.data('func');
        var func = window[funcstr];
        func && func();
    });
});
</script>
