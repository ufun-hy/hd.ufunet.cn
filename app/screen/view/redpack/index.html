{include file='common/header' /}
<style>
/**抢红包主体样式**/
.redpack-mainbox{
	width: 1400px;
    height: 100%;
    margin: 0 auto;
	padding:0;
    overflow: hidden;
}
.redpack-wrapper{
	height:100%;
	width:100%;
	position: relative;
	overflow:hidden;
}
.redpack-wrapper.hidden{
	display:none!important
}
/*底部旋转背景*/
.redpack-wrapperbg {
	position:absolute;
    width: 1400px;
    height: 1400px;
    background-image: url("/{:SIMGURL}redpack/rotatebg.png");
	background-size:cover;
	background-repeat:no-repeat;
	pointer-events: none;
}
.bgrotate{animation:15s linear 0s normal none infinite rotate; -webkit-animation:15s linear 0s normal none infinite rotate;}
@keyframes rotate {
  0 {-webkit-transform:rotate(0deg);}
  100% {-webkit-transform:rotate(360deg);}
}
@-webkit-keyframes rotate {
  0 {-webkit-transform:rotate(0deg);}
  100% {-webkit-transform:rotate(360deg);}
}
/*顶部红包口袋*/
.redpack-toppackage{
	width:500px;
	height:387px;
	position:absolute; 
	top:-150px;
	left:450px;
}
.redpack-toppackage-in{
	width:500px;
	height:387px; 
	background:url("{:tomedia($pcconfig['style']['tredin'])}") no-repeat; background-position:center bottom;
	background-size:100% auto;
	position:absolute; 
	left:0; 
	top:0;
	z-index:1;
}
.redpack-toppackage-out{
	width:500px;
	height:387px; 
	background:url("{:tomedia($pcconfig['style']['tredout'])}") no-repeat; 
	background-position:center bottom; 
	background-size:100% auto; 
	position:absolute;
	left:0;
	top:0; 
	z-index:2;
}
.redpack-toppackage .redpack-toppackage-count{
	position:absolute; 
	left:0; 
	top:170px;
	width:100%; 
	height:60px;
	font-size:30px; 
	color:#fff; 
	text-align:center;
	font-weight: 400;
	z-index:3;
}
.redpack-toppackage .redpack-toppackage-count .seconds{
	margin:0 20px;font-size:40px; font-weight: 600;
}
.redpack-toppackage .redpack-toppackage-count .miao{
	margin-top:20px;font-size:16px;
}
.shake {
	-webkit-animation-name: shake-rotate;
	-ms-animation-name: shake-rotate;
	animation-name: shake-rotate;

	-webkit-animation-duration: 1000ms;
	-ms-animation-duration: 1000ms;
	animation-duration: 1000ms;

	-webkit-animation-iteration-count: infinite;
	-ms-animation-iteration-count: infinite;
	animation-iteration-count: infinite;

	-webkit-animation-timing-function: ease-in-out;
	-ms-animation-timing-function: ease-in-out;
	animation-timing-function: ease-in-out;

	-webkit-animation-delay: 0s;
	-ms-animation-delay: 0s;
	animation-delay: 0s;

	-webkit-animation-play-state: running;
	-ms-animation-play-state: running;
	animation-play-state: running

	-webkit-transform-origin: center center;
	-ms-transform-origin: center center;
	transform-origin: center center
}
.shake.shake-rotate {
	-webkit-animation-iteration-count: infinite;
	-ms-animation-iteration-count: infinite;
	animation-iteration-count: infinite;
}
@-webkit-keyframes shake-rotate {

0% {
 -webkit-transform: translate(0px, 0px) rotate(0deg)
}
 10% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 17% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 25% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 35% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 40% {
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}
100%{
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}

}

@-ms-keyframes shake-rotate {

0% {
 -webkit-transform: translate(0px, 0px) rotate(0deg)
}
 10% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 17% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 25% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 35% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 40% {
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}
100%{
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}

}
@keyframes shake-rotate {

0% {
 -webkit-transform: translate(0px, 0px) rotate(0deg)
}
 10% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 17% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 25% {
 -webkit-transform: translate(0px, -20px) rotate(-2.0deg) scale(1.05,1.0)
}
 35% {
 -webkit-transform: translate(0px, 10px) rotate(2.0deg) scale(0.95,1.0)
}
 40% {
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}
100%{
 -webkit-transform: translate(0px, 0px) rotate(0deg) 
}
}
/*中奖红包掉落*/
.redenvelop_box{width:290px; height:100%; border-radius:40px; overflow:hidden; position:absolute; top:105px; left:50%; margin-left:-153px; z-index:1;pointer-events: none;}
.redenvelop_box .redenvelop_list li{position:absolute; top:-160px;left:0;background-size:100% 100%;background-repeat:no-repeat;background-image:url("{:tomedia($pcconfig['style']['dropredpack'])}");}
.redenvelop_box .redenvelop_list .redenvelop1{width:200px; height:200px; z-index:7;}
.redenvelop_box .redenvelop_list .redenvelop2{width:168px; height:168px; z-index:6;}
.redenvelop_box .redenvelop_list .redenvelop3{width:128px; height:128px; z-index:5;}
.redenvelop_box .redenvelop_list .redenvelop4{width:71px; height:71px;  z-index:4;}
.redenvelop_box .redenvelop_list .redenvelop5{width:67px; height:67px; z-index:3;}
.redenvelop_box .redenvelop_list .redenvelop6{width:37px; height:37px; z-index:2;}
.redenvelop_box .redenvelop_list .redenvelop7{width:28px; height:28px; z-index:1;}

/*左侧加入用户*/
.redpack-left{
	width: 88px;
    height:780px;
    position: absolute;
    left: 40px;
	top:20px;
	bottom:0;
}
.redpack-left .redpack-left-join {
    width: 88px;
    height:110px;
    background: url("{:tomedia($pcconfig['style']['leftjoinbg'])}") no-repeat;
    color: #fff;
    text-align: center;
	padding-top:45px;
}
.redpack-left .redpack-left-join b{font-size:30px;line-height:40px;color:#ffcc00;}
.redpack-left .redpack-left-join p{font-size:18px; line-height:18px;}
.redpack-left .redpack-left-users {
    width: 60px;
    height:625px;
	margin:0 auto;
}
.redpack-left .redpack-left-users ul{
	position: absolute;
    width: 60px;
    left: 16px;
    bottom:120px;
    z-index: 2
}
.redpack-left .redpack-left-users ul li{
	margin-top:5px;
	background-repeat: no-repeat;
	background-size: cover; 
	width: 56px;
	height:56px;
	border-radius: 5px
}
.redpack-left .redpack-left-users ul li.hidden{opacity:0}
/**右侧中奖用户**/
.redpack-right{
	width: 356px;
	height:750px;
    position: absolute;
    right: 25px;
    top: 25px;
	bottom:25px;
	border-radius:5px;
}
.redpack-right dl dt.redpack-right-header{height:60px;line-height:60px;font-size:25px;font-weight:bold; color:#fff; text-align:center; background:#0c52d2;}
.redpack-right dl dt.redpack-right-header h4{margin-left:10px;font-size:28px;display:inline-block;letter-spacing:10px;}
.redpack-right dl dd.redpack-right-list{width:100%;}
.redpack-right dl dd.redpack-right-list ul{width:100%;height:610px;background-color:rgba(0,0,0,0.4);overflow-y:auto;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item{width:100%;height:86px;background-color:#3a80ff; color:#fff;border-bottom:1px dashed #fff}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-luckerimg{width:70px; height:70px; border-radius:50%; border:2px solid #fff;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-luckerimg img{width:100%; height:100%; border-radius:50%}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-luckerinfo{width:160px;margin:0px 10px 0px 10px;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-luckerinfo p{height:30px; line-height:30px;font-size:16px;font-weight:bold;text-overflow:ellipsis; white-space:nowrap; overflow:hidden;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-luckerinfo span{display:block;height:40px;line-height:40px;font-size:18px;text-overflow:ellipsis; white-space:nowrap; overflow:hidden;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-bg{width:76px; height:76px;background:url("{:tomedia($pcconfig['style']['rightrecordimg'])}") no-repeat; background-size:contain;}
.redpack-right dl dd.redpack-right-list .redpack-lucker-item .redpack-bg b{display:block; margin-top:45px; font-size:14px; font-weight:normal; color:#fff; text-align:center;  }
.redpack-right dl dt.redpack-right-footer{
	position:relative;
	background-color:#fff;
	height:80px;
	cursor:pointer;
}
.redpack-right-footer:after {
    content: '';
    height: 0;
    width: 100%;
    position: absolute;
    left:0;
    border-bottom: 10px dotted #fff;
    bottom: -3px;
}
.redpack-right dl dt.redpack-right-footer img{
	width:100px;
	height:41px;
}
.start-btn {
	position:relative;
    width: 366px;
    height: 168px;
    background: url("{:tomedia($pcconfig['style']['goimg'])}") center center no-repeat;
    background-size: contain;
    margin: 20px auto 0;
	cursor:pointer;
}
.redpack-bmoney{
	width: 712px;
    height: 173px;
    background: url("{:tomedia($pcconfig['style']['bmoney'])}") no-repeat;
    position: absolute;
    bottom:0;
}
.redpack-bphone{
	width: 356px;
    height: 144px;
    background: url("{:tomedia($pcconfig['style']['bphone'])}") no-repeat;
    position: absolute;
    bottom:0;
}
/*中奖弹窗*/
.pop-paper{width:100%; height:100%; position:absolute;left:0; top:0;z-index:100;pointer-events: none}
.pop-paper .inner{position:relative;width:300px; height:292px; color:#fff;background-image:url("{:tomedia($pcconfig['style']['popbg'])}");background-repeat:no-repeat;background-size:cover;}
.pop-paper .ava{position:absolute;top:6px;left:113px;width:77px; height:77px; border-radius:50%;overflow:hidden; border:1px solid #cf2829;}
.pop-paper .ava img{ width:100%; height:100%; border-radius:50%;}
.pop-paper .txt{position:absolute;top:170px;left:0px;width:100%; height:120px;font-size:24px; text-align:center; text-shadow:0 1px 2px rgba(0,0,0,0.5); }
/*所有红包记录*/
.redpack-recordall{
	position:absolute;
	top:0;
	left:0;
	width:1400px;
	height:800px;
	background-color:rgba(0,0,0,0.5);
	z-index:6;
	display:none;
}
.redpack-recordall .redpack-recordwrapper{
	position:relative;
	width:1167px;
	height:700px;
	margin:50px auto;
	background-image:url("{:tomedia($pcconfig['style']['phbbg'])}");
	background-size:cover;
	background-repeat:no-repeat;
}
.closerecord{
	position:absolute;
	right:40px;
	top:30px;
	color:#fff;
	font-size:30px;
	cursor:pointer;
}
.redpack-record-title{
	width:437px;
	height:77px;
	margin-top:10px;
	background-image:url("{:tomedia($pcconfig['style']['phbtopimg'])}");
	background-size:cover;
	background-repeat:no-repeat;
}
.redpack-record-list{
	width:1100px;
	margin:10px 0px;
	height:590px;
	overflow-y:auto;
}
.redpack-record-list li{
	width:255px;
	padding:10px;
	float:left;
	color:#fff;
}
.repack-record-wrapper{
	height:100px;
	background-color:rgba(0,0,0,0.3);
}
.record-avatar{
	width:60px;
	height:60px;
	margin:20px 10px;
	border-radius:50%;
	float:left;
}
.record-avatar img{
	width:100%;
	height:100%;
	border-radius:50%;
	border: 2px solid #ff9500;
    box-sizing: border-box;
}
.record-info{
	height:100px;
	width:148px;
	float:left;
}
.record-num{
	display: block;
    float: left;
    width: 25px;
    height: 100px;
    line-height: 100px;
    font-size: 16px;
    text-align: center;
    color: #fff;
    font-family: arial;
    font-style: normal;
    background-color:rgba(255,255,255,0.3);
}
.record-num1{
	background-color:gold;
}
.record-num2{
	background-color:rgba(233,233,216);
}
.record-num3{
	background-color:rgba(186,110,64);
}
.record-name{
	height:55px;
	line-height:55px;
	font-size:22px;
	color: #ff9500;
	font-weight:bold;
	text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
}
.record-money{
	height:45px;
	line-height:45px;
	font-size:15px;
}
</style>
{if !empty($pcconfig['style']['diycss'])}<style>{$pcconfig['style']['diycss']}</style>{/if}
<section class="redpack-mainbox normal-box">
  <div class="emptybox zam-app-flex-ajCenter display-none">
		<img src="/{:SIMGURL}common/empty.png">
		<p style="padding:20px;">暂无可用轮次，请到后台添加.</p>
  </div>
  <div class="redpack-wrapper zam-app-flex-ajCenter2 display-none">
    <div class="redpack-wrapperbg bgrotate"></div>
	<div class="redpack-toppackage">
	  <div class="redpack-toppackage-in"></div>
	  <div class="redpack-toppackage-out"></div>
	  <div class="redpack-toppackage-count zam-app-flex-ajCenter2">
			<span>倒计时</span><span class="seconds">0</span><span class="miao">s</span>
	  </div>
	</div>
	<div class="redenvelop_box display-none">
          <ul class="redenvelop_list"></ul>
    </div>
	<div class="redpack-recordall">
		<div class="redpack-recordwrapper zam-app-flex-ajCenter">
			<i class="zam-icon-error closerecord" onclick="javascript:$('.redpack-recordall').fadeOut();"></i>
			<div class="redpack-record-title"></div>
			<ul class="redpack-record-list"></ul>
		</div>
	</div>
	<div class="start-btn"></div>
	<div class="redpack-bmoney"></div>
	<div class="redpack-bphone"></div>
	<div class="redpack-left">	
		<div class="redpack-left-users">
            <ul class="zam-app-flex zam-app-directionColumnReverse">
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
				<li class="hidden"></li>
			</ul>
        </div>
		<div class="redpack-left-join">
			<b>0</b>
			<p>人</p>
		</div>
	</div>
	<div class="redpack-right">
		<dl>
            <dt class="redpack-right-header">★<h4>中奖名单</h4>★</dt>
            <dd class="redpack-right-list">
              <ul></ul>
            </dd>
			<dt class="redpack-right-footer zam-app-flex-ajCenter2">
				<img src="{:tomedia($pcconfig['style']['bottompm'])}" class="redpack-right-pm">
			</dt>
         </dl>
	</div>
  </div>
</section>
<div class="redpack-stop-btn"></div>
<script type="text/html" id="leftuser-tpl">
	<li style="bottom:{{ avatarpos }};" data-id="{{ id }}"><img src="{{ avatar }}"></li>
</script>
<script type="text/html" id="rightuser-tpl">
	<li class="redpack-lucker-item zam-app-flex-ajCenter2">
		<div class="redpack-luckerimg">
			<img src="{{ avatar }}">
		</div>
		<div class="redpack-luckerinfo">
			<p>{{ nickname }}</p>
			<span>获得红包{{ prizemoney }}元</span>
		</div>
		<div class="redpack-bg"><b>{{ prizemoney }}元</b></div>
	</li>
</script>
<script type="text/html" id="poplucker-tpl">
	<div class="pop-paper zam-app-flex-ajCenter2">				
		<div class="inner">			    
			<div class="ava">
				<img src="{{ avatar }}">
			</div>			      
			<div class="txt zam-app-flex-ajCenter">			       
				<p>{{ nickname }}</p>
				<p>获得{{ prizemoney }}元红包一个</p>
			</div>	
		</div>			 
	</div>
</script>
<script type="text/html" id="recordlucker-tpl">
	<li class="repack-record-item">	
		<div class="repack-record-wrapper">
			<div class="record-num record-num{{ num }}">{{ num }}</div>
			<div class="record-avatar">
				<img src="{{ avatar }}">
			</div>			      
			<div class="record-info">			       
				<p class="record-name">{{ nickname}}</p>
				<p class="record-money">抢到 {{ totalmoney }} 元红包</p>
			</div>	
		</div>
	</li>
</script>
<script>
require(['screenredpack'],function (screenredpack) {
	screenredpack.init();
});
</script>
