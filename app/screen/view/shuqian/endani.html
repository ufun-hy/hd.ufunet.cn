<style>
.endanibox{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 11;
    pointer-events: none;
}
.papers.hidden,.stars.hidden{
    opacity: 0;
}
.papers,.stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
.logoBox{position:absolute;top:0;left:0;height:100%;width:100%;overflow:hidden}
.logoBox.hidden{
    display: none;
}
.logoBox img{
    width: auto;
    height: auto;
    max-width: 800px;
    -webkit-animation-duration: 2s;
    animation-duration: 2s;
}
</style>
<div class="endanibox">
    <canvas class="papers">当前浏览器不支持canvas</canvas>
    <div class="logoBox zam-app-flex-ajCenter2 hidden"><img src="/static/images/sys/logo.png"></div>
    <canvas class="stars">当前浏览器不支持canvas</canvas>
</div>
