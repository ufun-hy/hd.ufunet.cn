.font21,.font22,.font23,.font24,.font25,.font26,.font27,.font28,.font29,.font30,.font31,.font32,.font33,.font34,.font35,.font36,.font37,.font38,.font39,.font40,.font41,.font42,.font43,.font44,.font45,.font46,.font47,.font48,.font49,.font50,.font50,.font51,.font52,.font53,.font54,.font55,.font56,.font57,.font58,.font59,.font60,.font61,.font62{font-size:20px!important;color:#0166c2!important;opacity:0.4;}

<div id="cloud"></div>
<script type="text/javascript">
	require(['screensocket','screencore','layerBox','keyboard','jqcloud'],function(screensocket,screencore,layerBox,fulldm,keyboardJS) {
		var wsConfig = {};
		wsConfig.onmessage = function(data){
			if(data.type=='connected'){
				screensocket.isclose = false;
				screencore.connectsocket({clientid:data.clientid});
			}
		};
		screensocket.init(wsConfig);
        $('#cloud').jQCloud([],{
        	shape: 'elliptic',
        	steps:300,
        	autoResize:true,
        });
		/*每3秒加载一次前30名标签 按出现次数 与 id排序*/
		var oldtexts = '',newtexts = '';
		screencore.ajaxSubmit("/screen/msg/textrank",{}).then(function(data){
			if(data.code==0){
			    var newarr = data.msg;
			    $.each(newarr,function(i,v){
		        	v.weight = 1;
		        	v.html = {'class':'font'+(i+1)};
		        });
			    newtexts = JSON.stringify(newarr);
			    if(newtexts!=oldtexts){
			        oldtexts = newtexts;
			        $('#cloud').jQCloud('update', newarr);
			    }else{
			        console.log('一样的');
			    }
			}else{
				console.log(data.msg);
			}
		},function(){
			console.log('error');
		});
		setInterval(function() {
			screencore.ajaxSubmit("/screen/msg/textrank",{}).then(function(data){
				if(data.code==0){
				    var newarr = data.msg;
				    $.each(newarr,function(i,v){
			        	v.weight = 1;
			        	v.html = {'class':'font'+(i+1)};
			        });
		            
				    newtexts = JSON.stringify(newarr);
				    if(newtexts!=oldtexts){
				        oldtexts = newtexts;
				        $('#cloud').jQCloud('update', newarr);
				    }else{
				        console.log('一样的');
				    }
				}else{
					console.log(data.msg);
				}
			},function(){
				console.log('error');
			});
		}, 5e3);
	});
</script>

<section class="wall-mainbox normal-box">
	<div class="msgwall-lists">
		<div class="wall-list">
		</div>
		<div class="wall-bigshow"></div>
	</div>
</section>
<script type="text/html" id="msg-tpl">
		<div class="wall-item msg-{{ id }}" data-msgid="{{ id }}">
		  <div class="wall-item-box">
			<div class="wall-msg-box zam-app-flex">	
				<div class="wall-item-bg">
					<div class="wall-item-bg-warp"></div>
				</div>
				<div class="wall-item-showmore zam-app-flex-ajCenter2 display-none"><i class="zam-icon-arrow-circle-o-right"></i></div>
				<div class="wall-user zam-app-flex-ajCenter2">
					<div class="wall-user-bg"></div>
					<div class="wall-user-headerimg-box">
						<img class="wall-header-img" src="{{ avatar }}">
					</div>
				</div>	
				<div class="wall-msginfo{{ if type=='3' }} holdscreen{{ /if }}">
					<div class="wall-nickname limitbox">{{ nickname }}{if !isset($pcconfig['showmsgtime']) || $pcconfig['showmsgtime']=='1'} {{ create_time }}{/if}</div>
				{{ if type=='1' }}
					<div class="wall-content">{{#content}}</div>
				{{ else if type=='2' }}
					<div class="wall-content"><img data-msgid="msg-{{ id }}" data-hadshow="{{ if hadshow=='1' }}1{{ else }}0{{ /if }}" class="msgImg" src="{{ content }}" /></div>
				{{ else if type=='3' }}
					<div class="wall-content isholdscreen">
						{{ if content.bpimg!='' }}<div class="bpimgBox"><img data-msgid="msg-{{ id }}" data-hadshow="{{ if hadshow=='1' }}1{{ else }}0{{ /if }}" class="msgImg" src="{{ content.bpimg }}" /></div>{{ /if }}<div class="bptxtBox"><div class="bptxt">(霸屏{{ content.bptime }}秒) {{ content.bptxt }}</div></div>
					</div>
				{{ /if }}
				</div> 
			</div>
		  </div>
		</div>
</script>
<script type="text/html" id="msgbig-tpl">
	<div class="wallbig-item {{ if isholdscreen>0 }}isholdscreen{{ /if }}">
			<i class="closemsgbig zam-icon-error"></i>
			<div class="wallbig-user zam-app-flex">
				<div class="wallbig-avatar"><img src="{{ avatar }}" /></div>
				<div class="wallbig-nickname">{{ nickname }}</div>
			</div>
			<div class="wallbig-content">{{# content }}</div>
	</div>
</script>
<script>
require(['msgs','screensocket','screencore','layerBox','fulldm','keyboard'],function(msgs,screensocket,screencore,layerBox,fulldm,keyboardJS) {
	msgs.init({:json_encode($pcconfig)});
	var wsConfig = {};
	wsConfig.onmessage = function(data){
		if(data.type=='connected'){
			screensocket.isclose = false;
			screencore.connectsocket({clientid:data.clientid});
		}else{
			if(data.type=='del'){
				if(!$.isArray(data.msgid)){
					msgs.delOneMsgs(data.msgid);
				}else{
					$.each(data.msgid,function(index,val){
						msgs.delOneMsgs(val);
					});
				}
			}else if(data.type=='msgreset'){
				msgs.resetMsg();
			}else if(data.type=='msgshenhe'){
				var messages = data.messages;
				if($.isArray(messages)&&messages.length>0){
					$.each(messages,function(i, val){
						msgs.addOneMsgs(val);
					});
				}
			}else if(data.type=='1'||data.type=='2'){
				msgs.addOneMsgs(data);
			}else if(data.type=='screendm'){
				var messages = data.messages;
				if(messages){
					if($.isArray(messages)&&messages.length>0){
						$.each(messages,function(i, val){
							fulldm.addBullet(val);
						});
					}
				}else{
					fulldm.addBullet(data);
				}
			}else if(data.type=='screendeldm'){
				if(!$.isArray(data.msgid)){
					fulldm.delBullet(data.msgid);
				}else{
					$.each(data.msgid,function(index,val){
						fulldm.delBullet(val);
					});
				}
			}else if(data.type=='screenresetdm'){
				if(data.fromtype=='1') msgs.resetMsg();
				fulldm.resetBullet();
			}
		}
	};
	screensocket.init(wsConfig);
	$('.to-firstpage').on('click', function(e) {
		!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.firstpage();
	});
	$('.to-prevpage').on('click', function(e) {
		!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.prevpage();
	});
	$('.to-nextpage').on('click', function(e) {
		!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.nextpage();
	});
	$('.to-lastpage').on('click', function(e) {
		!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.lastpage();
	});
	$('.pause-start-page').on('click', function(e) {
		e.preventDefault();
		if ($(this).find(".mxc-stop").length>0) {
			$(this).find(".mxc-stop").removeClass('mxc-stop').addClass('mxc-playfill');
			msgs.stopNext();//1为完全暂停 2为仅清除定时器
		} else {
			$(this).find(".mxc-playfill").removeClass('mxc-playfill').addClass('mxc-stop');
			!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.startNext();
		}
	});
	$("body").on('mouseover','.wall-item',function(){
		var showMoreBox = $(this).find(".wall-item-showmore");
		showMoreBox.removeClass("display-none");
	});
	$('body').on('mouseleave','.wall-item',function(){
		var showMoreBox = $(this).find(".wall-item-showmore");
	    showMoreBox.addClass("display-none");
	});
	$('body').on('click','.wall-item-showmore',function(){
		if(msgs.istransition) return;
		var wallItem = $(this.parentNode.parentNode);
		var html = msgs.msgBigRender({'nickname':wallItem.find(".wall-nickname").text(),'avatar':wallItem.find(".wall-header-img").attr('src'),'content':wallItem.find(".wall-content").html(),'isholdscreen':wallItem.find('.isholdscreen').length});
		$('.wall-bigshow').html(html).fadeIn(),$('.wall-list').fadeOut(),$('.pause-start-page').trigger('click');
	});
	$("body").on('click','.closemsgbig',function(){
		$('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn(),$('.pause-start-page').trigger('click');
	});
	keyboardJS.bind('space', function(e) {
		$('.pause-start-page').trigger('click');
	});
	keyboardJS.bind('right', function(e) {
		$('.to-nextpage').trigger('click');
	});
	keyboardJS.bind('left', function(e) {
		$('.to-prevpage').trigger('click');
	});
	keyboardJS.bind('up', function(e) {
		$('.to-firstpage').trigger('click');
	});
	keyboardJS.bind('down', function(e) {
		$('.to-lastpage').trigger('click');
	});
	screencore.sendMsg2frame({'type':'msgmenuopen'});
	{if isset($hdinfo['loadtype']) && $hdinfo['loadtype']=='2'}
		window.addEventListener('message', function(e){
	        if (e.origin.indexOf(window.location.host)!=-1 && typeof e.data === 'string') {
	            var fdata = JSON.parse(e.data);
	            if(fdata.type=='firstpage'){
	            	!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.firstpage();
	            }else if(fdata.type=='prevpage'){
	            	!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.prevpage();
	            }else if(fdata.type=='nextpage'){
	            	!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.nextpage();
	            }else if(fdata.type=='lastpage'){
	            	!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.lastpage();
	            }else if(fdata.type=='pausenext'){
	            	msgs.stopNext();
	            }else if(fdata.type=='startnext'){
	            	!$('.wall-bigshow').is(':hidden')&&($('.wall-bigshow').fadeOut(),$('.wall-list').fadeIn()),msgs.startNext();
	            }
	        }
		});
	{/if}
});
</script>
{/if}
