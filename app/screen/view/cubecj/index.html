<style>
.cubecj{
    width: 100%;
    height: 620px;
    padding: 20px 0 30px;
    position: absolute;
    top: 90px;
    bottom: 40px;
}
.cubecj-box{
    width: 100%;
    height: 100%;
}
.cubecj-left{
    position: relative;
    height: 636px;
    width: 310px;
    background-image: url(/static/images/screen/cubecj/leftbg.png);
    background-repeat: no-repeat;
    background-size: cover;
    border-radius: 16px;
    padding: 20px 10px 20px 15px;
    box-sizing: border-box;
}
.left-title{
    text-align: center;
    font-size: 20px;
    color: #ffff;
    margin-top: 5px;
    font-weight: 500
}
.cubecj-awards {
    padding-top: 10px;
}
.cubecj-awards-select {
    width: 100px;
    margin: 0 auto;
    cursor: pointer;
    font-size: 15px;
    line-height: 40px;
    position: relative;
}
.cubecj-awards-select::after {
    content: " ";
    display: block;
    width: 5px;
    height: 5px;
    border-left: 1px solid #fff;
    border-bottom: 1px solid #fff;
    top: 14px;
    right: 4px;
    position: absolute;
    transform: rotate(-46deg);
    transition: all .3s ease-in;
}
.cubecj-awards-select.open::after {
    transform: rotate(134deg);
    transition: all .3s ease-in;
    top: 16px;
}
.cubecj-awards-select.open ul {
    display: block;
    transform-origin: 50% 0;
    -webkit-animation: slide-down .5s ease-in;
    transition: max-height .2s ease-in;
    background: rgba(0, 0, 0, 0.8);
    animation: slide-down .5s ease-in;
}
@-webkit-keyframes slide-down {
    0% {
        transform: scale(1, 0);
    }
    25% {
        transform: scale(1, 1.2);
    }
    50% {
        transform: scale(1, 0.85);
    }
    75% {
        transform: scale(1, 1.05);
    }
    100% {
        transform: scale(1, 1);
    }
}
.cubecj-awards-select .cubecj-selname {
    width: 90%;
    line-height: 40px;
    font-size: 15px;
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    background: url(/static/images/screen/cubecj/lineselected.png) center bottom no-repeat;
    background-size: 100% auto;
}
.cubecj-awards-select ul {
    display: none;
    font-size: 15px;
    position: absolute;
    top: 40px;
    left: 0;
    max-height: 360px;
    overflow: auto;
    transition: max-height .3s ease-in;
}
.cubecj-awards-select ul li {
    height: 40px;
    line-height: 40px;
    color: #fff;
    background: url(/static/images/screen/cubecj/lineselected.png) center bottom no-repeat;
    background-size: 100% auto;
    width: 100px;
    text-align: center;
    white-space:nowrap;
    text-overflow:ellipsis;
    overflow:hidden;
}
.cubecj-awards-select ul li.cubecj-sel {
    color: #ffb502;
}
{/* 奖品信息 */}
.cubecj-leftprize{
    margin: 12px 0;
    color: #fff;
}
.cubecj-leftprize img{
    width: 220px;
}
.cubecj-leftprize p{

}
.left-setbox{

     background-repeat: no-repeat;

    width: 238px;
    margin: 12px auto;
    line-height: 45px;

    font-size: 14px;
    color: rgba(255, 255, 255, 0.5);
}
.left-settitle{width: 100px;text-align: center;}
.left-number-set img{
    vertical-align: middle;
    width: 30px;
    height: 30px;
    cursor: pointer;
}
.left-number-set input {
    width: 60px;
    text-align: center;
    color: #fff;
    font-size: 20px;
    border-radius: 50%;

    border: none;

}
.start-btn{
    width: 160px;
    height: 54px;
    margin: 0 auto;
    background-image: url(/static/images/screen/cubecj/start.png);
    background-repeat: no-repeat;
    background-size: cover;
    cursor: pointer;
}
.cubecj-right{
    position: relative;
    margin-left: 0px;
    height: 636px;
    width: 892px;
    background-image: url(/static/images/screen/cubecj/rightbg.png);

    background-size: cover;
    border-radius: 16px;
    padding: 20px 20px 20px 25px;
    box-sizing: border-box;
}
.right-title{
    text-align: center;
    font-size: 20px;
    color: #ffff;
    margin-top: 5px;
    font-weight: 500
}
{/*动画盒子*/}
.cubecj-anibox{
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}
.cubecj-mode{
    width: 100%;
    height: 100%;
    perspective:1000px;
    overflow: hidden;
}
.cubecj-avatarwall {
    position: absolute;
    top: 0;
    left: 0;
    width:100%;
    height:100%; 
    perspective-origin: center;
    transform-style: preserve-3d;
    
}
.cubecj-avatarwall li {
    position: absolute; 
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
    top: 50%;
    left: 50%;
}
.cubecj-avatarwall li img{
    width:140px;
    height:140px;
    //background-color: rgba(255,255,255,0.6);
    //border: 1px solid rgba(255,255,255,0.7);
    border-radius: 5px;
    background-color: #fff;
    //box-shadow: 0 0 10px #fff;
}
.cubecj-avatarwall li .mask{
    position: absolute;
    top:0;
    left:0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    display: none;
}
.cubecj-avatarwall li.active .mask{
    display: block;
}
{/*cubebox*/}
.cubebox{
    width: 100%;
    height: 100%;
    position: absolute;
    transform-style: preserve-3d;
    transform: rotateX(-10deg);
}
.cube {
    width: 50%;
    height: 50%;
    position: absolute;
    top: 25%;
    left: 25%;
    perspective: -1000px 1000px;
    transform-style: preserve-3d;
    transform: rotateY(20deg) rotateX(20deg) translateZ(-100px);
    animation: name 3s linear infinite;
}
.cubeAni1{
    animation: name 3s linear infinite;
}
.cubeAni2{
    animation: name2 8s linear infinite;
}
.img {
    background-color: rgba(177, 174, 174, 0.6);
    background-color: #fff;
    box-shadow: 0 0 30px #fff;
}
.imglight{
    background-color: #fff;
    box-shadow: 0 0 30px #fff;
}
.first {
    transform: translateX(-50%)rotateY(-90deg);
}
.second {
    transform: translateZ(50px);
}
.third {
    transform: translateX(50%) rotateY(90deg);
}
.fourth {
    transform: translateZ(-50px);
}
.fifth {
    transform: translateY(50%) rotateX(90deg);
}
.sixth {
    transform: translateY(-50%) rotateX(90deg);
}

@keyframes name {
    0% {
        transform: rotateX(0deg) rotateY(0deg);
    }
    25% {
        transform: rotateY(90deg) rotateX(180deg);
    }
    50% {
        transform: rotateY(180deg) rotateX(360deg);
    }
    75% {
        transform: rotateY(270deg) rotateX(540deg);
    }
    100% {
        transform: rotateY(360deg) rotateX(720deg);
    }
}
@keyframes nameoo {
    0% {
        transform: rotateX(0deg) rotateY(0deg);
    }
    33% {
        transform: rotateY(120deg) rotateX(120deg);
    }
    66% {
        transform: rotateY(240deg) rotateX(240deg);
    }
    100% {
        transform: rotateY(360deg) rotateX(360deg);
    }
}
@keyframes name2 {
    0% {
        transform: rotateY(0deg) rotateX(0deg);
    }
    33% {
        transform: rotateY(120deg) rotateX(0deg);
    }
    66% {
        transform: rotateY(240deg) rotateX(0deg);
    }
    100% {
        transform: rotateY(360deg) rotateX(0deg);
    }
}
.cubecj-cubes {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: self-end;
}
.cubecj-cubes li {
    position: relative;
    width: 200px;
    height: 200px;    
}

.cubecj-cubes li img {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    background-color: #fff;
    box-shadow: 0 0 30px #fff;
}
.cubecj-cubes li p {
    position: relative;
    margin-top: 60%;
}
.lottery-item {
    position: absolute;
    top: 50%;
    width: 100%;
    height: 100%;
    left: 0%;
    overflow: hidden;
    white-space: nowrap;
    -ms-text-overflow: ellipsis;
    text-overflow: ellipsis;
    font-size: 16px;
    color: #fff;
    line-height: 1.5;
    text-align: center;
    z-index: 2;
    text-shadow: 0 0 2px rgba(0, 0, 0, 1.0);
    -webkit-transform: translateY(-50%);
    -moz-transform: translateY(-50%);
    -ms-transform: translateY(-50%);
    -o-transform: translateY(-50%);
    transform: translateY(-50%);
    perspective: 1000px;
    transform-style: preserve-3d;
}
.stopText{
    position: absolute;
    left: 0;
    bottom: 0;
    right: 0;
    z-index: 2;
    margin: 0 auto;
    width: -webkit-max-content;
    width: -moz-max-content;
    width: max-content;
    height: 100px;
    line-height: 100px;
    font-size: 16px;
    color: #fff;
    text-align: center;
    -webkit-animation: opacityani 2s ease-in-out infinite backwards;
    animation: opacityani 2s ease-in-out infinite backwards;
}
@-webkit-keyframes opacityani{0%{opacity:.2}50%{opacity:.8}to{opacity:.2}}
.cubecj-mode2 ul{
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;

.cubecj-mode2 ul li{

    width: 600px;
    height: 600px;
}
.cubecj-mode2 ul img{
    width: 100%;
    height: 100%;
    border-radius: 50%;
}

    function oneavatar(user) {
        return  $('<li class=\"card\">' + '<img class=\"card\" src =' + (user.avatar ? user.avatar : "") + '>' + '</li>');
    }
    function makewall(){
        var index = 0,cols = 7,rows = 50;
        for (var i = 0; i < cols; i++) {
            for (var j = 0; j < rows; j++) {
                var _0x1D83C = 360 / rows * j / 180 * Math.PI;
                var _0x1D91C = 1500,
                    _0x1D8AC = 150;
                var pos = {
                    rotation: [0, 135 - _0x1D83C, 0],
                    position: [Math.sin(_0x1D83C) * _0x1D91C, (i - 3) * _0x1D8AC, Math.cos(_0x1D83C) * _0x1D91C],
                    duration: 0,
                };
                var obj = oneavatar(users[index]);
                index++;
                if (index >= users.length) {
                    index = 0;
                };
                obj.snabbt(pos);
                obj.appendTo($(".cubecj-avatarwall"));
                //lotteryCard.push(obj)
            }
        };
        //changevatar();
        wallrotate();
    }
    function changevatar(){
        var avatatimgs = $(".cubecj-avatarwall li img");
        clearInterval(mode2timer);
        mode2timer = setInterval(function() {
            var oneavatarimg = avatatimgs.eq(Math.floor((Math.random()*avatatimgs.length)));
            oneavatarimg.attr('src',users[Math.floor((Math.random()*users.length))].avatar);
        },30);
    }
    function wallrotate() {
        if (isstarted == '2') {
            return false;
        };
        var wall = $(".cubecj-avatarwall");
        wall.snabbt({
            rotation: [0, 0, 0],
            duration: 0,
        }).snabbt({
            rotation: [0, Math.PI * 2, 0],
            duration: 8e3,
            complete: function() {
                wallrotate();
            }
        })
    }
    function makeavatar2() {
        require(['screencore'],function(screencore){
            var obj = oneavatar(users[(Math.floor(Math.random() * users.length))]);
            obj.appendTo($(".cubecj-mode2 ul"))
            var x = screencore.randomInt(-3000,3000);
            var y = screencore.randomInt(-4000,4000);
            obj.snabbt({
                fromPosition: [x, y, -40000],
                position: [x, y,0],
                duration: screencore.randomInt(1e3,2e3),
                complete: function() {
                    obj.remove();
                }
            })
        })
    }
