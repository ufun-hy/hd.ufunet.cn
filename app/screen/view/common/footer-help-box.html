{php}
if(!isset($newerconfig) || empty($newerconfig)){
	$newerconfig = globalnewerconfig();
}
{/php}
<style type="text/css">
.help-shadow{
	box-shadow: 0 0 10px {$newerconfig['catebordercolor']};
}
.help-popimg{display: none}
{if isset($hdinfo['loadtype']) && $hdinfo['loadtype']=='2'}
.showhelp .help-popimg{display: block}
.showkeyboard .help-popimg{display: none;}
.showkeyboard .help-shadow{display: none;}
.showkeyboard .help-keyboard{display: block}
{/if}
.hdQrbox .help-qr{
	{if isset($newerconfig['qrpopimg']) && !empty($newerconfig['qrpopimg'])}
		background-image: url({:tomedia($newerconfig['qrpopimg'])});
	{/if}
}
.help-newer {
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,.8);
    position: fixed;
    top: 0;
    left: 0;
    z-index: 6;
    display: none;
}
.showhelp .help-newer{display: block;}
.help-newer .help-items {
    width: 280px;
    height: 82px;
    background-color: #0d0d0d;
    border-radius: 10px;
    position: absolute;
    left: calc(50% - 145px);
    top: 30px;
    padding: 0 15px;
}
.help-newer .help-close i{font-size: 50px;}
.help-newer .help-items .help-item {
    width: 120px;
    height: 54px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    font-size: {$newerconfig['catesize']}px;
    color: {$newerconfig['catecolor']};
    background: {$newerconfig['catebgcolor']};
}
.help-newer .help-items .active, .help-newer .help-items .help-item:hover {
    background: linear-gradient(180deg,{$newerconfig['cateactivebgcolor']},{$newerconfig['cateactivebgcolor2']});
    text-shadow: 0 0 10px {$newerconfig['cateshadowcolor']??'#00bcd4'};
}
.help-newer .help-close {
    position: absolute;
    right: 50px;
    top: 30px;
    color: #fff;
    cursor: pointer;
}
.help-newer .help-close img{
	-moz-user-select: -moz-none;
	-khtml-user-select: none;
	-webkit-user-select: none;
	-o-user-select: none;
	user-select: none;
}
.help-keyboard{
	width: 860px;
	height: 800px;
	margin: 0 auto;
	display: none;
}
.help-newer .help-keyboard div{
	width: 100%;
	height: 100%;
}
.help-newer .help-keyboard div img{
	width: 100%;
}
</style>
<div class="help-newer">
	<div class="help-items zam-app-flex zam-app-alignCenter zam-app-justifyspacebetween">
		<div class="help-item zam-app-flex-ajCenter2 active">{$newerconfig['cateonename']}</div>
		<div class="help-item zam-app-flex-ajCenter2">{$newerconfig['catetwoname']}</div>
	</div>
	<div class="help-close zam-app-flex-ajCenter2">
		<img src="{if isset($newerconfig['closebtn']) && !empty($newerconfig['closebtn'])}{:tomedia($newerconfig['closebtn'])}{else /}__STATIC__/images/screen/common/help/close.png{/if}" draggable="false" oncontextmenu="return false;" />
	</div>
	<div class="help-keyboard">
		<div class="zam-app-flex-ajCenter2">
			{if isset($newerconfig['qrpopimg']) && !empty($newerconfig['qrpopimg'])}
				<img src="{:tomedia($newerconfig['keyboardpopimg'])}" />
			{/if}
			
		</div>
	</div>
</div>
<script type="text/javascript">
	$(function(){
		$(".help-newer .help-item").click(function(){
			var $this = $(this),helpitem = $(this).index();
			$this.addClass('active');
			if(helpitem==0){
				$this.next().removeClass('active');
				$('body').removeClass('showkeyboard');
				if(XCV3Config.loadtype=='1'){
					if($(".hdQrbox").is(':hidden')){
						$(".openqr").trigger('click');
					}
				}else{
					$(window.parent.document).find('body').removeClass('showkeyboard');
					if($(".hdQrbox").is(':hidden')){
						$(window.parent.document).find(".openqr").trigger('click');
					}
				}
			}else{
				$this.prev().removeClass('active');
				$('body').addClass('showkeyboard');
				if(XCV3Config.loadtype=='1'){
					if(!$(".hdQrbox").is(':hidden')){
						$(".openqr").trigger('click');
					}
				}else{
					$(window.parent.document).find('body').addClass('showkeyboard');
					if(!$(".hdQrbox").is(':hidden')){
						$(window.parent.document).find(".openqr").trigger('click');
					}
				}
			}
		});
		$(".help-newer .help-close").click(function(){
			require(['layerBox'],function(layerBox){
				layerBox.showConfirm('温馨提醒','新手引导关闭后可通过点击右下角帮助菜单重新打开?',['确定','取消'],function(){
					if(XCV3Config.loadtype=='1'){
						$(".openhelp").trigger('click');
					}else{
						$(window.parent.document).find('.openhelp').trigger('click');
					}
					window.localStorage.setItem("closehelp"+XCV3Config.hdid,'1');
				});
			});
		});
	})
</script>
