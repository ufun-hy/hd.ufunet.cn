						var autowidth = fullwidth -  $(".control-normal-list").outerWidth(true);

							autowidth -= $(".control-msg-list").outerWidth(true);
						}
						$(".control-module-list").css({"width":autowidth+'px'});

						var activeobj = $(".control-module-list .icon-box.active");

						}
