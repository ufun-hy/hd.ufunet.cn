{include file='common/header' /}
<style type="text/css">
#container{width:100%; height: 100%; position:relative;}
#container div img{width:calc(100% - 20px);height:calc(100% - 20px);border-radius:50%;object-fit: contain;}
.popsqimgbox{
	position:absolute;top:0;left:0;width:100%;height:100%;
}
.popsqimg{
	width:400px;
	height:400px;
	border-radius:50%;
	background-color:transparent;
	background-size:cover;
	background-repeat:no-repeat;
}
.popsqimg img{width:300px;height:auto;border-radius:50%;}
.popsqimg p{font-size:50px!important;}
{if $pcconfig['hidesignnum']=='1'}
.joinPeople{display: none}
{/if} 
</style>
<div id="container"></div>
<script id="bigpop-tpl" type="html/javascript">
<div class="popsqimgbox zam-app-flex-ajCenter2">
	<div class="popsqimg zam-app-flex-ajCenter2" style="background-image:url({{ppimg}});">
		{{#html}}
	</div>
</div>
</script>
<script>
var ppqdconfig = {
	appmode:"{$pcconfig['appmode']}",
	ppcontype:"{$pcconfig['ppcontype']}",
	ppconcolortype:"{$pcconfig['ppconcolortype']}",
	ppconcolor:"{$pcconfig['ppconcolor']}",
	ppconsize:"{$pcconfig['ppconsize']}",
	maxballs:"{$pcconfig['maxballs']}",
	minbj:parseInt("{$pcconfig['minbj']}"),
	maxbj:parseInt("{$pcconfig['maxbj']}"),
	collchangecolor:"{$pcconfig['collchangecolor']}",
	fromconner:"{$pcconfig['fromconner']}",
	speedtype:"{$pcconfig['speedtype']}",
	ppbgimgs:{:json_encode($pcconfig['ppbgimgs'])},
	mobileinfo:{:json_encode($mobileinfo)},
};
require(['screensocket','screencore','template','layerBox','fulldm'],function (screensocket,screencore,template,layerBox,fulldm) {
var BallBox = {
	qdmode:ppqdconfig.appmode,
	maxid:0,
	minbj:ppqdconfig.minbj,
	maxbj:ppqdconfig.maxbj,
	maxballs:ppqdconfig.maxballs,
	loaded:false,
	signQueue:[],
	oldSign:[],
	container:null,
	width:window.innerWidth/((window.innerHeight / 800).toFixed(4)),
	height:800,
	child:[],
	ballRunTimer:null,
	init:function(dom){
		var params = {};
		params.onmessage = function(data){
			if(data.type=='connected'){
				screensocket.isclose = false;
				screencore.connectsocket({clientid:data.clientid});
			}else if(data.type=='screendm'){
				var messages = data.messages;
				if(messages){
					if($.isArray(messages)&&messages.length>0){
						$.each(messages,function(i, val){
							fulldm.addBullet(val);
						});
					}
				}else{
					fulldm.addBullet(data);
				}
			}else if(data.type=='screendeldm'){
				if(!$.isArray(data.msgid)){
					fulldm.delBullet(data.msgid);
				}else{
					$.each(data.msgid,function(index,val){
						fulldm.delBullet(val);
					});
				}
			}else if(data.type=='screenresetdm'){
				fulldm.resetBullet();
			}
		};
		screensocket.init(params);

		this.container = $(dom)[0];
		this.ballRun();
		this.bindevent();
		this.getSignList();
	},
	bindevent:function(){
		var self = this;
		window.onresize = function(){
			self.resize();
			self.ballRun();
		};
	},
	addBall:function(a){
		this.child.push(a);
		if (a.e.parentNode != this.container) {
			this.container.appendChild(a.e)
		}
	},
	removeBall:function(){
		var self = this;
		if(self.child.length >= self.maxballs){
			var firstball = self.child.shift();
			$("."+firstball.classname).remove();
		}
	},
	ballRun:function(){
		clearInterval(this.ballRunTimer);
		var g = this;
		var w = this.width;
		var h = this.height;
		var k = this.isColl;
		var l = this.coll;
		this.ballRunTimer = setInterval(function() {
			var a = g.child;
			var c = a.length;
			for (var i = 0; i < c; i++) {
				a[i].foot()
			}
			for (var i = 0; i < c; i++) {
				var d = a[i];
				var b = d.b;
				if (d.x < b) {
					d.x = b;
					d.sx *= -1
				}
				if (d.y < b) {
					d.y = b;
					d.sy *= -1
				}
				var e = w - b;
				if (d.x > e) {
					d.x = e;
					d.sx *= -1
				}
				var f = h - b;
				if (d.y > f) {
					d.y = f;
					d.sy *= -1
				}
			}
			for (var i = 0; i < c; i++) {
				for (var j = i + 1; j < c; j++) {
					if (k(a[i], a[j])) {
						l(a[i], a[j]);
						a[i].collNum++;
						a[i].callBack(a[i].collNum);
						a[j].collNum++;
						a[j].callBack(a[j].collNum)
					}
				}
			}
		}, 30)
	},
	ballStop:function(){
		clearInterval(this.ballRunTimer)
	},
	coll:function(a,b){
		var c = b.x - a.x;
		var d = b.y - a.y;
		var e = b.sx - a.sx;
		var f = b.sy - a.sy;
		var g = Math.atan2(f, e);
		var h = Math.atan2(-d, -c);
		var i = Math.abs(h - g);
		var D = Math.PI / 2;
		if (i <= 3 * D && i >= D) return;
		var j = a.m || 1;
		var k = b.m || 1;
		var l = j + k;
		var m = ((j - k) * a.sx + 2 * k * b.sx) / l;
		var n = ((k - j) * b.sx + 2 * j * a.sx) / l;
		var o = ((j - k) * a.sy + 2 * k * b.sy) / l;
		var p = ((k - j) * b.sy + 2 * j * a.sy) / l;
		a.sx = m;
		a.sy = o;
		b.sx = n;
		b.sy = p
	},
	isColl:function(a,b){
		if (a.stopfoot || b.stopfoot) return false;
		var d = Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2);
		var c = Math.pow(a.b + b.b, 2);
		return d < c
	},
	resize:function() {
		this.width = window.innerWidth/((window.innerHeight / 800).toFixed(4));
		this.height = 800;
	},
	getSignList:function(){
			var self = this;
			screencore.ajaxSubmit("/screen/ppqd/getsigndata",{}).then(function(data){
				if(data.code==0){
					var ajaxsigns = data.msg.list,signLength = ajaxsigns.length;
					if(signLength > 0 ){
						self.maxid = ajaxsigns[0].id;
						ajaxsigns = ajaxsigns.reverse();
						for (var m=0;m<signLength;m++) {
							self.signQueue.unshift(ajaxsigns[m]);
						};
						self.oldSign = ajaxsigns;
					}
					$(".joinPeople").html('<span>'+data.msg.total+'</span>人签到');
					self.loaded = true;
					setInterval(function() {
						if(self.loaded){
							self.append();
						}
					},4e3);
				}else{
					layerBox.showMsg(data.msg);
				}
			},function(){
				layerBox.showMsg('加载出错');
			});
			setInterval(function() {
				self.loaded&&self.ajaxNewsign();
			}, 5000);
	},
	ajaxNewsign:function(){
		var self = this;
		screencore.ajaxSubmit("/screen/ppqd/newsign",{maxid:self.maxid}).then(function(data){
				if(data.code==0){
					var ajaxmsgs = data.msg.list,newsignLength = ajaxmsgs.length;
					if(newsignLength > 0 ){
						self.maxid = ajaxmsgs[0].id;
						ajaxmsgs = ajaxmsgs.reverse();
						for (var m=0;m<newsignLength;m++) {
							var oneMsg = ajaxmsgs[m];
							self.signQueue.unshift(oneMsg);
						};
					}
					$(".joinPeople").html('<span>'+data.msg.total+'</span>人签到');
				}
		},function(){
			layerBox.showMsg('加载出错');
		});
	},
	append:function() {
		var self = this;
		if (self.signQueue.length == 0){
			return false;
		}
		var i = self.signQueue.pop();//方法用于删除并返回数组的最后一个元素
		var $html = '';
		if(self.qdmode=='2'){
			if(ppqdconfig.ppcontype=='1'){
				$html += '<img src="'+i.avatar+'">';
			}else{
				var ppconcolor = ppqdconfig.ppconcolortype=='1'?ppqdconfig.ppconcolor:self.randColor();
				var style = "text-align:center;font-size:"+ppqdconfig.ppconsize+"px;color:"+ppconcolor;
				var txt = '';
				if(ppqdconfig.ppcontype=='2'){
					txt += i.nickname;
				}else{
					if(ppqdconfig.mobileinfo.open=='1'){
						if(i.bddata&&i.bddata.mobile){
							txt = i.bddata.mobile;
							if(ppqdconfig.mobileinfo.hidemiddle=='1'){
								txt = txt.substr(0,3)+"****"+txt.substr(7);
							}
						}
					}
				}
				$html += '<p class="limitbox" style="'+style+'">'+txt+'</p>';
			}
		}else{
			$html += '<img src="'+i.sqimg+'">';
		}
		var ppimg = ppqdconfig.ppbgimgs[Math.floor(Math.random()*ppqdconfig.ppbgimgs.length)];
		var ball = new Ball({
			'b':rand(self.minbj,self.maxbj),
			'x':self.fromconner('x'),
			'y':self.fromconner('y'),
			'sx':self.speedball(),
			'sy':self.speedball(),
			'c':'url('+ppimg+')',
			'classname':'ball-'+i.id,
			'html':$html,
			'callBack':function(n){
				ppqdconfig.collchangecolor=='1' && this.setC('url('+ppqdconfig.ppbgimgs[Math.floor(Math.random()*ppqdconfig.ppbgimgs.length)]+')');
			}
		});
		if(ppqdconfig.fromconner=='6'){
			$("#container").append(template('bigpop-tpl',{ppimg:ppimg,html:$html}));
			$('.popsqimgbox').animateControl(screencore.anicssArr(),function(){
				setTimeout(function(){
					$(".popsqimgbox").remove();
					self.addBall(ball);	
				},1e3)
			});
		}else{
			self.addBall(ball);
		}
		self.removeBall();
	},
	speedball:function(){
		return ppqdconfig.speedtype=='1'?rand(1,4):ppqdconfig.speedtype=='2'?rand(4,10):rand(8,20);
	},
	randColor:function(){
			var e = .78,
			t = ["rgba(141,50,160," + e + ")", "rgba(225,99,15," + e + ")", "rgba(242,73,73," + e + ")", "rgba(18,155,240," + e + ")", "rgba(90,162,12," + e + ")", "rgba(20,185,148," + e + ")"],
			n = Math.floor(6 * Math.random());
			return t[n]
	},
	fromconner:function(type){
		var self = this;
		var leftpos = [-200,self.width];
		var toppos = [-200,800];
		if(ppqdconfig.fromconner=='1'){
			return type=='x'?leftpos[Math.floor((Math.random()*leftpos.length))]:toppos[Math.floor((Math.random()*toppos.length))];
		}else if(ppqdconfig.fromconner=='2'){
			return -200;
		}else if(ppqdconfig.fromconner=='3'){
			return type=='x'?self.width:-200;
		}else if(ppqdconfig.fromconner=='4'){
			return type=='x'?-200:self.height;
		}else if(ppqdconfig.fromconner=='5'){
			return type=='x'?self.width:self.height;
		}else{
			return type=='x'?self.width/2:self.height/2;
		}
	},
};
function Ball(a) {
	var a = this.json = a || {};
	var d = this.type = a.type || 'ball';
	var b = this.b = a.b || 30;
	var f = this.borderWidth = a.borderWidth || 0;
	var g = this.borderColor = a.borderColor || '#000';
	var x = this.x = a.x || b;
	var y = this.y = a.y || b;
	var h = this.sx = a.sx || 3;
	var i = this.sy = a.sy || 3;
	var m = this.m = a.m || (b / 30);
	var c = this.c = a.c || 'pink';
	var e = this.e = a.e || document.createElement('div');
	var j = this.html = a.html;
	var k = this.opa = a.opa || 1;
	var l = this.fontSize = a.fontSize || 12;
	this.classname = a.classname || 'ball-0';
	var n = this.callBack = a.callBack ||
	function() {};
	this.collNum = 0;
	this.initStyle();
	this.addEvent()
}
Ball.prototype.initStyle = function() {
	var b = this.b;
	var s = this.e.style;
	s.position = 'absolute';
	s.top = s.left = 0;
	s.width = s.height = (b - this.borderWidth) * 2 + 'px';
	//s.borderRadius = '50%';
	s.background = this.c;
	s.backgroundSize = 'cover';
	s.border = this.borderWidth + 'px solid ' + this.borderColor;
	s.opacity = this.opa;
	this.e.className = 'zam-app-flex-ajCenter2 ' + this.classname;
	if (this.html) {
		this.e.innerHTML = this.html;
	}
	this.setPos()
};
Ball.prototype.addEvent = function() {
	var a = this;
	this.e.onmouseenter = function() {
		//a.stopFoot()
	};
	this.e.onmouseout = function() {
		//a.startFoot()
	}
};
Ball.prototype.foot = function(n) {
	if (this.stopfoot) return;
	var n = n || 1;
	this.x += this.sx * n;
	this.y += this.sy * n;
	this.setPos()
};
Ball.prototype.startFoot = function() {
	this.stopfoot = false;
	this.e.style.zIndex = 1
};
Ball.prototype.stopFoot = function() {
	this.stopfoot = true;
	this.e.style.zIndex = 999
};
Ball.prototype.setPos = function() {
	var b = this.b;
	var x = parseInt(this.x - b);
	var y = parseInt(this.y - b);
	this.e.style.transform = 'translate(' + x + 'px,' + y + 'px)';
	this.e.style.webkitTransform = 'translate(' + x + 'px,' + y + 'px)'
};
Ball.prototype.setB = function(n) {
	var b = this.b = n;
	var s = this.e.style;
	s.width = s.height = (b - this.borderWidth) * 2 + 'px';
	s.lineHeight = (b - this.borderWidth) * 2 + 'px';
	this.setPos()
};
Ball.prototype.setC = function(a) {
	var c = this.c = a;
	this.e.style.background = c;
	this.e.style.backgroundSize = 'cover'
};
Ball.prototype.setBorderWidth = function(n) {
	var n = this.borderWidth = n;
	var s = this.e.style;
	s.width = s.height = (this.b - n) * 2 + 'px';
	s.lineHeight = (this.b - n) * 2 + 'px';
	s.border = n + 'px solid ' + this.borderColor
};
Ball.prototype.setBorderColor = function(a) {
	var a = this.borderColor = a;
	this.e.style.border = this.borderWidth + 'px solid ' + a
};
Ball.prototype.setM = function(n) {
	this.m = n || this.b / 30
};
Ball.prototype.setHTML = function(a) {
	var b = this.html = a;
	var s = this.e.style;
	this.e.innerHTML = b;
	s.textAlign = 'center';
	s.lineHeight = (this.b - this.borderWidth) * 2 + 'px';
	s.fontSize = this.fontSize + 'px'
};
Ball.prototype.setOpa = function(n) {
	var a = this.opa = n;
	this.e.style.opacity = n
};
BallBox.init('#container');
function rand(m,n){return m+parseInt((n-m)*Math.random());}
});
</script>
{include file='common/footer' /}
