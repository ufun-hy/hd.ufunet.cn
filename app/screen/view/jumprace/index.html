<style>
.shuqian-mainbox{
	width: 100%;
    height: 100%;
    margin: 0 auto;
	padding:0;
    overflow: hidden;
}
.shu-rank-list {
    position: absolute;
    bottom:50px;
	left:40px;
    width: calc(100% - 80px);
    text-align: center;
	display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-justify-content: space-around;
    -ms-flex-pack: distribute;
    justify-content: space-around;
    -webkit-box-align: end;
    -webkit-align-items: flex-end;
    -ms-flex-align: end;
    align-items: flex-end;
}
.shu-rank-item{
	position: relative;
	width: 60px;
	height: 56px;/*max-height:540px*/
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-orient: vertical;
    -webkit-box-direction: normal;
    -webkit-flex-direction: column;
    -ms-flex-direction: column;
    flex-direction: column;
    -webkit-box-pack: end;
    -webkit-justify-content: flex-end;
    -ms-flex-pack: end;
    justify-content: flex-end;
}
.shu-rank-item .column{
	position: relative;
    width: 100%;
    min-height: 8px;
    height: calc(100% - 44px);
}
.shu-rank-item-body {
	background-image: url("{:tomedia($pcconfig['style']['bplate'])}");
	height: 100%;
    background-repeat: repeat-y;
    background-position: bottom;
}
.shu-rank-item-head{
	position: absolute;
    content: "";
    left: 0;
    width: 100%;
	top: 0;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
}
.shu-rank-item-footer{
	position: absolute;
    content: "";
    left: 0;
    width: 100%;
	bottom: 0;
    -webkit-transform: translateY(100%);
    transform: translateY(100%);
}
.shu-rank-item-info {
	text-align: center;
    font-size: 20px;
    overflow: hidden;
    position: absolute;
    top: -126px;
    width: 100px;
    left: -20px;
}

.shu-rank-item-info img {
	width: 70px;
	height: 70px;
	border-radius: 50%;
	border: 1px solid #fdbe23
}

.shu-rank-item-info .shu-rank-item-name {
	display: block;
	color: #fff;
	white-space: nowrap;
	line-height: 200%
}

.shu-rank-item-info .shu-rank-item-score {
	display: block;
	color: #ffd24c;
	white-space: nowrap
}
.shu-rank-list .shu-rank-item .drop {
	position:absolute;
    width: 15px;
    height: 42px;
    background-image:url("{:tomedia($pcconfig['style']['appplayer'])}");
	background-repeat:no-repeat;
    margin: 0 auto;
    left: 22.5px;
    background-size: cover;
	display:none;
	top: -20px;
	z-index:1;
    -webkit-transform: translateY(-50%);
    transform: translateY(-50%);
}
.shu-rank-list .shu-rank-item .drop.drop1{display:block;-webkit-animation:drop1 1s ease forwards; -moz-animation:drop1 1s ease forwards; animation:drop1 1s ease forwards;}
@-webkit-keyframes drop1 {
  0%{  -webkit-transform:translateY(-1000%) rotate(90deg);}
  100%{ -webkit-transform:translateY(-50%) rotate(0deg);}
}
</style>
