{include file='common/header' /}
<style>
.liuyancj-mainbox{
	top:90px;
	bottom:40px;
}
.liuyan-welcomeBox{
	width:100%;
	height:100%;
}
.liuyancj-center {
	position: relative;
    width: 622px;
    height: 603px;
	text-align:center;
	background-image: url("{:tomedia($pcconfig['defaultstyle']['leftbg'])}");
    background-size: 100% 100%;
}
.liuyan-joinnum{
	position:absolute;
	top:50px;
	left:0;
	width:100%;
	height: 38px;
    line-height: 38px;
	text-align:center;
    font-size: 20px;
    color: #fff;
}
.liuyan-joinnum span{display:inline-block;line-height:38px;color:#fff;margin-left:10px;}
.liuyan-messageBox{
   position: relative;
    top: 105px;
    left: 66px;
    width: 490px;
    height: 407px;
    padding: 0 10px;
    overflow: hidden;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box;
}
.liuyan-messagelist{
	position: relative;
}
.liuyan-messagelist li{
	height: 89.2px;
    margin-top: 10px;
    border-radius: 10px;
	background-color:#fff;
	padding:0 10px;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box; 
}
.liuyan-message-avatar img{
	width:56px;
	height:56px;
	border-radius:50%;
}
.liuyan-message-info{
	width:calc( 100% - 64px);
	padding-left:15px;
	text-align:left;
	font-size:20px;
	color:#333;
}
.liuyan-message-username{
	height:35.2px;
	line-height:35.2px;
	font-weight:800;
}
.liuyan-message-content{
	max-height:54px;
	line-height:27px;
	overflow:hidden;
}
.faceImg{
	width:25px;height:25px;
}
.liuyan-setting{
	position: relative;
    left: 0;
    top: 110px;
    width: 80%;
    height: 70px;
    margin: 0 auto;
	color:#fff;
}
.liuyan-startbtn{
	width:160px;
    height:53.6px;
    background-image: url("{:tomedia($pcconfig['defaultstyle']['startbtn'])}");
    background-size: 100% 100%;
	line-height:48px;
	font-size:22px;
	cursor: pointer;
}

.liuyan-selnum{
	width: 134px;
    height:38px;
    border-radius:38px;
    background: #FFF;
    //border: 1px solid #f48d10;
    text-align: center;
    line-height: 38px;
    position: relative;
    color: #d63645;
	cursor:pointer;
}
.liuyan-selnum input{
	width: 100%;
    height: 100%;
    text-align: center;
    color: #d63645;
    background: 0 0;
    border: none;
    outline: 0;
    font-size:16px;
}
.liuyan-selprize{
	width: 140px;
    height:38px;
    border-radius:38px;
    background: #FFF;
    //border: 1px solid #f48d10;
    text-align: center;
    line-height: 38px;
    position: relative;
    color: #d63645;
}
.liuyan-selprize span.selaward{display:inline-block;width: 120px;padding-right: 20px;cursor:pointer;}
.liuyan-selprize span.selarrow{display: inline-block;
    position: absolute;
    right:2px;
    top: 0;
	font-size:18px;
    transform: rotate(-90deg);
	-webkit-transform: rotate(-90deg);
	-mos-transform: rotate(-90deg);
}

.liuyan-awardlist{
    width: 100px;
    overflow: hidden;
    position: absolute;
    bottom:40px;
    left: 50%;
    transform: translateX(-50%);
}
.liuyan-awardlist li{
	height:30px;
    line-height:30px;
    background: rgba(0,0,0,.7);
    cursor: pointer;
    color: #FFF;
}
.liuyan-awardlist li.active{
    color: red;
}
.liuyan-awardlist li:hover{
    color: red;
}
/*右侧中奖记录*/
.liuyancj-right {
	position: relative;
    width: 453px;
    height: 611px;
    background-image: url("{:tomedia($pcconfig['defaultstyle']['rightbg'])}");
    background-size: 100% 100%;
}
.liuyan-luckerlist{
	position: relative;
    top: 127px;
    left: 18px;
    width: 418px;
    height: 466px;
	padding:0 10px;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box;
	overflow-x:hidden;
	overflow-y:auto;
}
.liuyan-luckerlist::-webkit-scrollbar {
    width: 6px;
}
.liuyan-luckerlist::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background-color: #d5c3fd;
    box-shadow: 0 0 10px 0 #d5c3fd;
}
.liuyan-luckerlist::-webkit-scrollbar-track {
    background: rgba(0,0,0,0.6);
    border-radius:6px;
}
.liuyan-luckerlist li{
	position:relative;
	width:100%;
	height: 83.6px;
    margin-top: 10px;
    border-radius: 10px;
	background-color:#fff;
	padding:0 10px;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box; 
}
.liuyan-luckerlist li .right-luckerdel {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    right: 0;
    margin: auto;
    line-height: 83.6px;
    background-color: rgba(0,0,0,.5);
    opacity: 0;
    -webkit-transition: opacity .3s;
    transition: opacity .3s;
    color: #fff;
	text-align:center;
    cursor: pointer;
}
.liuyan-luckerlist li .right-luckerdel:hover {
    opacity: 1;
}
.liuyan-lucker-avatar img{
	width:56px;
	height:56px;
	border-radius:50%;
}
.liuyan-lucker-info{
	width:calc( 100% - 64px);
	padding-left:15px;
	text-align:left;
	font-size:20px;
	color:#333;
}
.liuyan-lucker-username{
	height:33px;
	line-height:33px;
	overflow:hidden;
	font-weight:800;
}
.liuyan-lucker-username span{
	display:inline-block;
	margin-right:5px;
}
.liuyan-lucker-content{
	max-height:50px;
	line-height:25px;
	overflow:hidden;
}
.faceImg{
	width:25px;height:25px;
}
/*滚动3d效果*/
.liuyan-rolldmmain{
	width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
    -webkit-perspective: 1500px;
    left:0;
    top:0;
}
.liuyan-stopbtn{
	position: absolute;
    right: 80px;
    bottom: 80px;
	width:160px;
    height:53.6px;
    background-image: url("{:tomedia($pcconfig['defaultstyle']['startbtn'])}");
    background-size: 100% 100%;
	line-height:48px;
	font-size:22px;
	text-align: center;
	cursor: pointer;
	color: #fff;
	display: none;
}
.rolldmBox{
	width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}
.rolldmBox ul {
    position: absolute;
    width:100%;
    height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
    //border: 1px solid red;
}
.rolldmBox ul li.card{
	position: absolute;
	top: 50%;
    left: 50%;
    height: 70px;
	width:400px;
	padding:10px;
}
.rolldmBox .card-avatar{
	height:70px;
	width:70px;
}
.rolldmBox .card-avatar img {
    width: 52px;
    height: 52px;
	border-radius:10px;
}
.rolldmBox .card-content{
	width:260px;
    height: 70px;
	line-height:70px;
	white-space: nowrap;
	font-size:26px;
	font-weight:200;
	color:#fff;
	overflow:hidden;
}
/*中奖弹窗*/
.liuyan-output{
	width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
    left:0;
    top:0;
	background-color:rgba(0,0,0,0.5);
}
.liuyan-output .liuyan-output-main{
	position: relative;
    width: 1200px;
    height: 761px;
    background-image: url("{:tomedia($pcconfig['defaultstyle']['laybg'])}");
    background-size: 100% 100%;
}
.liuyan-output .liuyan-output-main ul{
	position: relative;
    top: 160px;
    left: 36px;
    width: 1122px;
    max-height: 583px;
	padding-bottom:8px;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box; 
	overflow:hidden;
	overflow-y:auto;
}
.liuyan-output-main li{
	height: 90px;
	width:calc( 50% - 12px);
	margin: 8px 6px 0 6px;
    border-radius: 10px;
	background-color:#fff;
	padding: 0 10px;
    border: 1px solid #00a8f7;
	box-sizing: border-box; 
    -webkit-box-sizing: border-box; 
    -moz-box-sizing: border-box; 
}
.liuyan-output-main .liuyan-output-avatar img{
	width:56px;
	height:56px;
	border-radius:50%;
}
.liuyan-output-info{
	width:calc( 100% - 64px);
	padding-left:15px;
	text-align:left;
	font-size:20px;
	color:#333;
}
.liuyan-output-username{
	height:36px;
	line-height:36px;
	overflow:hidden;
	font-weight:800;
}
.liuyan-output-username span{
	display:inline-block;
	margin-right:5px;
}
.liuyan-output-content{
	max-height:54px;
	line-height:27px;
	overflow:hidden;
}
.faceImg{
	width:25px;height:25px;
}
.liuyan-output-close{
	position: absolute;
    top: 70px;
    right: -70px;
    font-size: 50px;
    color: #fff;
    cursor: pointer;
}
</style>
<link rel="stylesheet" href="/static/css/screencss/screen-prize.css">
<link rel="stylesheet" href="/static/css/screencss/screenliuyancj-prize.css">
{if !empty($pcconfig['cjingmusic'])}
<audio id="cjingmusic" src="{:tomedia($pcconfig['cjingmusic'])}" loop preload="preload" style="display:none"></audio>
{/if}
{if !empty($pcconfig['cjendmusic'])}
<audio id="cjendmusic" src="{:tomedia($pcconfig['cjendmusic'])}" preload="preload" style="display:none"></audio>
{/if}
<section class="normal-box liuyancj-mainbox">
  <div class="emptybox zam-app-flex-ajCenter display-none">
	<img src="/{:SIMGURL}common/empty.png">
	<p style="padding:20px;">请到后台添加奖品</p>
  </div>
  <section class="liuyan-welcomeBox zam-app-flex zam-app-alignCenter zam-app-justifyspacearound display-none">
	<section class="liuyancj-center">
	    <div class="liuyan-joinnum{if $pcconfig['showjoin']=='2'} display-none{/if}">奖池总人数:<span>0</span></div>
		<div class="liuyan-messageBox"><ul class="liuyan-messagelist"></ul></div>
		<div class="liuyan-setting zam-app-flex zam-app-alignCenter zam-app-justifyspacearound">
			<div class="liuyan-startbtn">开始抽奖</div>
		</div>
	</section>
	<section class="liuyan-prize-host" aria-label="奖品设置"></section>
	<section class="liuyancj-right">
		<ul class="liuyan-luckerlist"></ul>
	</section>
  </section>
</section>
<!--滚动区域-->
<section class="liuyan-rolldmmain display-none">
	<section class="rolldmBox"><ul></ul></section>
	<div class="liuyan-stopbtn">
		停止抽奖
	</div>
</section>
<!--中奖弹窗-->
<section class="liuyan-output zam-app-flex-ajCenter2 display-none">
	<section class="liuyan-output-main">
		<ul class="zam-app-flex zam-app-flex-wrap"></ul>
		<span class="liuyan-output-close mxc-unie631"></span>
	</section>
</section>
<script id="msg-tpl" type="html/javascript">
<li class="zam-app-flex">
	<div class="liuyan-message-avatar zam-app-flex-ajCenter2">
		<img src="{{ avatar }}">
	</div>
	<div class="liuyan-message-info">
		<div class="liuyan-message-username">{{ nickname }}</div>
		<div class="liuyan-message-content">{{# content }}</div>
	</div>
</li>
</script>
<script id="roll-tpl" type="html/javascript">
<li class="card zam-app-flex {{ if needreplace }}card-needreplace{{ /if }}">
	<div class="card-avatar zam-app-flex-ajCenter2"><img src="{{ avatar }}"></div>
	<div class="card-content zam-app-flex zam-app-alignCenter">{{# content }}</div>
</li>
</script>
<script id="layuser-tpl" type="html/javascript">
<li class="zam-app-flex">
	<div class="liuyan-output-avatar zam-app-flex-ajCenter2">
		<img src="{{ avatar }}">
	</div>
	<div class="liuyan-output-info">
		<div class="liuyan-output-username">{{# nickname }}</div>
		<div class="liuyan-output-content">{{# content }}</div>
	</div>
</li>
</script>
<script id="rightlucker-tpl" type="html/javascript">
<li class="zam-app-flex">
	<div class="liuyan-lucker-avatar zam-app-flex-ajCenter2">
		<img src="{{ avatar }}">
	</div>
	<div class="liuyan-lucker-info">
		<div class="liuyan-lucker-username">{{# nickname }}</div>
		<div class="liuyan-lucker-content">{{# content }}</div>
	</div>
	<div class="right-luckerdel" data-id="{{ luckerid }}"><i class="zam-icon-error2"></i></div>
</li>
</script>
<script>
var defaultimg = "{:tomedia($pcconfig['defaultimg'])}";
var lotteryshow = {};
var luckerids = [],rotatesecond = parseInt("{if empty($pcconfig['defaultstyle']['rotatesecond'])}20{else}{$pcconfig['defaultstyle']['rotatesecond']}{/if}");
require(['screenliuyancj'],function (screenliuyancj) {
	screenliuyancj.init();
});
</script>
