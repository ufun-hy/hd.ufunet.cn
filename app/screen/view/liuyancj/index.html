{include file='common/header' /}
<link rel="stylesheet" href="/static/css/screencss/screen-prize.css">

<audio id="cjingmusic" src="{:tomedia($pcconfig['cjingmusic'])}" loop preload="preload" style="display:none"></audio>

<audio id="cjendmusic" src="{:tomedia($pcconfig['cjendmusic'])}" preload="preload" style="display:none"></audio>

<div class="liuyancj-page">

    <section class="liuyan-danmaku-host" aria-label="现场留言"></section>
    <div class="emptybox zam-app-flex-ajCenter display-none">
      <p>请到后台添加奖品</p>

  </section>
</div>
<script>
$('.liuyancj-page').closest('.main-box').addClass('liuyancj-page-shell');
require.config({ paths: {
    screenliuyancj: 'screenjs/screenliuyancj.js?v=20260926-winner-record-redesign-1',
    'screenjs/screen-stage-ui': 'screenjs/screen-stage-ui.js?v=20260926-winner-record-redesign-2',
    fulldm: 'screenjs/fulldm.js?v=20260925-motion-followup-1',
    'screenjs/screen-message-danmaku': 'screenjs/screen-message-danmaku.js?v=20260926-motion-steady-1'
} });
require(['screenliuyancj'], function (screenliuyancj) { screenliuyancj.init(); });
</script>
