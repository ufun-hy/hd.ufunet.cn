<div class="kissroles">
    <div class="role-item role-left">
        <div class="role-item-image"></div>
    </div>
    <div class="role-item role-right">
        <div class="role-item-image"></div>
    </div>
</div>
<style>
.kissroles {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
.kissroles .role-item {
    width: 274px;
    height: 292px;
    position: absolute;
    top: 0;
    -webkit-transition: all 30s linear;
    transition: all 30s linear
}
.kissroles .role-item.role-left {
    left: 0
}
.kissroles .role-item.role-left .role-item-image {
    background-position: 0  0;
}
.kissroles .role-item.role-right {
    right: 0
}
.kissroles .role-item.role-right .role-item-image {
    background-position: -1644px -292px;
}
.kissroles .role-item.aniupdown {
    -webkit-animation: aniupdown 3s linear infinite;
    animation: aniupdown 3s linear infinite
}
@keyframes aniupdown {
    0%,
    40%,
    80%,
    to {
        -webkit-transform: translateZ(0);
        transform: translateZ(0)
    }
    20% {
        -webkit-transform: translate3d(0, -5px, 0);
        transform: translate3d(0, -5px, 0)
    }
    60% {
        -webkit-transform: translate3d(0, 5px, 0);
        transform: translate3d(0, 5px, 0)
    }
}
.kissroles .role-item .role-item-image {
    height: 100%;
    width: 100%;
    background-image: url(/static/1920.png);
    background-repeat: no-repeat;
}
.kissroles .role-item .role-item-image.anirolechange {
    -webkit-animation: anirolechange 1s steps(7) infinite;
    animation: anirolechange 1s steps(7) infinite
}
@keyframes anirolechange {
    0% {
        background-position-x: 0;
    }
    to {
        background-position-x: -1920px;
    }
}
</style>
<script>
    $(function(){
        //$(".kissroles .role-item").addClass('aniupdown');
        $(".kissroles .role-item .role-item-image").addClass('anirolechange');
        var rolew = $('.kissroles .role-item').width();
        $('.role-right').css({
            "right":`calc(50% - ${rolew}px)`,
            "transition-duration":'20s',
        }).on("webkitTransitionEnd transitionend", function() {
            $(this).removeClass('aniupdown');
            $(this).find('.role-item-image').removeClass('anirolechange');
        });
        $('.role-left').css({
            "left":`calc(50% - ${rolew}px)`,
            "transition-duration":'20s',
        }).on("webkitTransitionEnd transitionend", function() {
            $(this).removeClass('aniupdown');
            $(this).find('.role-item-image').removeClass('anirolechange');
        });
        
    })
</script>
