<div class="kissroles display-none">
    <div class="role-item role-left">
        <div class="role-item-image"></div>
    </div>
    <div class="role-item role-right">
        <div class="role-item-image"></div>
    </div>
</div>
<style>
.kissroles {
    height: 100%;
    width: 100%;
    position: absolute;
    top: 0;
    left: 0;
}
.kissroles .role-item {
    width: 274px;
    height: 292px;
    position: absolute;
    top: 0;
    -webkit-transition: all 30s linear;
    transition: all 30s linear
}
.kissroles .role-item.role-left {
    left: 0
}
.kissroles .role-item.role-left .role-item-image {

.kissroles .role-item.role-right {
    right: 0
}
.kissroles .role-item.role-right .role-item-image {
    background-position: -1644px -292px;
}

    height: 100%;

    background-image: url(/static/images/screen/dgshake/kissrole.png);
    background-repeat: no-repeat;

.kissroles .role-item .role-item-image.anirolechange {
    -webkit-animation: anirolechange 1s steps(7) infinite;
    animation: anirolechange 1s steps(7) infinite
}

    0% {
        background-position-x: 0;
    }
    to {

</style>
