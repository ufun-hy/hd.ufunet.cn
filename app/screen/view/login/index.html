{include file='common/header' /}
<style> 
	.headerTitle{opacity: 0}
	input, textarea, button {
		font: inherit;
		margin: 0;
		padding: 0;
		color: inherit;
		border-style: none;
		outline-style: none;
		background: transparent;
		-webkit-appearance: none;
		-moz-appearance: none;
		appearance: none;
	}
	.login-box{
		position:fixed;
		top:0;
		left:0;
		height:100%;
		width:100%;
	}
	.login-form{
		position:relative;
		width: 360px;
		padding:30px;
		margin:0 auto;
		background-color:#fff;
		border-radius:8px;
		z-index:2;
	}
	.login-form-title {
		text-align:center;
		font-size: 18px;
		font-weight: 400;
		line-height: 1;
		margin-bottom: 25px;
		color: #333;
	}
	.form-group {
		position: relative;
		display: block;
		margin-bottom: 10px;
	}
	.form-group:last-of-type {
		margin-bottom: 20px;
	}
	.form-group-icon {
		line-height: 50px;
		position: absolute;
		top: 0;
		left: 0;
		width: 48px;
		height: 50px;
		margin: auto;
		text-align: center;
	}
	.form-group-icon i{
		font-size:20px;
		color:#dfdfdf;
	}
	.form-group-input {
		font-size: 14px;
		line-height: normal;
		width: calc(100% - 48px);
		height: 50px;
		padding-left: 48px;
		color: #4c5265;
		border-radius: 4px;
		background: #f6f6f6;
		box-shadow: inset 0 0 0 1px #f6f6f6, 0 0 0 0 rgba(255,255,255,0);
	}
	.form-group-input::-webkit-input-placeholder {
		opacity:1;
		color:#b3b4b9
	}
	.form-group-input::-moz-placeholder {
		opacity:1;
		color:#b3b4b9
	}
	.form-group-input:-ms-input-placeholder {
		opacity:1;
		color:#b3b4b9
	}
	.form-group-input::placeholder {
		opacity:1;
		color:#b3b4b9
	}
	.form-group-input:focus {
		background:#fff;
		box-shadow:inset 0 0 0 1px #248CF3,0 0 0 2px rgba(36,140,243,0.2)
	}
	.form-group-input:-webkit-autofill {
		-webkit-box-shadow:inset 0 0 0 30px #f6f6f6;
		-webkit-text-fill-color:#4c5265 !important
	}
	.form-group-input:-webkit-autofill:focus {
		-webkit-box-shadow:inset 0 0 0 1px #248CF3,inset 0 0 0 30px #fff,0 0 0 2px rgba(36,140,243,0.2)
	}
	.login-btn-primary {
		transition: background .25s ease-in-out;
		color: #fff;
		background: #258ff8;
		cursor:pointer;
	}
	.login-btn-primary:hover, .login-btn-primary:focus {
		background: #3999f9;
	}
	.login-submit {
		font-size: 14px;
		width: 100%;
		height: 48px;
		margin-bottom: 10px;
		letter-spacing: 1px;
		color: #fff;
		border-radius:8px;
	
</style>
<div class="login-box zam-app-flex-alignCenter">
<div class="login-form">
	<h2 class="login-form-title">大屏登录</h2>
	<label class="form-group">
		<div class="form-group-icon">
			<i class="mxc-lock"></i>
		</div>
		<input type="password" class="form-group-input password" name="password" placeholder="请输入大屏密码"  autocomplete="off" >
	</label>
	<button class="login-btn-primary login-submit">登录</button>
</div>
</div>
<script type="text/javascript">
require(['screencore','layerBox','keyboard'],function (screencore,layerBox,keyboardJS) {
	$(".login-submit").on('click',function(){
		var password = $(".password").val();
		if(password=='') return layerBox.showMsg('请输入密码');
		screencore.ajaxSubmit("{:goscreen('login/index')}",{password:password},'登录中....').then(function(data){
			if(data.code==0){
				layerBox.showMsg('登录成功');
				setTimeout(function(){
					window.location.href = "{:$fromurl}";
				},12e2);
			}else{
				layerBox.showMsg(data.msg);
			}
		}, function(){
			layerBox.showMsg('网络太差，请稍后重试');
		});
	});
	keyboardJS.bind('space', function(e) {
		$(".login-submit").trigger('click');
	});
});
</script>
{include file='common/footer' /}
