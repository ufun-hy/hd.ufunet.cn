{include file="common/header" /}
<style>
.threedb-mainbox {
	width:100%;
	height:100%;
	padding:0;
}
.signthreed-wall-block{
    position: absolute;
	left:0;
    top:0;
	width: 100%;
    height: 100%;
    overflow: hidden;
	user-select: none;
	perspective: 1500px;
	-webkit-perspective: 1500px;
	pointer-events: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
	
}
.signthreed-wall-block .three3d{
	width: 100%;
    height: 100%;
	transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}
.signthreed-wall-block .three3d .box3d {
    position: absolute;
	left: 0;
	top: 0;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
}
.three3d .logobox {
    position: absolute;
    width: 100%;
    height: 100%;
    perspective: 2000px;
	-webkit-perspective: 2000px;
    transform-style: preserve-3d;
	-webkit-transform-style: preserve-3d;
}
.three3d .logobox .logoImg{max-width:290px;}

.three3d ul {
    position: absolute;
    width:100%;
    height: 100%;
    transform-style: preserve-3d;
    -webkit-transform-style: preserve-3d;
}
.three3d .card {
    position: absolute;
    width: 50px;
    height: 50px;
    margin: -25px 0 0 -25px;
    top: 50%;
    left: 50%;
    display: none;
}

.three3d [class^="text"] li img{border-radius:1px!important;}
.three3d [class^="logo"] li img{border-radius:1px!important;}
{if !isset($pcconfig['djsendlogo']['shapestable']) || $pcconfig['djsendlogo']['shapestable']=='2'}
.three3d .logoend li{
	width:{$pcconfig['djsendlogo']['jd']}px!important;
	height:{$pcconfig['djsendlogo']['jd']}px!important;
	margin:0!important;
	background-color:none!important;
	border:0px!important;
	border-radius:0px!important;
}
{else /}
.three3d .logoend{
	display: flex;
	justify-content: center;
	align-items: center;
}
.three3d .logoend li{
	position: relative!important;
	top: 0!important;
	left: 0!important;
	height: 100%;
	width: 100%;
	margin: 0!important;
	background: none!important;
	border: 0!important;
}
.three3d .logoend li img{
	height: auto;
	width: auto;
}
{/if}
{volist name="pcconfig.shapes" id="shape"}
	{if $shape['shape']=='logo'||$shape['shape']=='text'}
		{if $shape['shape']=='logo'}
			{if !isset($shape['shapestable']) || $shape['shapestable']=='2'}
				.three3d .{$shape['shapename']} li{
					width:{$shape['jd']}px!important;
					height:{$shape['jd']}px!important;
					margin:0!important;
					background-color:none!important;
					border:0px!important;
					border-radius:0px!important;
				}
			{else /}
				.three3d .{$shape['shapename']}{
					display: flex;
					justify-content: center;
					align-items: center;
				}
				.three3d .{$shape['shapename']} li{
					position: relative!important;
					top: 0!important;
					left: 0!important;
					height: 100%;
					width: 100%;
					margin: 0!important;
					background: none!important;
					border: 0!important;
				}
				.three3d .{$shape['shapename']} li img{
					height: auto;
					width: auto;
				}
			{/if}
		{else}
			.three3d .{$shape['shapename']} li{
				width:{$shape['jd']}px!important;
				height:{$shape['jd']}px!important;
				margin:0!important;
				background-color:none!important;
				border:0px!important;
				border-radius:0px!important;
			}
		{/if}
	{/if}
{/volist}

.three3d [class^="logo"] li.dot8 {
    height: 47px !important;
    width: 47px !important;
}

.three3d [class^="logo"] li.dot7 {
    height: 41px !important;
    width: 41px !important;
}

.three3d [class^="logo"] li.dot6 {
    height: 35px !important;
    width: 35px !important;
}

.three3d [class^="logo"] li.dot5 {
    height: 29px !important;
    width: 29px !important;
}

.three3d [class^="logo"] li.dot4 {
    height: 23px !important;
    width: 23px !important;
}

.three3d [class^="logo"] li.dot3 {
    height: 17px !important;
    width: 17px !important;
}

.three3d [class^="logo"] li.dot2 {
    height: 11px !important;
    width: 11px !important;
}

.three3d [class^="logo"] li.dot1 {
    height: 5px !important;
    width: 5px !important;
}
.three3d [class^="text"] li.dot8 {
    height: 47px !important;
    width: 47px !important;
}

.three3d [class^="text"] li.dot7 {
    height: 41px !important;
    width: 41px !important;
}

.three3d [class^="text"] li.dot6 {
    height: 35px !important;
    width: 35px !important;
}

.three3d [class^="text"] li.dot5 {
    height: 29px !important;
    width: 29px !important;
}

.three3d [class^="text"] li.dot4 {
    height: 23px !important;
    width: 23px !important;
}

.three3d [class^="text"] li.dot3 {
    height: 17px !important;
    width: 17px !important;
}

.three3d [class^="text"] li.dot2 {
    height: 11px !important;
    width: 11px !important;
}
.three3d [class^="text"] li.dot1 {
    height: 5.5px !important;
    width: 5.5px !important;
    margin: 0 !important;
    background-color: none !important;
    border: 0px !important;
    border-radius: 0px !important;
}
.three3d .activate {
    display: -webkit-box;
    display: -moz-box;
    display: -ms-flexbox;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
}

.three3d ul li{
	background-color: rgba(255,255,255,0.6);
    border:0.2px solid rgba(255,255,255,0.7);
    border-radius:5px;
	{if isset($pcconfig['isppqd']) && $pcconfig['isppqd'] == '1'}
	border:0;
	background:none;
	{/if}
}
.three3d ul.cube li{
	background-color: rgba(255,255,255,0.1);
	{if isset($pcconfig['isppqd']) && $pcconfig['isppqd'] == '1'}
	background:none;
	{/if}
}
.three3d ul li img {
    width: 100%;
    height:100%;
	border-radius:5px;
}
{if $pcconfig['showsignnum']=='2'}
.joinPeople{display: none}
{/if} 
.threedb-mainbox .new-sign{width:300px}
.threedb-mainbox .new-sign .avatar{width:300px;height:300px;{if !isset($pcconfig['isppqd']) || $pcconfig['isppqd'] == '2'}border-radius:20px 20px 0 0;-webkit-filter:brightness(1.2);filter:brightness(1.2);box-shadow: rgba(255, 255, 255, 0.8) 0px 0px 30px 0px;{else /}border-radius:10px;{/if}}
.threedb-mainbox .new-sign .nickname{max-height:116px;min-height:60px;overflow:hidden;padding:10px;background-color:rgba(0,0,0,0.82);border-radius:0 0 20px 20px;box-shadow: rgba(255, 255, 255, 0.8) 0px 0px 30px 10px;margin:0;color:#fff;{if isset($pcconfig['isppqd']) && $pcconfig['isppqd'] == '1'}display:none{/if}}
.threedb-mainbox .new-sign .nickname div{width:280px;text-align:center;font-size:40px;line-height:60px;word-break:break-all;}
.threedb-mainbox .new-sign .nickname span{
	display: block;
	width: 280px;
	font-weight: 500;
	word-break: break-all;
    white-space: nowrap;
    text-align: center;
    font-size:40px;
	overflow: hidden;
	text-overflow: ellipsis;
}
#threedCanvas{
	position: absolute;
	top:0;
	left:0;
	display: none;
}
</style>
<audio id="countaudio" src="/{:SIMGURL}threed/djs.mp3"  preload="preload"  style="display:none"></audio>
{if isset($pcconfig['djsendlogo']['playendaudio']) && $pcconfig['djsendlogo']['playendaudio']=='1' && isset($pcconfig['djsendlogo']['endaudio']) && !empty($pcconfig['djsendlogo']['endaudio'])}
<audio id="endaudio" src="{:tomedia($pcconfig['djsendlogo']['endaudio'])}"  preload="preload"  style="display:none"></audio>
{/if}
<canvas id="threedCanvas" width="300" height="100"></canvas>
<section class="threedb-mainbox normal-box zam-app-flex-ajCenter2">
<div class="signthreed-wall-block" >
	<div class="three3d zam-app-flex-ajCenter2">
		<div class="box3d">
			<ul></ul>
		</div>
	</div>
</div>
</section>
<script type="text/html" id="sign-tpl">
	<div id="{{ id }}" class="new-sign zam-app-flex-ajCenter">
		<img src="{{ avatar }}" class="avatar" />
		<div class="nickname">{{# nickname }}</div>
	</div>
</script>
<script>
var Threeconfig = {
	djsOn:parseInt("{$pcconfig['opendjs']}")||0,
	djsCount:parseInt("{$pcconfig['djstime']}")||0,
	djsEndLogo:{:json_encode($pcconfig['djsendlogo'])},
	defaultAvatar:"{:tomedia($pcconfig['defaultimg'])}",
	shapes:{:json_encode($pcconfig['shapes'])},
	animations:{:json_encode($pcconfig['showshape'])},
	transformShape:['wall','sphere','wall2','cylinder','cube','cube2','screw','tours'],
	ajaxtime:3e3,
	loopTime:2e3,
	avatartype:parseInt("{$pcconfig['repeattype']}"),
	logoUrl:"{$pcconfig['logoimg']}",
	allowpop:"{$pcconfig['allowpop']??1}",
};
require(['screenthreed','screencore'],function (screenthreed,screencore) {
	screenthreed.init();
});
</script>
{include file="common/footer" /}
