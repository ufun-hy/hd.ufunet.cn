{include file='common/header' /}
<style type="text/css">
.vote-container{
	position: absolute;
    top: 0px;
	left:0;
	width: 100%;
    height: 100%;
    color: #fff;
    flex-direction: column;
}
.vote-lists{
	width: 800px;
	height:300px;
}
.vote-lists .vote-item{
    position: relative;
    height: 100%;
    box-shadow: 0px 0px 0px 0px rgba(0,0,0,0.32);
    transform: all 1s linear;
}
.vote-lists .vote-item .votescore{
    position: absolute;
    top: -50px;
    left: 50%;
    transform: translate(-50%,0);
    font-size: 24px;
}
.vote-lists .vote-item .votescore span{
    display: inline-block;
}
.vote-lists .vote-item .votescore .votenum{
    margin-right: 5px;
}
.vote-lists .vote-item:nth-child(1){
    width: 50%;
    background-color: #d44b35;
}
.vote-lists .vote-item:nth-child(2){
    width: 50%;
    background-color: #33a6d4;
}
.vote-lists .vote-item img{
    width: 120px;
    height: 120px;
}
.vote-lists .logo{
    position: absolute;
    left: -66px;
    height:300px;
    width: 132px;
    background-image: url(/static/images/screen/vote/dk.jpg);
    background-size: cover;
}

/*底部轮次*/
.vote-rounds{
    position: absolute;
    bottom: 100px;
	text-align:center;
}
.vote-rounds a{
	display: inline-block;
    padding: 5px 10px;
    border: 1px solid rgba(255, 255, 255, 0.45);
    font-size: 14px;
    color: rgba(255, 255, 255, 0.65);
    border-radius: 10px;
    margin-right: 10px;
}
.vote-rounds a:last-child{margin: 0;}
.vote-rounds a.active,.vote-rounds a.active:hover {
    border: 1px solid rgba(255, 255, 255, 0.7);
    background-color: rgb(255, 255, 255);
    color: #000;
}
.vote-rounds a:hover {
    border: 1px solid rgba(255, 255, 255, 0.7);
    background-color: rgba(255, 255, 255,0.5);
    color: #000;
}
</style>
<div class="vote-container zam-app-flex-ajCenter2">
	<div class="vote-lists zam-app-flex-ajCenter2">
		{foreach $rotate['items'] as $key=>$item}
        {if $key < 2}
		<div class="vote-item zam-app-flex-ajCenter2 vote{$item['id']}">
            <div class="votescore"><span class="votenum">0</span></span><span>票</span></div>
            <img src="{:tomedia($item['voteimg'])}" />
            {if $key == 1}
                <div class="logo"></div>
            {/if}
		</div>
        {/if}
		{/foreach}
	</div>
    <section class="vote-rounds">
        {foreach $rotate['rotates'] as $rkey=>$ritem}
            <a href="javascript:;" data-rotateid="{$ritem['id']}" {if $ritem['active']=='1'}class="active"{/if}>第{$rkey + 1}轮</a> 
        {/foreach}
    </section>
</div>
<script>
require(['screencore','template','keyboard'],function(screencore,template,keyboardJS){
	function ajaxvoteuser(){
		screencore.ajaxSubmit("/screen/vote/dzajaxvotedata",{}).then(function(json){
			if(json.code==0){
                var items = json.msg.items??[];
				$.each(items,function(i,v){
					if($(".vote"+v.id).length > 0){
						$(".vote"+v.id).find('.votenum').text(v.votenums);
					}
				});
                if(items.length > 1){
                    var item1 = items[0]??{votenums:0,id:0,voteper:'50%'};
                    var item1per = parseFloat(item1.voteper);
                    var item2 = items[1]??{votenums:0,id:0,voteper:'50%'};
                    var item2per = parseFloat(item2.voteper);
                    if(item1per == item2per){
                        $(".vote-lists .vote-item").css("width",'50%');
                    }else{
                        if(item1per < 32){
                            item1per = 32;
                        }
                        item2per = 100 - item1per;
                        if(item2per < 32){
                            item2per = 32;
                            item1per = 68;
                        }
                        $(".vote"+item1.id).css("width",`${item1per}%`);
                        $(".vote"+item2.id).css("width",`${item2per}%`);
                    }
                }
                
			}
		});
	}
    ajaxvoteuser();
	setInterval(function(){
		ajaxvoteuser();
	},3e3);
    //切换上下轮次
    keyboardJS.bind('right', function(e) {
        var nextDom = $('.vote-rounds .active').next();
        if(nextDom.length<=0){
            $('.vote-rounds a:first').trigger('click');
        }else{
            nextDom.trigger('click');
        }
    });
    keyboardJS.bind('left', function(e) {
        var prevDom = $('.vote-rounds .active').prev();
        if(prevDom.length<=0){
            $('.vote-rounds a:last').trigger('click');
        }else{
            prevDom.trigger('click');
        }
    });
    $(".vote-rounds a").click(function(){
        var rotateid = $(this).attr('data-rotateid')||'';
        if(!rotateid){
            return;
        }
        screencore.ajaxSubmit("/screen/vote/changerotate",{rotateid:rotateid}).then(function(json){
			 window.location.reload();
        })
    })
});
</script>
{include file='common/footer' /}
