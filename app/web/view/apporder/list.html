{include file='$Wpath/common/header'}
<div class="alert alert-success" role="alert">
    <i class="mdi mdi-bell-ring"></i> 系统前台订单即为使用系统类支付模板，活动用户在霸屏等微信端产生的订单，此类订单支付成功后将统计到后台用户个人中心系统收入账号，后台用户需要到个人中心发起提现。
</div>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">活动主题</span>
        <input type="text" class="form-control" value="" id="keyword" placeholder="请输入活动主题" style="width: 140px;">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">支付方式</span>
          <select id="paytype" class="form-control js_select2">
            {foreach $paytypes as $pkey=>$pval } 
            <option value="{$pkey}">{$pval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">状态</span>
          <select id="orderstatus" class="form-control js_select2">
            {foreach $orderstatuss as $okey=>$oval } 
            <option value="{$okey}">{$oval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">来源</span>
          <select id="fromtype" class="form-control js_select2">
            {foreach $typelists as $tkey=>$tval } 
            <option value="{$tkey}">{$tval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">商户订单号</span>
        <input type="text" class="form-control" value="" id="tradeid" placeholder="请输入商户订单号" style="width: 80px;">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">昵称/姓名</span>
        <input type="text" class="form-control" value="" id="username" placeholder="请输入昵称或者表单姓名" style="width: 100px;">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    <a class="btn btn-warning btn-sm btn-exportall hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 全部导出</a>
</div>
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
	tableId:'#listtable',
	url:"{:goweb('apporder/listsys')}",
	columnoperate:{
        btns:{
            data:{
                title:"发放明细",
                icon:"mdi-account-card-details",
                except:{
                    'more':[
                        {'field':'status','only':'1'},
                        {'field':'fromstype','only':'3'},
                    ],
                }
            },
            refund:{title:"退款",icon:"mdi-gavel",'except':{'only':'1'}},
        },
	    func:{
            data:function(value, row, index){
                var confirmobj = jconfirmBox.ajaxconfirm("发放明细","{:goweb('apporder/hborderdetail')}",{orderid:row.id,hdid:row.huodong_id,msgid:row.record_id},'html','col-lg-8 col-lg-offset-2',function(e){},false,'2');
            },
    	    refund:function(value, row, index){
            	jconfirmBox.confirm('温馨提示','您确定要退款么？',function(){
        			webcore.ajaxSubmit("{:goweb('apporder/refundsys')}",{orderid:row.id},'处理中..').then(function(json){
        				if(json.code==0){
        				    webtable.refresh();
        				    zamnotice.showTips('success','退款发起成功，请稍后查看退款结果');
        			    }else{
        			        zamnotice.showTips('error',json.msg);
        			    }
        			}, function(json){
        				zamnotice.showTips('error','网络差。操作失败');
        			});
            	});
    	    },
	    }
	},
	columns:[{
			checkbox: true,
		}, 
		{
			field: 'id',
			title: 'ID',
			align: 'center',
            width:'6%',
			visible: false
		}, {
            field: 'hdtitle',
            title: '活动',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                if(row.huodong_id=='0') return '-';
                var html = "<div><span>"+(value==null?"已删除":value)+"</span></div><div class='m-t-5'><span>id:"+row.huodong_id+"</span></div>";
                return html;
            },
        }, {
            field: 'userinfo',
            title: '用户',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                var html = '<div class="zam-flex-column-center"><img class="avatarImg m-b-10" src="'+(value.wxheadimg?value.wxheadimg:value.avatar)+'" /><span>'+(value.wxname?value.wxname:value.nickname)+'</span></div>';
                return html;
            },
        }, {
            field: 'statusname',
            title: '状态',
            align:'center',
            formatter: function (value, row, index) {
                var html = value;
                return html;
            },
             width:'5%',
        },  {
            field: 'paytypename',
            title: '支付方式',
            align: 'center',
        }, {
            field: 'tradeid',
            title: '订单号',
            align:'center',
        }, {
            field: 'payfee',
            title: '支付金额(元)',
            align:'center',
            formatter: function (value, row, index) {
                var html = value;
                if(row.fromtype=='baping' && (row.fromstype=='2' || row.fromstype=='4')){
                    html += "<div><span class='m-t-5 m-r-5'>艺人分成:</span><span class='text-danger'>"+row.splitfee/100+"元</span></div>";
                }
                if(row.fromtype=='baping' && row.fromstype=='3'){
                    html += "<div><span class='m-t-5 m-r-5'>手续费:</span><span class='text-danger'>"+row.poundage/100+"元</span></div>";
                }
                return html;
            },
        },  {
          field: 'fromtypename',
          title: '来源',
          align: 'center',
        },  {
          field: 'payinfo',
          title: '订单详情',
          align: 'center',
          formatter: function (value, row, index) {
                    var html = '<div>'+value.project+'</div>';
                    if(row.fromtype=='hdpayjoin'){
                        html += '<div>'+value.day+'天</div>'
                    }
                    if(row.paytype=='1' && row.status=='4'){
                        html += "<div>退款单号:"+row.refund_id+"</div>";
                    }
                    return html;
                },
        },  {
                field: 'create_time',
                title: '下单时间',
                align: 'center',
            }
	],
	searchParamas:[{'type':'1','id':'keyword'},{'type':'2','id':'paytype'},{'type':'2','id':'orderstatus'},{'type':'2','id':'fromtype'},{'type':'1','id':'username'},{'type':'1','id':'tradeid'}],
	toolbar:{
	    del:function(ajaxurl){
          var getSelects = webtable.getSelections();
          if(!getSelects.length){
              return zamnotice.showTips('info','请先选择您要操作的数据');
          }
          jconfirmBox.confirm('温馨提示','您确定要删除选中的数据么？',function(){
            webcore.ajaxSubmit(ajaxurl,{attid:getSelects},'处理中..').then(function(json){
              if(json.code==0){
                webtable.refresh();
                zamnotice.showTips('success','删除成功');
              }else{
                zamnotice.showTips('error',json.msg);
              }
            }, function(json){
              zamnotice.showTips('error','网络差,操作失败');
            });
          });
	    },
	},
};
webtable.init(initConfig);
$('.zam-inline-searchbar select').change(function(e) {
  webtable.refresh();
});
});
</script>
{include file='$Wpath/common/footer'}
