{include file='$Wpath/common/header'}
<div class="alert alert-danger">
    注意:如果红包模板内发放类型选了商家转账到零钱需要自己点击核实按钮确定是否到账
</div>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">提现状态</span>
          <select id="txstatus" class="form-control">
            {foreach $txstatus as $tk => $tv } 
            <option value="{$tk}">{$tv}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">微信昵称</span>
        <input type="text" class="form-control" value="" id="nickname" placeholder="请输入微信提现昵称">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">微信openid</span>
        <input type="text" class="form-control" value="" id="openid" placeholder="请输入微信提现openid">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    <a class="btn btn-warning btn-sm btn-exportall hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 全部导出</a>
</div>
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
	tableId:'#listtable',
	url:"{:goweb('systx/wx')}",
	columnoperate:{
        btns:{
            shenhe:{title:"打款",icon:"mdi-gavel",'except':{'only':'2'}},
            refund:{title:"拒绝",'except':{'only':'2'}},
            edit:{
                title:"核实到账",
                icon:"mdi-gavel",
                except:{
                    'more':[
                        {'field':'status','only':'1'},
                        {'field':'ischecked','only':'2'}
                    ],
                }
            },
        },
        func:{
            shenhe:function(value, row, index){
                var tips = '此操作不可撤回，您确定要以发放微信红包的形式打款么？',loadtxt = '正在打款，请等待发放结果后再去进行其他操作';
                jconfirmBox.confirm('温馨提示',tips,function(){
                    webcore.ajaxSubmit("{:goweb('systx/wxshenhe')}",{txid:row.id},loadtxt).then(function(json){
                        if(json.code!=0){
                            zamnotice.showTips('error',json.msg);
                        }else{
                            webtable.refresh();
                            zamnotice.showTips('success','操作成功');
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                    });
                });
            },
            refund:function(value, row, index){
                var confirmobj = jconfirmBox.confirm('您确定要拒绝此提现申请么？',webcore.tpl($("#reason-tpl"),{}),function(e){
                  var reason = e.$content.find(".reason").val();
                  if(reason=='') return zamnotice.showTips('error','请填写理由');
                  webcore.ajaxSubmit("{:goweb('systx/wxrefuse')}",{txid:row.id,reason:reason},'正在处理..').then(function(json){
                       if(json.code==0){
                            confirmobj.close();                        
                            webtable.refresh();
                            zamnotice.showTips('success','操作成功');
                       }else{
                            zamnotice.showTips('error',json.msg);
                       }
                  })
                },false,false,true,[{'hidden':false,'txt':'确定拒绝'},{'hidden':false,'txt':'取消'}]);
            },
            edit:function(value, row, index){
                  webcore.ajaxSubmit("{:goweb('systx/checkdz')}",{type:'2',txid:row.id},'正在核实并处理..').then(function(json){
                       if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success',json.msg);
                       }else{
                            zamnotice.showTips('error',json.msg);
                       }
                  })
            },
        }
    },
	columns:[{
			checkbox: true,
		}, 
		{
			field: 'id',
			title: 'id',
			align: 'center',
            width:'6%',
			visible: false
		}, {
            field: 'hdtitle',
            title: '活动',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                if(row.huodong_id=='0') return '-';
                var html = "<div><span>"+(value==null?"已删除":value)+"</span></div><div class='m-t-5'><span>id:"+row.huodong_id+"</span></div>";
                return html;
            },
        }, {
            field: 'issys',
            title: '打款模板',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                var html = value=='1'?'系统模板':'用户模板';
                html += '(id:'+row.tplid+')';
                return html;
            },
        }, {
            field: 'userinfo',
            title: '提现用户',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                if(row.huodong_id=='0') return '-';
                var html = "<div><span>"+value.wxname+"</span></div><div class='m-t-5'><span>id:"+value.openid+"</span></div>";
                return html;
            },
        }, {
            field: 'statushtml',
            title: '提现状态',
            align:'center',
            width:'10%',
            formatter: function (value, row, index) {
                var html = value;
                if(row.ischecked=='1'){
                    html += '<div class="m-t-10">已到账</div>';
                }
                return html;
            },
        }, {
            field: 'outtotal',
            title: '提现金额(元)',
            align:'center',
            width:'10%',
        }, {
            field: 'outsxf',
            title: '手续费(元)',
            align:'center',
        },  {
			field: 'outmoney',
			title: '到账金额',
			align: 'center',
		},  {
            field: 'create_time',
            title: '提现时间',
            align: 'center',
        }
	],
	searchParamas:[{'type':'2','id':'txstatus'},{'type':'1','id':'nickname'},{'type':'1','id':'openid'}],
	toolbar:{
	},
};
webtable.init(initConfig);
$('#txtype,#txstatus').change(function(e) {
     webtable.refresh();
})
});
</script>
<script id='reason-tpl' type="text/template">
<div class="form-horizontal">
  <div class="form-group">
    <label class="col-lg-3 control-label">* 拒绝理由</label>
    <div class="col-lg-8">
      <input class="form-control reason" type="text"  name="reason" placeholder="理由尽量精简">
    </div>
  </div>
</div>
</script>
{include file='$Wpath/common/footer'}
