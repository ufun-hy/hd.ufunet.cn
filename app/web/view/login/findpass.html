{include file="$Wpath/common/header_base" /}
<style>
html,body{overflow:hidden;}
.lyear-wrapper-bg {
    position: fixed;
    left:0;
    top: 0;
    width: 100%;
    height: 100%;
    background-image: url({:tomedia($config['common']['bgimg'])}); 
    background-size: cover;
}
.lyear-wrapper {
    position: relative;
    height: 100%;
}
.lyear-login {
    display: flex !important;
    height: 100%;
    align-items: center !important;
    justify-content: center !important;
}
.lyear-login:after{
    content: '';
    min-height: inherit;
    font-size: 0;
}
.login-center {
    background: #fff;
    min-width: 29.25rem;
    padding: 2.14286em 3.57143em;
    border-radius: 3px;
    margin: 2.85714em;
}
.login-header {
    margin-bottom: 1.5rem !important;
}
.login-header img{max-width: 260px;}
.login-box .form-group{min-width: 40%}
.login-center .has-feedback.feedback-left .form-control {
    padding-left: 38px;
    padding-right: 12px;
}
.login-center .has-feedback.feedback-left .form-control-feedback {
    left: 0;
    right: auto;
    width: 38px;
    height: 38px;
    line-height: 38px;
    z-index: 4;
    color: #dcdcdc;
}
.login-center .has-success .form-control-feedback {
    display: block!important;
}
.login-center .has-feedback.feedback-right .form-control-feedback-right {
    position: absolute;
    top:0;
    right: 0;
    width: 30px;
    height: 38px;
    line-height: 38px;
    z-index: 4;
    color: #dcdcdc;
    text-align: center;
}
.btn-sendcode.disabled{pointer-events: none;cursor: not-allowed;}
.login-nav{margin-bottom: 20px;}
.login-nav li a{border-width:3px!important;border-radius: 0!important;}
.yzm-box{position: relative;margin: 10px;}
.yzm-box *{box-sizing: border-box;}
.yzm-box input{
  width: 220px;
  height: 42px;
  line-height: 42px;
  padding-left: 42px;
}
.yzm-box span{
  position: absolute;
  left: 0;
  right: auto;
  width: 42px;
  height: 42px;
  line-height: 42px;
  z-index: 4;
  color: #dcdcdc;
}
.yzm-box a{width: 157.5px}
.yzm-box a img{width:157.5px;height: 42px;}
.layui-layer-btn0.disabled{pointer-events: none;}
</style>
<div class="lyear-wrapper-bg"></div>
<div class="row lyear-wrapper">
  <div class="lyear-login">
    <div class="login-center">
      <div class="login-header text-center">
        <img  src="{:tomedia($config['common']['logo'])}">
      </div>
      <ul class="nav nav-tabs text-center login-nav">
        <li class="nav-item active d-inline-block" style="float: none">
          <a data-toggle="tab" href="#username-login">找回密码</a>
        </li>
      </ul>
      <div class="login-box tab-content">
        <div class="tab-pane fade active in" id="username-login">
          <div class="form-group phoneitem has-feedback feedback-left">
            <input type="text" placeholder="请输入您的手机号" class="form-control mobile" name="mobile" maxlength="11" />
            <span class="mdi mdi-cellphone form-control-feedback" aria-hidden="true"></span>
          </div>
          <div class="form-group phoneitem has-feedback feedback-left">
            <div class="input-group">
              <input name="mobilecode" type="text" class="form-control mobilecode" placeholder="请输入验证码" maxlength=4 >
              <span class="mdi mdi-verified form-control-feedback" aria-hidden="true"></span>
              <span href="javascript:void(0)" class="input-group-addon btn btn-primary btn-sendcode">短信验证码</span>
            </div>
          </div>
          <div class="form-group repassitem has-feedback feedback-left feedback-right hidden">
              <input type="password"  style="display:none" autocomplete="new-password"/>
              <input type="password" placeholder="请输入密码" class="form-control password" name="password" />
              <span class="mdi mdi-lock form-control-feedback" aria-hidden="true"></span>
          </div>
          <div class="form-group repassitem has-feedback feedback-left feedback-right hidden">
            <input type="password" placeholder="请再次输入密码" class="form-control repassword" name="repassword" />
            <span class="mdi mdi-lock form-control-feedback" aria-hidden="true"></span>
          </div>
        </div>
        <div class="form-group btn-findpass">
          <button class="btn btn-block btn-primary" type="button">下一步</button>
        </div>
      </div>
      <div class="form-group m-b-0">
          <div style="height:30px;line-height: 30px;">
            <div class="pull-right ">已找回密码？<a href="{:APP_WEB_LOGIN}">立即登录</a></div>
          </div>
      </div>
    </div>
  </div>
</div>
{include file="login/common" /}
<script>
require(['webcore','layerBox','zamnotice'],function(webcore,layerBox,zamnotice){
    var timer;
    $(".login-box button").click(function(){
        var $this = $(this),mobile = $(".mobile").val(),mobilecode = $(".mobilecode").val(),phonereg = /^[1][3,4,5,6,7,8,9][0-9]{9}$/;
        if(mobile=='' || !phonereg.test(mobile)){
            return zamnotice.showTips('error','请输入正确的手机号码');
        }
        if(mobilecode=='' || mobilecode.length != 4){
            return zamnotice.showTips('error','请输入正确的验证码');
        }
        if($this.hasClass('disabled')) return;
        $this.addClass("disabled");
        webcore.ajaxSubmit("{:goweb('findpass/index')}",{mobile:mobile,mobilecode:mobilecode},'验证中...').then(function(json){
            $this.removeClass("disabled");
            if(json.code==0){
                //页面转至下发
                clearInterval(timer);
                $(".login-box .phoneitem").eq(1).find(".btn").text('短信验证码');
                $(".login-box .phoneitem").addClass('hidden');
                $(".login-box .repassitem").removeClass('hidden');
                $(".login-box .btn-findpass").html('<button class="btn btn-block btn-primary" type="button">重置密码</button>');
                $(".login-box button").bind('click',function(){
                      var $this2 =$(this),password = $(".password").val(),repassword = $(".repassword").val(),passwordreg = /^(?![0-9]+$)(?![a-zA-Z]+$)[0-9A-Za-z]{8,20}$/;
                      if(password=='' || !passwordreg.test(password)){
                          return zamnotice.showTips('error','密码由8-20字母和数字混合组成，不能是纯字母或者纯数字');
                      }
                      if(password!=repassword){
                          return zamnotice.showTips('error','2次输入的密码不一致');
                      }
                      if($this2.hasClass('disabled')) return;
                      $this2.addClass("disabled");
                      webcore.ajaxSubmit("{:goweb('findpass/repass')}",{mobile:$(".mobile").val(),mobilecode:$(".mobilecode").val(),password:password,repassword:repassword},'重置密码中...').then(function(json){
                          $this2.removeClass("disabled");
                          if(json.code==0){
                              zamnotice.showTips('success','重置密码成功',1e3,function(){
                                  window.location.href = "{:APP_WEB_LOGIN}";
                              });
                          }else{
                              zamnotice.showTips('error',json.msg);
                          }
                      },function(){
                          $this2.removeClass("disabled");
                          zamnotice.showTips('error','出现异常');
                      });
                });
            }else{
                zamnotice.showTips('error',json.msg);
            }
        },function(){
            $this.removeClass("disabled");
            zamnotice.showTips('error','出现异常');
        });
    });
    $(".btn-sendcode").click(function(){
        var $this = $(this),mobile = $(".mobile").val(),phonereg = /^[1][3,4,5,6,7,8,9][0-9]{9}$/;
        if(mobile=='' || !phonereg.test(mobile)){
            return zamnotice.showTips('error','请输入正确的手机号码');
        }
        var yzmlayer = layerBox.sendcodeLayer('请输入验证码',webcore.tpl($("#yzm-tpl"),{}),['发送短信验证码'],function(index,layerno){
            var yzm = $(".captcha").val();
            if(yzm==''){
              return zamnotice.showTips('error','请先输入验证码');
            }
            layerno.find('.layui-layer-btn0').addClass('disabled');
            webcore.ajaxSubmit("{:goweb('findpass/sendcode')}",{mobile:mobile,yzm:yzm}).then(function(json){
                if(json.code==0){
                    $this.addClass("disabled");
                    timer = webcore.countdown(60,function(t){
                      $this.text(t+' s');
                    },function(){
                      $this.removeClass("disabled");
                      $this.text('短信验证码').removeClass('disabled');
                    });
                    layerBox.close(index);
                    zamnotice.showTips('success','短信验证码下发成功，请稍后查收');
                } else {
                  setTimeout(function(){
                    layerno.find('.layui-layer-btn0').removeClass('disabled');
                  },1e3);
                  zamnotice.showTips('error',json.msg);
                  $('.imgverify img').trigger('click');
                }
            },function(){
                setTimeout(function(){
                  layerno.find('.layui-layer-btn0').removeClass('disabled');
                },1e3);
                zamnotice.showTips('error','下发验证码出现异常');
            });
        });
    });
});
</script>
<script id='yzm-tpl' type="text/template">
<div class="yzm-box zam-flex">
  <input name="captcha" type="text" class="form-control captcha" placeholder="请输入验证码" maxlength="4">
  <span class="mdi mdi-verified form-control-feedback" aria-hidden="true"></span>
  <a href="javascript:;" class="input-group-btn imgverify"><img id="captchaimg" src="/common/verify/findfass" title="点击图片更换验证码" onerror=""></a>
</div>
</script>
{include file="$Wpath/common/footer_base" /}
