<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
    <div class="carditem">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 状态</label>
            <div class="col-lg-8">
            {foreach $rolestatus as $k=>$v}
            <label class="lyear-radio radio-inline radio-primary">
            <input type="radio" name="status" value="{$k}" {if $config['status'] == $k}checked{/if}><span>{$v}</span>
            </label>
            {/foreach}
            <span class="help-block">状态禁用后此权限组无效</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">* 角色名</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="rolename" value="{$config['rolename']}">
                <span class="zam-help-block">注:必须与其他角色名称保证不相同</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">* 角色简介</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="roledes" value="{$config['roledes']}">
            </div>
        </div>
    </div>
</form>
</div>
