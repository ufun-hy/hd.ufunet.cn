<div class="alert alert-info">此处设置的奖品是默认轮次的奖品，默认轮次其他信息由系统自动生成</div>
<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
 <div class="form-group">
    <label class="col-lg-3 control-label">* 商品名称</label>
    <div class="col-lg-8">
      <input type="text" class="form-control"  name="goodsname" value="{$config['goodsname']}" placeholder="12字内，推荐控制在5个字" maxlength="12">
    </div>
 </div>
 <div class="form-group">
    <label class="col-lg-3 control-label">* 商品介绍</label>
    <div class="col-lg-8">
         <textarea class="form-control" name="goodsdes" rows="4">{$config['goodsdes']}</textarea>
    </div>
</div>
 <div class="form-group">
    <label class="col-lg-3 control-label">* 商品单位</label>
    <div class="col-lg-8">
      <input type="text" class="form-control"  name="goodsunit" value="{$config['goodsunit']}" placeholder="个，条，件，箱等">
    </div>
 </div>
 <div class="form-group">
	<label class="col-lg-3 control-label">* 商品图</label>
	<div class="col-lg-8">
	   {:tpl_image_one('goodsimg',$config['goodsimg'])}
       <span class="zam-help-block">规格:100px * 100px</span>
	</div>
 </div>
 <div class="form-group">
    <label class="col-lg-3 control-label">* 商品单价</label>
    <div class="col-lg-8">
        <input type="text" class="form-control numberincdec" name="goodsprice" 
        data-bts-min="0.01" data-bts-replacement-val="0.01"
        data-bts-max="null"
        data-bts-decimals="2"
        data-bts-step="1"
        data-bts-force-step-divisibility="xstwo"
        data-bts-postfix="元"
        data-bts-postfix-extra-class="touchspin-postfix"
        value="{$config['goodsprice']}">
    </div>
</div>
</form>
</div>
<script type="text/javascript">
require(['webcore',"bootstrap-touchspin"],function(webcore){
    tpl_switch();
    $(".confirmbox-pop .numberincdec").TouchSpin();
});
</script>
