<style>
.rotate-pop .form-group{margin-bottom: 1px;}
table tr td{text-align:center!important}
.confirmbox-pop .zam-titleBox{font-weight: 600;padding:5px 0;}
.userimgbox img{height:40px!important;}
.edui-default .edui-toolbar .edui-for-fullscreen {
    display: none!important
}
#edui_fixedlayer{z-index: 9999!important}
</style>
<div class="form-horizontal confirmbox-pop rotate-pop">
<form class="confirm-formbox" method="post">
		<input type="hidden"  name="roundid" value="{$rotate['roundid']}">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 轮次名</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="title" value="{$rotate['title']}">
                <div class="help-block">轮次名称会在匹配记录顶部展示出来</div>
            </div>
        </div>
        <div class="form-group">
			<label class="col-lg-3 control-label">* 重复配对</label>
			<div class="col-lg-8">
				<label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="isexcept" value="1" {if $rotate['isexcept']=='1'}checked{/if}><span>配对成功自动剔除</span>
                </label>
                <label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="isexcept" value="2" {if $rotate['isexcept']=='2'}checked{/if}><span>独立配对</span>
                </label>
                <div class="help-block m-t-0">
                	<div class="help-block m-b-0">配对成功自动剔除：本轮匹配的用户将自动剔除，且不可以参与后续对对碰</div>
                	<div class="help-block m-b-0">独立配对:独立的轮次，无论之前是否配匹成功都可以参与本轮配对</div>
                </div>
			</div>
		</div>
		<div class="form-group">
			<label class="col-lg-3 control-label">* 配对类型</label>
			<div class="col-lg-8">
				<label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="sextype" value="1" {if $rotate['sextype']=='1'}checked{/if}><span>男女对对碰</span>
                </label>
                <label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="sextype" value="2" {if $rotate['sextype']=='2'}checked{/if}><span>男男对对碰</span>
                </label>
                <label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="sextype" value="3" {if $rotate['sextype']=='3'}checked{/if}><span>女女对对碰</span>
                </label>
                <label class="lyear-radio radio-inline radio-primary">
                    <input type="radio" name="sextype" value="4" {if $rotate['sextype']=='4'}checked{/if}><span>随机对对碰</span>
                </label>
                
                <div class="help-block m-t-0">
                	<div class="help-block m-b-0">男女/男男/女女对对碰区分性别，需要使用签到功能配合收集用户性别</div>
                	<div class="help-block m-b-0">随机对对碰不区分性别，随机对对碰</div>
                </div>
			</div>
		</div>
		<div class="form-group">
			<label class="col-lg-3 control-label">* 左右队伍</label>
			<div class="col-lg-8">
				<div class="pop-btns m-t-5 m-b-15">
					<a class="btn btn-primary btn-sm" href="javascript:;">左侧配对队伍</a>
					<a class="btn btn-default btn-sm"href="javascript:;">右侧配对队伍</a>
				</div>
			</div>
		</div>
		<div class="carditem">
			<div class="form-group">
				<label class="col-lg-3 control-label">* 队伍名称</label>
				<div class="col-lg-3">
					<input class="form-control" type="text"  name="leftgroupconfig[name]" value="{$rotate['leftgroupconfig']['name']??'男神队'}">
					<div class="help-block">推荐6个字以内</div>
				</div>
			</div>
			<div class="form-group lgrouptype">
				<label class="col-lg-3 control-label">* 配对名单</label>
				<div class="col-lg-8">
					<label class="lyear-radio radio-inline radio-primary">
	                    <input type="radio" name="leftgroupconfig[type]" value="1" {if $rotate['leftgroupconfig']['type']=='1'}checked{/if}><span>全部用户</span>
	                </label>
	                <label class="lyear-radio radio-inline radio-primary">
	                    <input type="radio" name="leftgroupconfig[type]" value="2" {if $rotate['leftgroupconfig']['type']=='2'}checked{/if}><span>签到用户</span>
	                </label>
	                <div class="help-block">分组内的用户性别与配对类型内性别保持一致</div>
				</div>
			</div>
			<input type="hidden"  name="leftgroupconfig[sign_groupid]" value="{$rotate['leftgroupconfig']['sign_groupid']??''}">
			<input type="hidden"  name="leftgroupconfig[sign_groupid_val]" value="{$rotate['leftgroupconfig']['sign_groupid_val']??''}">
			<input type="hidden"  name="leftgroupconfig[self_groupid]" value="{$rotate['leftgroupconfig']['self_groupid']??''}">
		</div>
		<div class="carditem hidden">
			<div class="form-group">
				<label class="col-lg-3 control-label">* 队伍名称</label>
				<div class="col-lg-3">
					<input class="form-control" type="text"  name="rightgroupconfig[name]" value="{$rotate['rightgroupconfig']['name']??'女神队'}">
					<div class="help-block">推荐6个字以内</div>
				</div>
			</div>
			<div class="form-group rgrouptype">
				<label class="col-lg-3 control-label">* 配对名单</label>
				<div class="col-lg-8">
					<label class="lyear-radio radio-inline radio-primary">
	                    <input type="radio" name="rightgroupconfig[type]" value="1" {if $rotate['rightgroupconfig']['type']=='1'}checked{/if}><span>全部用户</span>
	                </label>
	                <label class="lyear-radio radio-inline radio-primary">
	                    <input type="radio" name="rightgroupconfig[type]" value="2" {if $rotate['rightgroupconfig']['type']=='2'}checked{/if}><span>签到用户</span>
	                </label>
	                <div class="help-block">分组内的用户性别与配对类型内性别保持一致</div>
				</div>
			</div>
			<input type="hidden"  name="rightgroupconfig[sign_groupid]" value="{$rotate['rightgroupconfig']['sign_groupid']??''}">
			<input type="hidden"  name="rightgroupconfig[sign_groupid_val]" value="{$rotate['rightgroupconfig']['sign_groupid_val']??''}">
			<input type="hidden"  name="rightgroupconfig[self_groupid]" value="{$rotate['rightgroupconfig']['self_groupid']??''}">
		</div>
		<div class="form-group">
            <label class="col-lg-3 control-label">* 本轮最大匹配对数</label>
			<div class="col-lg-4">
				<input type="text" class="form-control numberincdec" name="plannum" 
                data-bts-min="0" data-bts-replacement-val="0"
                data-bts-max="null"
                data-bts-step="1"
                data-bts-postfix="对"
	            data-bts-postfix-extra-class="touchspin-postfix"
                value="{$rotate['plannum']??'1'}">
                <div class="help-block m-t-0">此项用于控制本轮最多匹配多少对名单，0为不限制</div>
			</div>
		</div>
		<div class="form-group">
            <label class="col-lg-3 control-label">* 每次默认匹配对数</label>
			<div class="col-lg-4">
				<input type="text" class="form-control numberincdec" name="outnum" 
                data-bts-min="1" data-bts-replacement-val="1"
                data-bts-max="null"
                data-bts-step="1"
                data-bts-postfix="对"
	            data-bts-postfix-extra-class="touchspin-postfix"
                value="{$rotate['outnum']??'1'}">
                <div class="help-block m-t-0">此项用于控制本轮默认单次抽出对数</div>
			</div>
		</div>
</form>
</div> 
    
<script>    
require(['webcore','jconfirmBox','zamnotice','layerBox',"bootstrap-touchspin"],function(webcore,jconfirmBox,zamnotice,layerBox){
	
	//左侧点击匹配类型
    $(".rotate-pop .pop-btns a.btn").click(function(){
        $(this).addClass('btn-primary').siblings().removeClass("btn-primary");
        $(".rotate-pop .carditem").addClass('hidden').eq($(this).index()).removeClass('hidden');
    });
    $(".confirmbox-pop .numberincdec").TouchSpin().on("change", function(){
        var $this = $(this),funcstr = $this.data('func');
        var func = window[funcstr];
        func && func();
    });
});

</script>
