{include file='$Wpath/common/header'}
<div class="alert alert-success" role="alert">
    <i class="mdi mdi-bell-ring"></i> 为保证同一个活动不会出现多次发布或者多次购买相同功能发生，同一个活动发布或者新增功能产生了新订单均会自动将之前产生的待支付订单转为支付失败。
</div>
<div class="alert alert-danger" role="alert">
    <i class="mdi mdi-bell-ring"></i> 已逾期即为订单过了最晚支付时间，微信或者支付宝扫码类订单均必须在2小时内完成支付，逾期均无法再次发起支付
</div>
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
        <div class="input-group input-group-sm">
          <span class="input-group-addon">活动主题</span>
          <input type="text" class="form-control" value="" id="keyword" placeholder="请输入活动主题" style="width: 140px;">
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">支付方式</span>
          <select id="paytype" class="form-control js_select2">
            {foreach $paytypes as $pkey=>$pval } 
            <option value="{$pkey}">{$pval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">状态</span>
          <select id="orderstatus" class="form-control js_select2">
            {foreach $orderstatuss as $okey=>$oval } 
            <option value="{$okey}">{$oval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">类型</span>
          <select id="fromtype" class="form-control js_select2">
            {foreach $typelists as $tkey=>$tval } 
            <option value="{$tkey}">{$tval}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">商户订单号</span>
        <input type="text" class="form-control" value="" id="tradeid" placeholder="请输入商户订单号" style="width: 80px;">
      </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">用户名/手机号</span>
        <input type="text" class="form-control" value="" id="username" placeholder="请输入用户名或手机号" style="width: 100px;">
      </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
    <a class="btn btn-warning btn-sm btn-exportall hidden" href="javascript:void(0)"><i class="mdi mdi-export"></i> 全部导出</a>
</div>
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
    var initConfig = {
    	tableId:'#listtable',
    	url:"{:goweb('weborder/list')}",
    	columnoperate:{
            btns:{
                edit:{
                    title:"手动支付",
                    icon:"mdi-gavel",
                    except:{
                        'more':[
                            {'field':'status','only':'2'},
                            {'field':'canpay','only':'1'},
                        ],
                    }
                },
                del:{title:"关闭订单",icon:"mdi-close",except:{'only':'2'}},
                refund:{
                    title:"退款",
                    icon:"mdi-export",
                    except:{
                        'more':[
                            {'field':'status','only':'1'},
                            {'field':'isforce','only':'2'},
                            {'field':'totalfee','eq':'0'},
                        ],
                    }
                },
            },
    	    func:{
                edit:function(value, row, index){
                    jconfirmBox.confirm('温馨提示','您确定要手动强制改成已经支付么？',function(){
                        webcore.ajaxSubmit("{:goweb('weborder/forcepay')}",{orderid:row.id},'处理中..').then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','操作成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                    });
                },
        	    refund:function(value, row, index){
                	jconfirmBox.confirm('温馨提示','您确定要退款么？',function(){
            			webcore.ajaxSubmit("{:goweb('weborder/refund')}",{orderid:row.id},'处理中..').then(function(json){
            				if(json.code==0){
            				    webtable.refresh();
            				    zamnotice.showTips('success','发起退款申请成功，请稍后查询退款结果');
            			    }else{
            			        zamnotice.showTips('error',json.msg);
            			    }
            			}, function(json){
            				zamnotice.showTips('error','网络差。操作失败');
            			});
                	});
        	    },
                del:function(value, row, index){
                    jconfirmBox.confirm('温馨提示','您确定要关闭该订单么？',function(){
                        webcore.ajaxSubmit("{:goweb('weborder/closeorder')}",{orderid:row.id},'处理中..').then(function(json){
                            if(json.code==0){
                                webtable.refresh();
                                zamnotice.showTips('success','操作成功');
                            }else{
                                zamnotice.showTips('error',json.msg);
                            }
                        }, function(json){
                            zamnotice.showTips('error','网络差。操作失败');
                        });
                    });
                },
    	    }
    	},
    	columns:[{
    			checkbox: true,
    		}, 
    		{
    			field: 'id',
    			title: 'ID',
    			align: 'center',
                width:'3%',
    			visible: false
    		}, {
                field: 'user_name',
                title: '后台用户',
                align:'center',
                formatter: function (value, row, index) {
                    var html = "<div><span>"+(value==null?"已删除":value)+"</span></div><div class='m-t-5'><span>id:"+row.user_id+"</span></div>";
                    return html;
                },
            }, {
                field: 'hdtitle',
                title: '活动',
                align:'center',
                formatter: function (value, row, index) {
                    if(row.huodong_id=='0') return '-';
                    var html = "<div><span>"+(value==null?"已删除":value)+"</span></div><div class='m-t-5'><span>id:"+row.huodong_id+"</span></div>";
                    return html;
                },
            }, {
                field: 'statusname',
                title: '状态',
                align:'center',
                formatter: function (value, row, index) {
                    var html = value;
                    if(row.status=='1' && row.isforce=='1'){
                        html += "<div class='m-t-5'><span class='text-danger'>手动支付</span></div>";
                    }
                    if(row.status=='2' && row.canpay=='2'){
                        html += "<div class='m-t-5'>已逾期</div>";
                    }
                    return html;
                },
                width:'5%',
            },  {
                field: 'fromtypename',
                title: '来源',
                align: 'center',
            },  {
                field: 'paytypename',
                title: '支付方式',
                align: 'center',
            }, {
                field: 'tradeid',
                title: '订单号',
                align:'center',
            }, {
                field: 'payfee',
                title: '订单金额(元)',
                align:'center',
            }, {
                field: 'payinfo',
                title: '订单详情',
                align:'center',
                formatter: function (value, row, index) {
                    var html = '';
                    if(row.fromtype < 3 && row.addnums > 0 ){
                        html += '<div class="bugperson">人数:'+row.addnums+'人</div>';
                    }
                    var forcereason = (row.forceinfo && row.forceinfo.reason) ? row.forceinfo.reason : '暂无';
                    if(row.fromtype == '3'){
                        if(row.isforce=='1'){
                            if(row.payfee==0){
                                if(row.addnums > 0 ){
                                    html += '<div class="bughbnum">充值红包:'+row.addnums+'元</div>';
                                    html += '<div class="bughbnum"><span class="text-danger">手动新增</span></div>';
                                }else{
                                    html += '<div class="bughbnum">充值红包:'+row.addnums+'元</div>';
                                    html += '<div class="bughbnum"><span class="text-success">手动减去</span></div>';
                                }
                                html += "<div class='m-t-5'>原因:<span class='text-primary m-l-5'>"+forcereason+"</span></div>";
                            }else{
                                html += '<div class="bughbnum">充值红包:'+row.addnums+'元</div>';
                            }
                        }else{
                            html += '<div class="bughbnum">充值红包:'+row.addnums+'元</div>';
                        }
                    }
                    if(row.fromtype == '4'){
                        if(row.payfee==0){
                            if(row.addnums > 0 ){
                                html += '<div class="bughbnum">充值短信:'+row.addnums+'条</div>';
                                html += '<div class="bughbnum"><span class="text-danger">手动新增</span></div>';
                            }else{
                                html += '<div class="bughbnum">充值短信:'+row.addnums+'条</div>';
                                html += '<div class="bughbnum"><span class="text-success">手动减去</span></div>';
                            }
                            html += "<div class='m-t-5'>原因:<span class='text-primary m-l-5'>"+forcereason+"</span></div>";
                        }else{
                            html += '<div class="bugperson">充值短信:'+row.addnums+'条</div>';
                        }
                    }
                    if(value.modules && value.modules.length > 0){
                        html += '<div>模块:';
                        $.each(value.modules,function(i,v){
                            html += (i > 0 ?"+":"") + v.name;
                        });
                        html += '</div>';
                    }
                    if(row.isrenewal=='1'){
                        html += "<div>活动续期:"+value.daynum+"天</div>";
                    }
                    if(value.fws && value.fws.length > 0){
                        html += '<div>增值服务:';
                        $.each(value.fws,function(i,v){
                            html += (i > 0 ?"+":"") + v.name;
                        });
                        html += '</div>';
                    }
                    if(row.fromtype < 3 && row.status=='1' && row.totalfee=='0'){
                        html += "<div class='m-t-5'><span class='text-danger'>"+forcereason+"</span></div>";
                    }
                    if(row.paytype=='1' && row.status=='4'){
                        html += "<div class='m-t-5'>退款单号:"+row.refund_id+"</div>";
                    }
                    return html;
                },
            },  {
                field: 'create_time',
                title: '下单时间',
                align: 'center',
            }
    	],
    	searchParamas:[{'type':'1','id':'keyword'},{'type':'2','id':'paytype'},{'type':'2','id':'orderstatus'},{'type':'2','id':'fromtype'},{'type':'1','id':'tradeid'},{'type':'1','id':'username'}],
    	toolbar:{
    	    del:function(ajaxurl){
    	        var getSelects = webtable.getSelections();
            	if(getSelects.length>0){
            		jconfirmBox.confirm('温馨提示','您确定要删除选中的数据么？',function(){
            			webcore.ajaxSubmit(ajaxurl,{attid:getSelects},'处理中..').then(function(json){
            				if(json.code==0){
            					webtable.refresh();
            					zamnotice.showTips('success','删除成功');
            				}else{
            					zamnotice.showTips('error',json.msg);
            				}
            			}, function(json){
            				zamnotice.showTips('error','网络差,操作失败');
            			});
            		});
            	}else{
            		zamnotice.showTips('info','请先选择您要操作的数据');
            	}
    	    },
    	},
    };
    webtable.init(initConfig);
    $('.zam-inline-searchbar select').change(function(e) {
        webtable.refresh();
    });
});
</script>
{include file='$Wpath/common/footer'}
