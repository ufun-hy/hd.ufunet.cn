{include file='$Wpath/common/header'}
{include file='$Wpath/common/tabletoolbar'}
<style type="text/css">
  .card-hdmodule{border:1px solid #dfe6ec}
  .card-hdmodule:hover{
    box-shadow: 1px 3px 10px rgba(37,46,64,.2);
  }
  .card-hdmodule .hdmodule-switch{
    position: absolute;
    right: 20px;
    top: 10px
  }
  .card-hdmodule .hdmodule-edit{
    position: absolute;
    right: 30px;
    bottom: 40px;
  }
</style>
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
    tableId:'#listtable',
    url:"{:goweb('hdmj/index')}",
    columnoperate:{
        btns:{
            edit:true,
            del:true,
        },
        func:{
            edit:function(value, row, index){
                var confirmObj = jconfirmBox.ajaxconfirm("编辑满减","{:goweb('hdmj/edit')}",{ishtml:'1',mjid:row.id},'html','col-lg-6 col-lg-offset-3',function(e){
                    var postData = webcore.serializeObject(e.find('form'));
                    postData.mjid = row.id;
                    webcore.ajaxSubmit("{:goweb('hdmj/edit')}",postData).then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','保存成功');
                            confirmObj.close();
                        }else{
                            zamnotice.showTips('error',json.msg);
                             return false;
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差。操作失败');
                         return false;
                    });
                });
            },
            del:function(value, row, index){
                jconfirmBox.confirm('温馨提示','您确定要删除么？',function(){
                      webcore.ajaxSubmit("{:goweb('hdmj/del')}",{mjid:row.id},'处理中..').then(function(json){
                          if(json.code==0){
                              webtable.refresh();
                              zamnotice.showTips('success','删除成功');
                          }else{
                              zamnotice.showTips('error',json.msg);
                          }
                      }, function(json){
                          zamnotice.showTips('error','网络差。操作失败');
                      });
                });
            },
        }
    },
    columns:[{
            checkbox: true,
        }, 
        {
            field: 'id',
            title: 'ID',
            align: 'center',
            width:'6%',
            visible: false
        },  {
            field: 'mjorder',
            title: '排序',
            align: 'center',
        }, {
            field: 'mjprice',
            title: '满足金额(元)',
            align:'center',
        }, {
            field: 'reduceprice',
            title: '减少金额(元)',
            align:'center',
        },  {
            field: 'create_time',
            title: '添加时间',
            align: 'center',
        }
    ],
    searchParamas:[],
    toolbar:{
        add:function(ajaxurl){
            var confirmObj = jconfirmBox.ajaxconfirm("新增满减",ajaxurl,{ishtml:'1'},'html','col-lg-6 col-lg-offset-3',function(e){
                var postData = webcore.serializeObject(e.find('form'));
                webcore.ajaxSubmit(ajaxurl,postData).then(function(json){
                    if(json.code==0){
                        webtable.refresh();
                        zamnotice.showTips('success','新增成功');
                        confirmObj.close();
                    }else{
                        zamnotice.showTips('error',json.msg);
                         return false;
                    }
                }, function(json){
                    zamnotice.showTips('error','网络差。操作失败');
                     return false;
                });
            });
        },
        del:function(ajaxurl){
            var getSelects = webtable.getSelections();
            if(getSelects.length>0){
                jconfirmBox.confirm('温馨提示','您确定要删除选中的数据么？',function(){
                    webcore.ajaxSubmit(ajaxurl,{mjid:getSelects},'处理中..').then(function(json){
                        if(json.code==0){
                            webtable.refresh();
                            zamnotice.showTips('success','删除成功');
                        }else{
                            zamnotice.showTips('error',json.msg);
                        }
                    }, function(json){
                        zamnotice.showTips('error','网络差,操作失败');
                    });
                });
            }else{
                zamnotice.showTips('info','请先选择您要操作的数据');
            }
        },
    },
};
webtable.init(initConfig);
});
</script>
