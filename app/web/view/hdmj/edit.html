<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 排序序号</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="mjorder" value="{$config['mjorder']}">
                <span class="zam-help-block">注:升序排序，序号越小越排前面</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">满足金额</label>
            <div class="col-lg-7">
                  <div class="input-group">
                      <input type="text" class="form-control" name="mjprice" value="{$config['mjprice']}">
                      <div class="input-group-addon">元</div>
                  </div>
                  <span class="help-block">订单总额满该金额则减去部分金额</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">减去金额</label>
            <div class="col-lg-7">
                  <div class="input-group">
                      <input type="text" class="form-control" name="reduceprice" value="{$config['reduceprice']}">
                      <div class="input-group-addon">元</div>
                  </div>
                  <span class="help-block">用户组中可差异化设置当前满减金额</span>
            </div>
        </div>
    </div>
</form>
</div>
