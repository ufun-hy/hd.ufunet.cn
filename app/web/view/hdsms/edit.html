<div class="form-horizontal confirmbox-pop">
<form class="confirm-formbox" method="post">
        <div class="form-group">
            <label class="col-lg-3 control-label">* 排序序号</label>
            <div class="col-lg-8">
                <input class="form-control" type="text"  name="smsorder" value="{$config['smsorder']}">
                <span class="zam-help-block">注:升序排序，序号越小越排前面</span>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">短信条数</label>
            <div class="col-lg-7">
                  <div class="input-group">
                      <input type="text" class="form-control" name="smsnum" value="{$config['smsnum']}">
                      <div class="input-group-addon">条</div>
                  </div>
            </div>
        </div>
        <div class="form-group">
            <label class="col-lg-3 control-label">售价</label>
            <div class="col-lg-7">
                  <div class="input-group">
                      <input type="text" class="form-control" name="smsprice" value="{$config['smsprice']}">
                      <div class="input-group-addon">元</div>
                  </div>
                  <span class="help-block">固定短信条数则固定售价</span>
            </div>
        </div>
    </div>
</form>
</div>
