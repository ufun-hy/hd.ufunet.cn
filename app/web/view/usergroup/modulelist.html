<style>
.addgroupmodulelist li{
	text-align:center;
	width:25%;
	float:left;
	padding:8px;
	
}
.addgroupmoduleitem .moduleinfo{
	position:relative;
	left:10px;
	width:112px;
	font-size:15px;
	background-color:#fff;
	cursor:pointer;
	border:1px solid #dfe6ec;
}
.addgroupmoduleitem .moduleinfo:hover{
	box-shadow: -3px 5px 15px rgba(64,102,178,.3);
}
.addgroupmoduleitem .moduleinfo .moduleicon,.addgroupmoduleitem .moduleinfo .modulename{
	display:inline-block;
	text-align:center;
	width: 100%;
	height: 30px;
	line-height: 30px;
}
.addgroupmoduleitem .moduleinfo .moduleicon i{
	font-size:14px;
}
.addgroupmoduleitem .zam-typeselected {
	position: absolute;
	top: -2px;
	right: 3px;
	display: none;
	font-size: 12px;
	color: #fff;
	text-align: center;
	transition: 0.3s;
	-moz-transition: 0.3s;
	-o-transition: 0.3s;
	-webkit-transition: 0.3s;
}
.addgroupmoduleitem .zam-righttriangle{
	position: absolute;
	top: -1px;
	right: -1px;
	border-top: 25px solid #4886ff;
	border-left: 35px solid transparent;
	display:none;
}
.moduleinfo.active .zam-typeselected{
	display:block
}
.moduleinfo.active .zam-righttriangle{
	display:block
}
</style>
<ul class="addgroupmodulelist clearfix">
{volist name="modules" id="module"}
<li class="addgroupmoduleitem">
	<div class="moduleinfo text-primary" data-id="{$module['id']}" data-modulename="{$module['modulename']}">
		<span class="zam-righttriangle"></span>
		<i class="mdi mdi-check zam-typeselected"></i>
		<span class="moduleicon"><i class="{$module['moduleicon']}"></i></span>
		<span class="modulename">{$module['modulename']}</span>
	</div>
</li>
{/volist}
</ul>
<script type="text/javascript">
	$(".addgroupmodulelist .moduleinfo").on('click',function(){
		if(!$(this).hasClass('active')){
			$(this).addClass('active');
		}else{
			$(this).removeClass('active');
		}
	});
</script>
