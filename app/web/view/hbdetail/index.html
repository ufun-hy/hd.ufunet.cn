{include file='$Wpath/common/header'}
<style type="text/css">
.panel-body .item{margin-top: 10px;}
.money{font-size: 20px;font-weight: 600;}
</style>
<div class="panel panel-default">
		<div class="panel-heading"><span class="label label-primary">红包发放统计</span></div>
		<div class="panel-body">
		<div class="item col-sm-4 col-lg-2">
			<div>总发放</div>
			<div class="money text-danger">{$config['totalsend']}元</div>
		</div>
		<div class="item col-sm-4 col-lg-2">
			<div>今日</div>
		    <div class="money text-primary">{$config['todaysend']}元</div>
		</div>
		<div class="item col-sm-4 col-lg-2">
			<div>昨日</div>
		    <div class="money text-success">{$config['yessend']}元</div>
		</div>
		<div class="item col-sm-4 col-lg-2">
			<div>近一周</div>
		    <div class="money text-warning">{$config['weeksend']}元</div>
		</div>
		<div class="item col-sm-4 col-lg-2">
			<div>近一月</div>
		    <div class="money text-brown">{$config['monthsend']}元</div>
		</div>
		<div class="item col-sm-4 col-lg-2">
			<div>近半年</div>
		    <div class="money">{$config['halfyearsend']}元</div>
		</div>
	</div>
</div>
{include file='$Wpath/common/footer'}
