<div class="alert alert-danger">
	注意事项<br>
	1 每个发放成功的记录一般只会核实一次，只能核实30天内的发放记录<br>
	2 核实的目的是为了解决商家转账到零钱接口批量转账延迟很大系统很难第一时间拿到批量转账结果，从而导致系统将未到账的红包已视作红包发放成功，再而导致用户个人中心红包余额多扣了未到账的红包金额的问题<br>
	3 如果转账发起成功但是部分红包并未真实到账，系统将自动识别具体的到账金额<br>
	4 核实的数量较多会需要一定的时间，核实过程请勿关闭本窗口
</div>
<div class="zam-confirmBox progressbox">
	<div class="clearfix">
		<div class="col-lg-6 col-md-6">
			<div class="zam-confirmBox-item">
				<span class="zam-confirmBox-left col-lg-6">待核实总金额:</span>
				<div class="zam-confirmBox-right col-lg-4">
					<span class="label label-danger p-l-10 p-r-10 fa-1-5x">{$totalmoney}元</span>
				</div>
			</div>
		</div>
		<div class="col-lg-6 col-md-6">
			<div class="zam-confirmBox-item">
				<span class="zam-confirmBox-left col-lg-6">待核实总数量:</span>
				<div class="zam-confirmBox-right col-lg-4">
					<span class="label label-success p-l-10 p-r-10 fa-1-5x">{$totalnum}个</span>
				</div>
			</div>
		</div>
	</div>
	<div class="text-center" style="margin-top: 30px;">
		<a class="btn btn-primary m-b-15"><span><i class="mdi mdi-gavel"></i> 确认核实</span></a>
		<div id='process'></div>
	</div>
</div>
