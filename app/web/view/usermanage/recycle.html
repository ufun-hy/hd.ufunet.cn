<div class="zam-inline-searchbar searchplan">
	<div class="input-group zam-flex col-md-7">
		<input type="text" class="form-control" id="keyword" placeholder="请输入用户名或者手机号或者备注">
		<span class="input-group-btn">
			<button onclick="plansearch(this)" class="btn btn-primary btn-search"><i class="mdi mdi-magnify"></i> 搜索</button>
		</span>
	</div>
</div>
<table class="table" style="margin-bottom:0px;">
<thead>
  <tr>
  	<th style="width:20%;text-align:center;">用户</th>
	<th style="width:30%;text-align:center;">手机号</th>
	<th style="width:30%;text-align:center;">删除时间</th>
	<th style="width:20%;text-align:center;">操作</th>
  </tr>
</thead>
<tbody class="recycleuser-lists"></tbody>
</table>
<div class="pf-pager" style="padding:10px;text-align: center;"></div>
<script id="reone-tpl" type="text/template">
	<tr>
		<td class="text-center">
			<% d.user_name %>
		</td>
		<td class="text-center">
			<% d.user_mobile %>
		</td>
		<td class="text-center">
			<% d.delete_time %>
		</td>
		<td class="text-center">
			<a class="btn btn-primary btn-xs" data-userid="<% d.id %>" title="恢复" onclick="huifuone(this)"><i class="mdi mdi-gavel"></i></a>
			<a class="btn btn-danger btn-xs" data-userid="<% d.id %>" title="强制删除" onclick="forceone(this)"><i class="mdi mdi-delete"></i></a>
		</td>
	</tr>
</script>
<script>
function initrecyclelist(){
	require(["zamnotice","webcore"],function(zamnotice,webcore){
		webcore.ajaxSubmit("{:goweb('usermanage/recycleuser')}",{ajaxtype:'2',keyword:$(".searchplan input").val()},'正在加载..').then(function(json){
			var html = '';
			if(json.code==0){
				rushhtml(json);
			}else{
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
}
function plansearch(obj){ 
	require(["zamnotice","webcore"],function(zamnotice,webcore){
		var username = $(obj).parent().prev().val();
		if(username=='') return zamnotice.showTips('warning','请先输入关键词');
		webcore.ajaxSubmit("{:goweb('usermanage/recycleuser')}",{ajaxtype:'2',keyword:username},'正在加载..').then(function(json){
			var html = '';
			if(json.code==0){
				rushhtml(json);
			}else{
				zamnotice.showTips('error',json.msg);
			}
		}, function(json){
			zamnotice.showTips('error','网络差。操作失败');
		});
	});
}
function rushhtml(json){
	require(["webcore"],function(webcore){
		var html = '';
		var detaildata = json.msg;
		$.each(detaildata,function(i,v){
			v.delete_time = webcore.timeTostring(v.delete_time,1);
			html += webcore.tpl($("#reone-tpl"),v);
		});
		$(".recycleuser-lists").html(html);
	});
}
function huifuone(obj){
	var userid = $(obj).attr('data-userid');
	require(["webcore","webtable","zamnotice","jconfirmBox"],function(webcore,webtable,zamnotice,jconfirmBox){
		jconfirmBox.confirm('温馨提示','您确定要从回收站里恢复当前用户么？',function(){
			webcore.ajaxSubmit("{:goweb('usermanage/huifuone')}",{userid:userid},'正在操作..').then(function(json){
				if(json.code==0){
					zamnotice.showTips('success','操作成功');
					initrecyclelist();
					webtable.refresh();
				}else{
					zamnotice.showTips('error',json.msg);
				}
			}, function(json){
				zamnotice.showTips('error','网络差。操作失败');
			});
		});
	});
}
function forceone(obj){
	var userid = $(obj).attr('data-userid');
	require(["webcore","webtable","zamnotice","jconfirmBox"],function(webcore,webtable,zamnotice,jconfirmBox){
		jconfirmBox.confirm('温馨提示','您确定要从回收站里强制删除当前用户么？',function(){
			webcore.ajaxSubmit("{:goweb('usermanage/forcedelete')}",{userid:userid},'正在操作..').then(function(json){
				if(json.code==0){
					zamnotice.showTips('success','操作成功');
					initrecyclelist();
					webtable.refresh();
				}else{
					zamnotice.showTips('error',json.msg);
				}
			}, function(json){
				zamnotice.showTips('error','网络差。操作失败');
			});
		});
	});
}
initrecyclelist();
</script>
