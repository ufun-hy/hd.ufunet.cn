{include file='$Wpath/common/header'}
<div class="form-inline zam-inline-searchbar">
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">活动</span>
          <select id="hdid" class="form-control js_select2">
            <option value="0">全部活动</option>
            {foreach $hdtitles as $k=>$v } 
            <option value="{$v['id']}">(id:{$v['id']}){$v['hdtitle']}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <div class="form-group">
      <div class="input-group input-group-sm">
        <span class="input-group-addon">功能</span>
          <select id="fromtype" class="form-control js_select2">
            <option value="0">全部功能</option>
            {foreach $modulelists as $k=>$v } 
            <option value="{$k}">{$v}</option>
            {/foreach}
          </select>
        </div>
    </div>
    <a class="btn btn-primary btn-sm btn-search" href="javascript:void(0)"><i class="mdi mdi-magnify"></i> 搜索</a>
    <a class="btn btn-warning btn-sm btn-export" href="javascript:void(0)"><i class="mdi mdi-export"></i> 导出</a>
</div>
<table id="listtable" class="zam-btable"></table>
<script>
require(['webcore','webtable','jconfirmBox','zamnotice'],function(webcore,webtable,jconfirmBox,zamnotice){
var initConfig = {
	tableId:'#listtable',
	url:"{:gomyhome('account/hbdetail')}",
	columnoperate:false,
	columns:[{
			checkbox: true,
		}, 
		{
			field: 'id',
			title: 'ID',
			align: 'center',
            width:'5',
			visible: false
		}, {
            field: 'hdtitle',
            title: '活动',
            align:'center',
            width:'30',
            formatter: function (value, row, index) {
                if(row.huodong_id=='0') return '-';
                var html = "<div><span>"+(value==null?"已删除":value)+"</span></div><div class='m-t-5'><span>id:"+row.huodong_id+"</span></div>";
                return html;
            },
        }, {
            field: 'userinfo',
            title: '用户',
            align:'center',
            width:'15',
            formatter: function (value, row, index) {
                var html = '<div class="zam-flex-column-center"><img class="avatarImg m-b-10" src="'+value.avatar+'" /><span class="label label-primary">'+value.nickname+'</span><span class="m-b-10">'+value.openid+'</span></div>';
                return html;
            },
        }, {
            field: 'tradeid',
            title: '交易单号',
            align:'center',
            width:'15',
        }, {
            field: 'sendmoney',
            title: '发放金额(元)',
            align:'center',
            width:'10',
        },  {
			field: 'fromtypename',
			title: '来源',
			align: 'center',
            width:'10',
		},  {
            field: 'create_time',
            title: '发放时间',
            align: 'center',
            width:'15',
        }
	],
	searchParamas:[{'type':'2','id':'hdid'},{'type':'2','id':'fromtype'}],
	toolbar:{
	},
};
webtable.init(initConfig);
$('.btn-export').on('click',function(){
   var hdid = $("#hdid").find('option:selected').val()||'';
   if(hdid=='') return zamnotice.showTips('info','请选择活动');
   webcore.ajaxSubmit("{:gomyhome('account/hbexportdetail')}",{hdid:hdid,fromtype:$("#fromtype").find('option:selected').val()||""}).then(function(json){
        if(json.code!=0){
            zamnotice.showTips('error',json.msg);
        }else{
            window.location.href = "{:gomyhome('account/hbexportdetail')}?hdid="+hdid+"&fromtype="+($("#fromtype").find('option:selected').val()||"");
        }
    }, function(json){
        zamnotice.showTips('error','网络差,操作失败');
    });
});
$('#hdid,#fromtype').change(function(e) {
     webtable.refresh();
})
});
</script>
{include file='$Wpath/common/footer'}
