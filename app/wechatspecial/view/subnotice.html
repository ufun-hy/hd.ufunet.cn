<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>拒绝后重新开启订阅通知教程</title>
<meta content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" name="viewport"/>
<meta content="yes" name="apple-mobile-web-app-capable"/>
<meta content="black" name="apple-mobile-web-app-status-bar-style"/>
<meta content="telephone=no" name="format-detection"/>
<link rel="shortcut icon" href="" />
<link rel="stylesheet" href="__STATIC__/js/ydui/css/ydui.css"/>
<link rel="stylesheet" href="__STATIC__/css/zam-icon.css" media="all" />
<link rel="stylesheet" href="__STATIC__/css/mxc-icon.css" media="all" />
<link rel="stylesheet" href="__STATIC__/css/wechat/style.css" />
<link rel="stylesheet" href="__STATIC__/css/animate.css"/>
<script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js" type="text/javascript" charset="utf-8"></script>
<script src="__STATIC__/js/ydui/js/ydui.flexible.js"></script>
<script src="__STATIC__/js/jquery.2.1.4.js"></script>
<script src="__STATIC__/js/jquery.extend.js"></script>
<style type="text/css">
.zam-app-subnoticejiaocheng{
    margin-bottom: 2rem;
}
.zam-app-subnoticejiaocheng .errmsg{
    font-size: 0.32rem;
    color: red;
}
.zam-app-subnoticejiaocheng .step{
    margin-top: 0.32rem;
    padding: 0 0.32rem;
}
.zam-app-subnoticejiaocheng .step p{
    margin-bottom: 0.32rem;
    font-size: 0.32rem;
}
.zam-app-subnoticejiaocheng .step .qrbox{
    width: 3rem;
}
.zam-app-subnoticejiaocheng .step .qrbox img{
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>
<section class="zam-app-subnoticejiaocheng g-scrollview">
	{if !empty($errmsg)}
        <div class="errmsg">{$errmsg}</div>
    {else /}
        <div class="step">
            <p>第一步：长按识别二维码关注公众号</p>
            <div class="qrbox">
                <img src="{:tomedia($qrimg)}" />
            </div>
        </div>
        <div class="step">
            <p>第二步：关注后点击右上角图标</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/1.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第三步：点击右上角三个点</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/2.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第四步：点击设置</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/3.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第五步：点击通知消息管理</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/4.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第六步：点击中奖结果通知</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/5.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第七步：点击接收</p>
            <div class="qrbox">
                <img src="__STATIC__/images/sys/subnotice/6.jpg" />
            </div>
        </div>
        <div class="step">
            <p>第八步：重新扫大屏二维码订阅中奖结果通知</p>
        </div>
    {/if}
</section>
</body>
</html>
