<style type="text/css">
.zam-app-bindsmuser{position: absolute;top:0;left:0;width: 100%;height: 100%}
.zam-app-bindsmuser-content{width: 100%;height: 100%}
.zam-app-bindsmuser .status{margin-bottom: 0.4rem;}
.zam-app-bindsmuser .status i{font-size: 0.9rem!important}
.zam-app-bindsmuser .status.issuccess{color: green;}
.zam-app-bindsmuser .status.iserror{color: red}
.zam-app-bindsmuser .message{font-size:0.32rem;margin-bottom:0.2rem;}
.btn-sq{width:72%;}
</style>
</head>
<body>
<section class="zam-app-bindsmuser g-flexview zam-app-flex-ajCenter">
	<div class="zam-app-bindsmuser-content zam-app-flex-ajCenter">
		<div class="status {if $code==0}issuccess{else /}iserror{/if}"><i class="mxc-{if $code==0}roundcheckfill{else /}roundclosefill{/if}"></i></div>
		<div class="message">{$message}</div>
		<button type="button" class="btn-block btn-primary btn-sq">关闭{if $code!=0}重新验证{/if}</button>
	</div>
</section>
</body>
<script>
var XCV3Config = {
	staticurl:"__STATIC__/",
	amconfig:{:json_encode(amconfig())},
	clienttype:"{$clienttype??1}",
};
require(['wechatcore'],function (wechatcore) {
	wechatcore.hidewxmenu();
	$(".btn-sq").click(function(){
		wechatcore.closewxwindow();
	});
});
