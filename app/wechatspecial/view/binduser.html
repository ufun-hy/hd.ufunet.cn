<style type="text/css">
.zam-app-bindtxuser{position: absolute;top:0;left:0;width: 100%;height: 100%}
.zam-app-bindtxuser-content{width: 100%;height: 100%}
.zam-app-bindtxuser img{width:1.56rem;height:1.56rem;border-radius:50%;margin-bottom: 0.4rem;}
.zam-app-bindtxuser .nickname{font-size:0.32rem;margin-bottom:0.2rem;}
.btn-sq{width:72%;}
</style>
</head>
<body>
<section class="zam-app-bindtxuser g-flexview zam-app-flex-ajCenter">
	<div class="zam-app-bindtxuser-content zam-app-flex-ajCenter">
		<img src="{$wxuser['headimgurl']}" />
		<div class="nickname">{$wxuser['nickname']}</div>
		<button type="button" class="btn-block btn-primary btn-sq">确认授权</button>
	</div>
</section>
</body>
<script>
var XCV3Config = {
	staticurl:"__STATIC__/",
	amconfig:{:json_encode(amconfig())},
	clienttype:"{if isset($clienttype)}{$clienttype}{else}1{/if}",
};
require(['wechatcore'],function (wechatcore) {
	wechatcore.hidewxmenu();
	$(".btn-sq").click(function(){
		var $this = $(this);
		var postData = {
			userid:"{$userid}",
			realhdid:"{$hdid}",
			type:"{$type}",
			openid:"{$wxuser['openid']}",
			nickname:"{$wxuser['nickname']}",
			avatar:"{$wxuser['headimgurl']}",
		};
		wechatcore.ajaxSubmit("{:gowechatspecial('wxminiprogram/confirmoauth')}",postData,'授权中...').then(function(data){
			if(data.code==0){
				wechatcore.showtopmsg('授权成功',1e3,function(){
					$this.removeClass('btn-primary btn-sq').text('已授权成功，请手动切换到抖音app参与互动');
				});
			}else{
				wechatcore.showtopmsg(data.msg);
			}
		}, function(){
			wechatcore.msg('网络太差，请稍后重试');
		});
	});
});  
</script>
