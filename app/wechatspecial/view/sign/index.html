<style type="text/css">
.zam-app-signsearch{
    background-color: #fff;
}
.zam-app-signsearch .errmsg{
    margin-top: 2.1rem;
    font-size: 0.32rem;
    color: red;
    text-align: center;
}
.zam-app-signsearch .banner{
    width: 100%;
}
.zam-app-signsearch .banner img{
    width: 100%;
}
.search-wrap {
    margin: 1.2rem 0.8rem 0.8rem;
}
.search-wrap .title{
    font-size: 0.4rem;
    color: #26aaf2;
}
.search-content{
    margin: 0.32rem 0;
    text-align: center;
}
input {
    -webkit-appearance: none;
    border-radius: 0;
    border: 0;
    color:#000;
}
.grid {
    border-bottom: 1px solid #E5E5E5;
    font-size: 0.28rem;
}
.grid .leftcol {
    width: 35%;
    color: #666;
    vertical-align: middle;
    height: 0.82rem;
}
.grid .rightcol {
    width: 65%;
    height: 0.82rem;
    vertical-align: middle;
}
.grid .rightcol input{
    height: 0.82rem;
    width: 100%;
}
.submit-btn{
    display: inline-block;
    border-radius: 0.12rem;
    background-color: #ff9a00;
    color: #fff;
    font-size: 0.32rem;
    text-align: center;
    padding: 0.16rem 1rem;
    margin-top: 1rem;
}
</style>
</head>
<body>
<section class="zam-app-signsearch g-scrollview">
    <div class="banner">
        <img src="/top.png" />
    </div>
	{if !empty($errmsg)}
        <div class="errmsg">{$errmsg}</div>
    {else /}
    <div class="search-wrap">
        <div class="title">个人信息查询</div>
        <div class="search-content">
            <div class="grid zam-app-flex">
                <div class="leftcol zam-app-flex-ajCenter">手机号码</div>
                <div class="rightcol">
                    <input type="text" placeholder="请输入手机号码" maxlength="11">
                </div>
            </div>
            <div class="submit-btn">立即查询</div>
        </div>
    </div>
    {/if}
</section>
</body>
<script>
var XCV3Config = {
    staticurl:"__STATIC__/",
    amconfig:{:json_encode(amconfig())},
    clienttype:"1",
};
require(['wechatcore'],function (wechatcore) {
    wechatcore.hidewxmenu();
    $(".submit-btn").click(function(){
        var $this = $(this),mobile = $('.search-content input').val()||'';
        if(mobile == ''){
            return wechatcore.showtopmsg('请输入手机号');
        }
        if(!mobile.match(/^[1][3,4,5,6,7,8,9][0-9]{9}$/)){
            return wechatcore.showtopmsg('手机号格式有误');
        }
        wechatcore.ajaxSubmit("{:gowechatspecial('sign/index',['hdid'=>$hdid])}",{mobile:mobile},'查询中...').then(function(json){
            if(json.code==0){
                window.location.href = "{:gowechatspecial('sign/result',['hdid'=>$hdid])}&mobile=" + mobile;
            }else{
                wechatcore.showtopmsg(json.msg);
            }
        }, function(){
            wechatcore.msg('网络太差，请稍后重试');
        });
    });
});  
</script>
