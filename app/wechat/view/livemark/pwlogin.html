{include file="common/header" /}
<style>
.g-flexview{min-width:100%;max-width:100%;{if empty($appconfig['appbgimg'])}background-color:#fff{/if}}
.pw-loginbox h3{
	margin-bottom: 1.22rem;
    color: #000;
    font-size: .56rem;
}
.pw-loginbox input{
	margin-bottom: .95rem;
    padding: 0 .4rem;
    width: 76vw;
    line-height: 2.56;
    height: .82rem;
    border: 1px solid #626262;
    border-radius: .4rem;
    color: #333;
    font-size: .32rem;
    background-color: #f2f2f2;
}
.pw-loginbox button{
	width: 68.5vw;
    height: .96rem;
    line-height: 2.4;
    font-size: .4rem;
    color: #fff;
    text-align: center;
    background-color: #0090ff;
    border-radius: .48rem;
	border:0;
}

</style>
<section class="g-flexview zam-app-flex-ajCenter2">
	<div class="pw-loginbox zam-app-flex-ajCenter">
		<h3>评委通道</h3>
		<input type="text" placeholder="请输入评委登录码">
		<button>进入评分</button>
	</div>
</section>
<script>
require(['wechatcore'],function (wechatcore) {
	$(".pw-loginbox button").on('click',function(){
		var pwcode = $(this).prev().val();
		wechatcore.ajaxSubmit("{:gowechat('livemarkpw/pwloginpost',['hdid'=>$hdinfo['hdid']])}",{pwcode:pwcode},'登录中..').then(function(json){
			if(json.code==0){
				wechatcore.msg('登录成功');
				setTimeout(function(){
					window.location.href = "{:gowechat('livemarkpw/index',['hdid'=>$hdinfo['hdid']])}";
				},3e2);
			}else{
				wechatcore.msg('登录码错误，登录失败');
			}
		}, function(){
			wechatcore.msg('网络太差，登录失败');
		});
	});
})
</script>
{include file="common/footer" /}
