{include file="common/header" /}
<style type="text/css">
.zam-app-payjoin{position: absolute;top:0;left:0;width: 100%;height: 100%;background-color: #f5f5f5;font-family: PingFang SC,miui,system-ui,-apple-system,BlinkMacSystemFont,Helvetica Neue,Helvetica,sans-serif;}
.zam-app-payjoin-content{width: 100%;height: 100%}
.payjoin-title{
	padding-left: 0.2rem;
    height: 0.6rem;
    line-height: 0.6rem;
    font-size: 0.28rem;
    color: #999;
    margin-top: 0.2rem;
    font-weight: 700;
}
.payjoin-daybox{
	padding: 0.2rem;
}
.payjoin-daybox ul{
	background: #fff;
	border-radius: 0.1rem;
	padding: 0.2rem;
}
.payjoin-daybox ul li{	
    width: 33%;
    margin-bottom: 0.28rem;
    -webkit-tap-highlight-color: rgba(255, 255, 255, 0) !important;
  -webkit-tap-highlight-color: transparent !important;
}
.payjoin-daybox ul li .day-one{
	position: relative;
	width: 2rem;
	height: 1.4rem;
	background: #f8f8f8;
    border: 1px solid #f8f8f8;
    border-radius: 0.1rem;
}
.payjoin-daybox ul li .day-one .name{
	font-size: 0.24rem;
	font-weight: 700;
}
.payjoin-daybox ul li .day-one .corner{
	position: absolute;
    bottom: -1px;
    right: -1px;
    border-bottom: 0.4rem solid {$appconfig['pagecolor']};
    border-left: 0.54rem solid transparent;
    display: none;
}
.payjoin-daybox ul li .day-one .corner i{
    position: absolute;
    bottom: -0.40rem;
    right: 0.02rem;
    color: #fff;
    font-weight: 500;
}
.payjoin-daybox ul li .day-one .discount{
	position: absolute;
    left: 0;
    top: 0;
    height: 0.29rem;
    line-height: .29rem;
    font-size: .18rem;
    color: #fff;
    text-align: center;
    width: 0.68rem;
    border-radius: 0.1rem 0 0.08rem 0;
    background:{$appconfig['pagecolor']};
}
.payjoin-daybox ul li .day-one .price{
	color:{$appconfig['pagecolor']};
	margin-top: 0.1rem;
	font-size: 0.24rem;
	font-weight: 700;
}
.payjoin-daybox ul li.active .day-one{
    border-color:{$appconfig['pagecolor']};
}
.payjoin-daybox ul li.active .day-one .corner{
   display: block;
}
.btn-primary{
	background: {$appconfig['pagecolor']};
}
.zam-app-bpopupFoot{
	display: none;
}
.zam-app-bpopupCloseBox i.zam-app-bpopupClose{color: #000;font-weight: 600}
.zam-app-bpopupBox .zam-app-bpopupMain{max-height: 86%;overflow: hidden;border-radius: 8px 8px 0 0}
.zam-app-bpopupBox .zam-app-bpopupMain .zam-app-bpopupTitle{border-color: {$appconfig['pagecolor']}}
.poppaybox{
	width: 100%;
}
.pay-content .pay-amount {
    margin-top: 12px;
    text-align: center;
    font-size: 36px;
    color: #1d1d1d;
    margin-bottom: 6px;
}
.pay-content .pay-amount .amount-priceinfo{
	position: relative;
}
.pay-content .pay-amount  .amount-oldprice{

}
.pay-content .pay-amount  .amount-oldprice .amount-discount{
	display: inline-block;
    height: 0.39rem;
    line-height: .39rem;
    font-size: .2rem;
    color: #fff;
    text-align: center;
    width: 0.68rem;
    border-radius: 0.1rem;
    background: {$appconfig['pagecolor']};
    margin-right: 0.2rem;
}
.pay-content .pay-amount .amount-oldprice .amount-oldmoney{
	color: gray;
    font-size: 16px;
    text-decoration: line-through;
}
.pay-content .pay-text {
    line-height: 20px;
    text-align: center;
    font-size: 14px;
    color: #999;
}
.paytipbox{
	margin:0.2rem 0;
	background: #fff;
	height: 0.82rem;
	line-height: 0.82rem;
	font-size: 0.26rem;
}
.paytipbox .tipbtn{
	color: {$appconfig['pagecolor']}
}
</style>
<script id="pay-tpl" type="text/html">
<div class="poppaybox">
	<div class="pay-content">
		<div class="pay-amount">
			<div class="amount-price">
				<span class="amount-money">￥<% d.discountprice %></span>
			</div>
			<%# if(d.discount >0){ %>
			<div class="amount-oldprice zam-app-flex-ajCenter2">
				<span class="amount-discount"><% d.discount %>折</span>
				<span class="amount-oldmoney">￥<% d.price %></span>
			</div>
			<%# } %>
		</div>
		<div class="pay-text">购买<span class="dest-amount"><% d.day %></span>天</div>
		<div class="btn btn-primary btn-block" style="margin-top: 0.2rem">确认支付</div>
		{if isset($appconfig['xieyiurl']) && !empty($appconfig['xieyiurl'])}
		<section class="paytipbox zam-app-flex zam-app-justifyCenter">支付即代表同意<a class="tipbtn" href="{$appconfig['xieyiurl']}">《<span>用户支付协议</span>》</a></section>
		{/if}
	</div>
</div>
</script>
<section class="zam-app-payjoin g-flexview">
<div class="payjoin-title">{$appconfig['pagetitle']}</div>
<section class="payjoin-daybox">
	<ul class="zam-app-flex zam-app-flex-wrap">
		{foreach $appconfig['days'] as $day}
		{if $day['status']=='1'}
		<li class="zam-app-flex-ajCenter" data-discount="{$day['discount']}" data-day="{$day['day']}" data-price="{$day['price']}">
			<div class="zam-app-flex-ajCenter day-one">
				{if $day['discount'] > 0}
				<div class="discount">{$day['discount']}折</div>
				{/if}
				<div class="name">{$day['name']}</div>
				<div class="price">￥{$day['price']}元</div>
				<div class="corner"><i class="mxc-check"></i></div>
			</div>
		</li>
		{/if}
		{/foreach}
	</ul>
	<div class="gopay">
		<a href="javascript:;" class="btn btn-block btn-disabled">确定</a>
	</div>
</section>
<script type="text/javascript">
require(['wechatcore'],function(wechatcore){
	$(".payjoin-daybox li").click(function(){
		var $this = $(this);
		$this.addClass('active').siblings().removeClass('active');
		$(".gopay .btn").removeClass('btn-disabled').addClass('btn-primary');
	});
	$(".gopay").on('click','.btn-primary',function(){
		var selbox = $(".payjoin-daybox ul li.active"),oldprice = selbox.attr('data-price'),discount = selbox.attr('data-discount'),orderinfo = {
			price:oldprice,
			discount:discount,
			day:selbox.attr('data-day'),
			discountprice:(discount > 0 ? (oldprice*(discount/10)).toFixed(2) : oldprice),
		}; 
		wechatcore.oneSlideBox({
			title:'支付',
			btnText:'',
			btnType:'btn-primary',
			html:wechatcore.tpl($("#pay-tpl"),orderinfo),
			ready:function(){
				var t = this;
		        t.popBoxfind(".btn").bind('click',function(){
			  		var ordernum = '';
			  		wechatcore.ajaxSubmit('/wechat/payjoin/index',{data:orderinfo},'正在提交订单...').then(function(json){
						if(json.code==0){
							t.popBoxclose();
							wechatcore.showWxpay(json.msg,function(res){
								wechatcore.msg('支付成功');
								setTimeout(function(){
									window.location.href = "{$targetUrl}"; 
								},2e3);
							},function(err){
								wechatcore.msg('您已取消支付');
							});
						}else if(json.code==1){
							t.popBoxclose();
							setTimeout(function(){
								wechatcore.reloadpage(json.msg);
							},1e3);
						}else if(json.code==3){
							(parent.wx||wx).miniProgram.navigateTo({'url':'/pages/minipay/index?orderdata=' + encodeURIComponent(JSON.stringify(json.msg))});
						}else{
							wechatcore.msg(json.msg);
						}
					}, function(){
						wechatcore.msg('支付失败，请稍后重试');
					});
				 });
			},
		});
	});
});
</script>
{include file="common/footer" /}
