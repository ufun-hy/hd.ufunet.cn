{include file="common/header" /}
<style>
.card-lists{
    padding:0 0.1rem;
}
.one-card{clear: both;width: 100%;padding-top: 0.24rem;}
.catename{
    width: 4.31rem;
    height: 0.88rem;
    line-height: 0.88rem;
    font-size: 0.32rem;
    color: #Fff;
    text-align: center;
    background-image: url(/{:WIMGURL}jika/namebg.png?t=1);
    background-size: cover;
    background-repeat: no-repeat;
}
.card-item{padding:0;}
.card-item .list-item{position:relative;padding:0.1rem;margin:0;}
.list-theme1 .list-item {width: 33%;}
.list-img {
    width: 100%;
    height: 100%;
    padding: 0;
    overflow: hidden;
}
.list-img img {
    width: 100%;
    height: 3.5rem;
    margin-top: 0;
    background-color: #FFF;
    border: none;
}
.card-item .list-mes .list-title{height:0.6rem!important;line-height:0.6rem!important;text-align:center!important;font-size:0.3rem}
.card-item .list-mes .list-title span{display: inline-block;font-siz2:0.32rem;margin:0 0.2rem;color:red;}
.list-mes-item a{height:0.6rem;line-height:0.6rem;margin:0.1rem auto;padding:0 0.3rem;}
.list-number{
    position:absolute;
    top:0.1rem;
    left:0.1rem;
}
</style>
<section class="g-scrollview card-lists">
{volist name="cates" id="cate"}
<div class="one-card">
    <div class="catename">{$cate['catename']}</div>
    <div class="list-theme1 card-item">
    {volist name="cate.cards" id="card" key="key"}
    <div class="list-item">
        <div class="list-img">
            <img src="{if $card['getnum'] > 0}{:tomedia($card['cardimg'])}{else}{:tomedia($card['waitcardimg'])}{/if}">
        </div>
        <div class="list-mes">
            <h3 class="list-title">{$card['cardname']}</h3>
            <h3 class="list-title">已收集<span>{$card['getnum']}</span>块</h3>
        </div>
        <div class="list-number"><span class="badge badge-radius badge-primary">{$key}</span></div>
    </div>
    {/volist}
    </div>
</div>
{/volist}
</section>
<script>
</script>
{include file="common/footer" /}
