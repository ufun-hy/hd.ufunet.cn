{include file="common/header" /}
<style>
.box {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    padding:0;
    margin: 0;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}
.box img{
   width: 4.82rem
}
.box .tip{
	display: inline-block;
    height: 0.6rem;
    line-height: 0.6rem;
    border-radius: 4px;
    font-size: 0.32rem;
    color: #fff;
    padding: 0 0.2rem;
    background-color: rgba(0,0,0,0.4);
}
.imgbox{
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    padding:0;
    margin: 0;
    background-repeat: no-repeat;
    background-size: 100% 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background-color: rgba(0,0,0,0.7);
}
.imgbox.show{display:flex!important}
.imgbox .cardbox{
	width: 5.4rem;
	height:8.3rem;
	background-image: url(/{:WIMGURL}jika/cardbg.png);
	background-size: cover;
	background-repeat: no-repeat;
	visibility: hidden
}
.imgbox .cardbox.show{
	visibility: visible;
    -webkit-animation:rotatebigtosmall 0.8s ease-out;
    animation:rotatebigtosmall 0.8s ease-out;
}
.imgbox .cardbox div{
	width: 4rem;
    margin: 0 auto;
    height: 5rem;
    margin-top: 2.8rem;
}
.imgbox .cardbox img{
	max-height: 100%;
}
.imgbox .lookcard{
	width: 4.82rem;
	height: 1.38rem;
	background-image: url(/{:WIMGURL}jika/look.png);
	background-size: cover;
	background-repeat: no-repeat;
	display: none;
}
@keyframes rotatebigtosmall {
0% {
	transform:rotate(0deg) scale(0)
}
10% {
	transform:rotate(36deg) scale(0.1)
}
20% {
	transform:rotate(72deg) scale(0.2)
}
30% {
	transform:rotate(108deg) scale(0.3)
}
40% {
	transform:rotate(144deg) scale(0.4)
}
50% {
	transform:rotate(180deg) scale(0.5)
}
60% {
	transform:rotate(216deg) scale(0.6)
}
70% {
	transform:rotate(252deg) scale(0.7)
}
80% {
	transform:rotate(288deg) scale(0.8)
}
90% {
	transform:rotate(324deg) scale(0.9)
}
100% {
	transform:rotate(360deg) scale(1)
}
}
@-webkit-keyframes rotatebigtosmall {
0% {
	-webkit-transform:rotate(0deg) scale(0)
}
10% {
	-webkit-transform:rotate(36deg) scale(0.1)
}
20% {
	-webkit-transform:rotate(72deg) scale(0.2)
}
30% {
	-webkit-transform:rotate(108deg) scale(0.3)
}
40% {
	-webkit-transform:rotate(144deg) scale(0.4)
}
50% {
	-webkit-transform:rotate(180deg) scale(0.5)
}
60% {
	-webkit-transform:rotate(216deg) scale(0.6)
}
70% {
	-webkit-transform:rotate(252deg) scale(0.7)
}
80% {
	-webkit-transform:rotate(288deg) scale(0.8)
}
90% {
	-webkit-transform:rotate(324deg) scale(0.9)
}
100% {
	-webkit-transform:rotate(360deg) scale(1)
}
}
.myrecord{
    position:absolute;
    top:0.3rem;
    right:0.3rem;
    width: 1rem;
	height: 1rem;
	border-radius: 50%;
	background-size: cover;
	background-repeat: no-repeat;
	background-image: url("{:tomedia($appconfig['hiscardbtn'])}");
}
</style>
<div class="box">
    <img src="/{:WIMGURL}jika/get.png" />
</div>
<a href="{:gowechat('jika/mycard',['hdid'=>$hdinfo['hdid']])}" class="myrecord"></a>
<div class="imgbox">
	<div class="cardbox">
		<div><img /></div>
	</div>
	<a class="lookcard" href="{:gowechat('jika/mycard',['hdid'=>$hdinfo['hdid']])}"></a>
</div>
<script>
var arr = ['bounceInDown','bounceInLeft','bounceInUp','bounceInRight'];
var key = Math.floor(Math.random()*arr.length);
var cates = {:json_encode($cates)};
require(['wechatcore'],function(wechatcore){
	if(cates.length==0){
        wechatcore.msg('请先添加卡包');
    }else{
        var oneimg = cates[Math.floor(Math.random()*cates.length)];
        $(".box").css("background-image","url('"+oneimg.cateimg+"')");
        $(".box img").show().addClass(arr[key]+' animated');
    }
    $(".box img").click(function(){
    	$(this).fadeOut();
    	wechatcore.ajaxSubmit("{:gowechat('jika/getonecard')}",{cateid:oneimg.id}).then(function(data){
			if(data.code==0){
				$(".imgbox img").attr('src',data.msg);
				$(".imgbox").addClass('show');
		    	$(".imgbox .cardbox").addClass('show').one('webkitAnimationEnd mozAnimationEnd MSAnimationEnd oanimationend animationend', function () {
		    	 	$(".imgbox .lookcard").fadeIn()
				});
			}else{
				$(".box").html('<span class="tip">'+data.msg+'</span>');
				wechatcore.msg(data.msg);
			}
		}, function(){
			wechatcore.msg('网络太差，请稍后重试');
		});
    });

});
</script>
{include file="common/footer" /}
