{if isset($appconfig['appbdxieyi']) && !empty($appconfig['appbdxieyi']) && $appconfig['appbdxieyi']['open']=='1'}
<style type="text/css">
/*协议*/
.xieyibox{float: left;font-size: 0.26rem;}
.xieyibox .cell-right{position:relative;min-height:auto;display: inline-block;padding: 0;border: 0;outline: 0}
.xieyibox .cell-right i,.xieyibox .cell-right i:after{font-size: 0.44rem!important;border: 0 ;outline: 0}
.xieyibox .agreespan{display: inline-block;margin-left:0.1rem}
.xieyibox .btn-xieyi{color: #00aeff;}
.xieyibox input{
	position: absolute;
    left: 0!important;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1
}
.warnbox {
    position: fixed;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    background: rgba(0,0,0,0.5);
}
.warnbox .warncontent {
    width: 92%;
    height: 12rem;
    padding: 0 0.2rem;
    background: #F5F5F5;
    border-radius: 5px;
    box-sizing: border-box;
}
.warnbox .warncontent .warntitle{
	height: 1rem;
    line-height: 1rem;
	font-size: 0.32rem;
	font-weight:bold;
	text-align: center;
}
.warnbox .warncontent .warndes{height: calc(100% - 1.8rem);}
.warnbox .warnclose {
    height: .8rem;
    line-height: 0.8rem;
    color: #333;
    text-align: center;
    font-size: 0.32rem;
    letter-spacing: 2px;
    font-weight:bold;
}
/*识别二维码*/
.h5-touchimg{
	position: fixed;
	opacity: 0;
	z-index: -1;
	display: none;
	user-drag:none;
	-webkit-user-drag: none;
}
</style>
<div class="warnbox zam-app-flex-ajCenter hidden">
	<div class="warncontent">
		<div class="warntitle">{$appconfig['appbdxieyi']['name']}</div>
		<div class="warndes">
			<iframe id="myframe" sandbox="allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts allow-modals allow-top-navigation" scrolling="yes" frameborder="0" width="100%" height="100%" src=""></iframe>
		</div>
		<div class="warnclose" onclick="javascript:$('.warnbox').addClass('hidden');">关闭</div>
	</div>
</div>
<img class="h5-touchimg" />
<script type="text/javascript">
$(function(){
	$(".btn-xieyi").click(function(){
		if($('#myframe').attr('src')=='') $('#myframe').attr('src',"{:$appconfig['appbdxieyi']['url']}");
		$('.warnbox').removeClass('hidden');
	});
})
window.addEventListener('message',function(e){
	if(typeof(e.data.msg) != "undefined"){
		if(typeof(e.data.msg.module) != "undefined" && e.data.msg.module=='h5-touchimg'){
			var dmodule = e.data.msg.module,$dataUrl = e.data.msg.url;
			if($dataUrl==''){
				$(".h5-touchimg").attr('src','');
				$(".h5-touchimg").css({display:'none',zIndex:'-1'});
			}else{
	            var iframe = document.getElementById("myframe");
	            $(".h5-touchimg").attr('src',$dataUrl);
	            $(".h5-touchimg").css({
	            	display:'block',
	            	top:(e.data.msg.top + iframe.getBoundingClientRect().y)+'px',
	            	left:(e.data.msg.left + iframe.getBoundingClientRect().x)+'px',
	            	width:e.data.msg.width+'px',
	            	height:e.data.msg.height+'px',
	            	zIndex:'10',
	            });
			}
		}
	}
});
</script>
{/if}
