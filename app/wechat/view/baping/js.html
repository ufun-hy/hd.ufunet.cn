<script type="text/javascript">
require(['wechatcore','bscroll','marqueen','swiper','emojicore','appsocket','videojs','bubbleHearts','sweetalert'],function (wechatcore,BScroll,marqueen,Swiper,emojicore,appsocket,videojs,BubbleHearts) {
		var bsconfig = {click: true,pullDownRefresh:{threshold:10,stop:20}},firstload = false;
		if(wechatcore.ios134over()) bsconfig.useTransition = false;
		var Scroll = new BScroll($('.zam-app-msg-scroll')[0],bsconfig),maxid = 0,scrollhasmore = true,wsConfig = {};
		wechatcore.ajaxSubmit('/wechat/baping/loadhistory',{maxid:maxid},'正在加载历史消息...').then(function(data){
			firstload = true;
			if(data.code==0){
				var pagedata = data.msg;
				if(pagedata.length > 0 ){
					 pagedata = pagedata.reverse();
					 maxid = pagedata[0].id;
					 var firstHtml = '';
					 $.each(pagedata,function(index,value){
						 if(value.type=='1') value.content = emojicore.emoToimg(value.content.toString());
						 value.ismanager = XCV3Config.ismanager;
						 firstHtml += wechatcore.tpl($("#msg-tpl"),value);
					 });
					 $(".zam-app-msglist").html(firstHtml);
					 wechatcore.waitImgLoad(function(){
						 Scroll.refresh(),Scroll.scrollTo(0,Scroll.maxScrollY,300);
					 });
				}else{
					scrollhasmore = false;
					$(".zam-pulldown-box .pulldownOver").html('<i class="mxc-infofill"></i>已加载全部');
					$(".zam-pulldown-box .pulldownTxt").html('<i class="mxc-infofill"></i>已加载全部');
				}
			}else{
				wechatcore.msg(data.msg);
			}
		}, function(){
			  firstload = true;
			  wechatcore.msg('加载历史数据失败，请稍后重试');
		});
		setTimeout(function(){
			firstload = false;
		},4e3);
		wsConfig.onmessage = function(data){
			if(data.type=='connected'){
				appsocket.isclose = false;
				wechatcore.connectsocket({clientid:data.clientid});
				if(!firstload){
					maxid = 0;
					scrollhasmore = true;
					$(".zam-pulldown-box").html('<div class="pulldownOver"><i class="mxc-roundcheck"></i>加载完成</div><div class="pulldownRefresh"><div class="pulldownRefresh-loading"></div></div><span class="pulldownTxt"><i class="mxc-refresharrow"></i>下拉加载，释放刷新</span>');
					wechatcore.ajaxSubmit('/wechat/baping/loadhistory',{maxid:maxid},'正在加载历史消息...').then(function(data){
						if(data.code==0){
							var pagedata = data.msg;
							if(pagedata.length > 0 ){
								 pagedata = pagedata.reverse();
								 maxid = pagedata[0].id;
								 var firstHtml = '';
								 $.each(pagedata,function(index,value){
									 if(value.type=='1') value.content = emojicore.emoToimg(value.content.toString());
									 value.ismanager = XCV3Config.ismanager;
									 firstHtml += wechatcore.tpl($("#msg-tpl"),value);
								 });
								 $(".zam-app-msglist").html(firstHtml);
								 wechatcore.waitImgLoad(function(){
									 Scroll.refresh(),Scroll.scrollTo(0,Scroll.maxScrollY,300);
								 });
							}else{
								scrollhasmore = false;
								$(".zam-pulldown-box .pulldownOver").html('<i class="mxc-infofill"></i>已加载全部');
								$(".zam-pulldown-box .pulldownTxt").html('<i class="mxc-infofill"></i>已加载全部');
							}
						}else{
							wechatcore.msg(data.msg);
						}
					}, function(){
						  wechatcore.msg('加载历史数据失败，请稍后重试');
					});
				}
			}else{
				if(data.type=='delbp'){
					if(!$.isArray(data.msgid)){
						$(".appmsg-"+data.msgid).remove();
					}else{
						$.each(data.msgid,function(index,val){
							$(".appmsg-"+val).remove();
						});
					}
				}else if(data.type=='bpreset' || (data.type=='screenresetdm' && data.fromtype=='2')){
					$(".zam-app-msglist").empty();
					Scroll.refresh();
					scrollhasmore = false;
					$(".zam-pulldown-box .pulldownOver").html('<i class="mxc-infofill"></i>已加载全部');
					$(".zam-pulldown-box .pulldownTxt").html('<i class="mxc-infofill"></i>已加载全部');
				}else if(data.type=='join'){
					basicConfig.appjointip=='1' && wechatcore.newjoin(data.nickname);
				}else if(data.type=='bpshenhe'){
					var messages = data.messages;
					if($.isArray(messages)&&messages.length>0){
						$.each(messages,function(i, val){
							if($(".appmsg-"+val.id).length<=0){
								if(val.type=='1'){
									val.content = emojicore.emoToimg(val.content);
								}
								val.ismanager = XCV3Config.ismanager;
								$(".zam-app-msglist").append(wechatcore.tpl($("#msg-tpl"),val));
							}
						});
						wechatcore.waitImgLoad(function(){
							Scroll.refresh(),Scroll.scrollTo(0,Scroll.maxScrollY,300);
						});
					}
				}else if(data.type=='addblack'){
						data.userid==XCV3Config.userid&&wechatcore.closewxwindow();
				}else if(data.type=='addmanager'){
					data.userid==XCV3Config.userid&&wechatcore.reloadpage();
				}else if(data.type=='addestoppel'){
					if(data.userid==XCV3Config.userid) {
						if(data.status=='1'){
							addestoppel();
						}else{
							removeestoppel();
						}
					}
				}else if(data.type=='bapingfullestoppel'){
					if(data.status=='1'){
						fulladdestoppel();
					}else{
						fullremoveestoppel();
					}
				}else if(data.type=='1'||data.type=='2'||data.type=='3'||data.type=='4'||data.type=='5'||data.type=='6'){
					if(data.isreshow=='1' || $(".appmsg-"+data.id).length>0) return;
					if(data.type=='1'){
						data.content = emojicore.emoToimg(data.content);
					}
					data.ismanager = XCV3Config.ismanager;
					$(".zam-app-msglist").append(wechatcore.tpl($("#msg-tpl"),data));
					wechatcore.waitImgLoad(function(){
						Scroll.refresh(),Scroll.scrollTo(0,Scroll.maxScrollY,300);
					});
				}else if(data.type=='sendchatmsg'){
					if(data.hdid==XCV3Config.hdid && data.topenid==XCV3Config.openid){
						wechatcore.ajaxSubmit('/wechat/baping/loadmyunread',{}).then(function(json){
							if(json.code==0){
								$(".jiaoyou-lefticon").length>0&&$(".jiaoyou-lefticon span").text(json.msg);
							}
						}, function(){
						});
					}
				}else if(data.type=='goto'){
					wechatcore.goto(data);
				}else if(data.type=='luckeruserids'){
					wechatcore.layerAsklucker(data);
				}else if(data.type=='confirmwxtxopenid'){
					if(data.userid==XCV3Config.userid){
						wechatcore.msg('授权成功');
						setTimeout(function(){
							window.location.reload();
						},1e3);
					}
				}
			}
		};
		
		appsocket.init(wsConfig);
		if(basicConfig.shownotice=='1'){
			marqueen.init('.zam-app-topNotice-txt');
			$(".zam-app-topNotice-close i").on('click',function(){
				var $this = $(this),$parentNode = $this.parent().parent();
				marqueen.destory();
				$parentNode.animate({
				"margin-top":-$parentNode.height(),
				},2e2,function(){
					$this.remove();
					$(".zam-app-msg-box .zam-app-msg-scroll").addClass('scrollnotop');
					Scroll.refresh();
				});
			});
		}
		Scroll.on('pullingDown', function () {
			if(!scrollhasmore) {
				return Scroll.finishPullDown()&&Scroll.refresh();
			}
			$(".zam-pulldown-box .pulldownTxt").hide();
			$(".zam-pulldown-box .pulldownRefresh").fadeIn();
			wechatcore.ajaxSubmit('/wechat/baping/loadhistory',{maxid:maxid},false).then(function(data){
				if(data.code==0){
					var nextpagedata = data.msg;
					setTimeout(function(){
					 if(nextpagedata.length>0){
						nextpagedata = nextpagedata.reverse();
						maxid = nextpagedata[0].id;
						var prevHtml = '';
						$.each(nextpagedata,function(index,value){
							 if(value.type=='1') value.content = emojicore.emoToimg(value.content.toString());
							 value.ismanager = XCV3Config.ismanager;
							 prevHtml += wechatcore.tpl($("#msg-tpl"),value);
						});
						$(".zam-app-msglist").prepend(prevHtml);
					 }else{
						scrollhasmore = false;
						$(".zam-pulldown-box .pulldownOver").html('<i class="mxc-infofill"></i>已加载全部');
						$(".zam-pulldown-box .pulldownTxt").html('<i class="mxc-infofill"></i>已加载全部');
					 }
					 $(".zam-pulldown-box .pulldownRefresh").hide();
					 $(".zam-pulldown-box .pulldownOver").fadeIn();
					 setTimeout(function(){
						$(".zam-pulldown-box .pulldownOver").fadeOut(function(){
							Scroll.finishPullDown(),Scroll.refresh();
							setTimeout(function(){
								$(".zam-pulldown-box .pulldownTxt").show();
							},200);
						});
					 },1000);
					},1000);
				}else{
					wechatcore.msg(data.msg);
				}
			}, function(){
				wechatcore.msg('网络太差，请稍后重试');
				$(".zam-pulldown-box .pulldownOver").fadeOut(function(){
					Scroll.finishPullDown();
					Scroll.refresh();
					setTimeout(function(){
						$(".zam-pulldown-box .pulldownTxt").show();
					},200);
				});
			});
		});
		Scroll.on('scroll', function (pos) {
			$(".zam-pulldown-box").css("top",Math.min(pos.y,10));
		});
		//目前已经发现ios17.2.1输入法没有缩回去无法点击发送按钮
		if(wechatcore.ios12over() && !wechatcore.ios17over() && XCV3Config.clienttype=='1'){
			$("body").on('blur','input,select,textarea', function () {
				setTimeout(function () {
					window.scrollTo(0, 0);
				},300)
			});
			$(".bapingfooter-inputbox").on('focus', 'input', function(e){
				setTimeout(function () {
					$(document).scrollTop($("body").innerHeight()),this.scrollIntoView(true);
				},300)
			});
		}
		var zhutiswiper = null,bptimeswiper = null;
		$(".zam-app-bapingfooter-navs .bp-lefticon").on('click',function(){
			  $('.zam-app-facebox,.zam-app-controlbox').addClass('zam-app-displaynone');
			  wechatcore.ajaxSubmit('/wechat/baping/ajaxbptheme',{},'加载数据中..').then(function(json){
				if(json.code==0){
					var freetimes = json.msg.freetimes,cardpay = json.msg.cardpay||'2';
					var btnText = freetimes > 0 ? '免费霸屏('+freetimes+'次)' : '立即霸屏';
					if(cardpay=='1'){
						btnText = [
							{'class':'btn-primary',txt:(freetimes > 0 ? '免费霸屏('+freetimes+'次)' : '微信支付'),type:'1'},
							{'class':'btn-warning',txt:'券号支付',type:'2'},
						];
					}
					wechatcore.oneSlideBox({
						title:'霸屏',
						classname:'bppopBox',
						btnText:btnText,
						btnType:'btn-primary',
						html:wechatcore.tpl($("#bp-tpl"),{zhutiType:json.msg.bpzhuti,timeType:json.msg.bptimes}),
						ready:function(){
							var t = this;
							zhutiswiper = new Swiper('.zhuti-slider',{
								pagination: {
									el: '.zhuti-page',
								},
								watchOverflow: true,
							});
							bptimeswiper = new Swiper('.bptime-slider',{
								pagination: {
									el: '.bptime-page',
								},
								watchOverflow: true,
							});
							t.popBoxfind(".bpZhutiBox .bpZhutiItem").bind('click',function(){
									t.popBoxfind(".bpZhutiBox .bpZhutiItem").removeClass('sel');
									var $this = $(this);
									$this.addClass('sel');
									t.popBoxfind(".bpTimeBox .bpTimeItem").removeClass('sel');
									var themeonetimebox = $(".bpTimeBox .bpTimeItem").filter(function(o, i) {
										return $(i).attr("data-time") >= $this.attr('data-mintime');
									});
									if(themeonetimebox.length > 0){
										themeonetimebox.eq(0).trigger('click');
									}
							});
							t.popBoxfind(".bpTimeBox .bpTimeItem").bind('click',function(){
									var $this = $(this);
									if(t.popBoxfind(".bpZhutiBox .sel").length<=0) return wechatcore.msg('请先选择霸屏主题');
									var thistime = parseInt($this.attr('data-time'));
									var minseconds = parseInt(t.popBoxfind(".bpZhutiBox .sel").attr('data-mintime'));
									if(thistime<minseconds){
										return wechatcore.msg(t.popBoxfind(".bpZhutiBox .sel .bpZhutiName").text()+'，霸屏时间至少是'+minseconds+'秒');
									}
									t.popBoxfind(".bpTimeBox .bpTimeItem").removeClass('sel');
									t.popBoxfind('.bpcanimgnum span').text($this.attr('data-imgnum'));
									$this.addClass('sel');
									var maxup = parseInt($this.attr('data-imgnum'));
									var imgNum = t.popBoxfind(".had-uploadimg").length;
									if(imgNum<maxup){
										t.popBoxfind(".bpImgBox .bpAddpicorvideo").removeClass('hidden');	
									}else{
										var gtdel =  maxup-1;
										t.popBoxfind(".had-uploadimg:gt("+gtdel+")").remove();
										t.popBoxfind(".bpImgBox .bpAddpicorvideo").addClass('hidden');
									}
									t.popBoxfind(".had-uploadvideo").length>0&&t.popBoxfind(".bpImgBox .bpAddpicorvideo").addClass('hidden');
							});
							t.popBoxfind(".bpZhutiBox .bpZhutiItem").eq(0).trigger('click');
							t.popBoxfind(".bpAddpicorvideo").bind('click',function(){
								if(t.popBoxfind(".bpTimeBox .sel").length<=0) return wechatcore.msg('请选择霸屏时间');
								var maxup = parseInt(t.popBoxfind(".bpTimeBox .sel").attr('data-imgnum')),imgupcount = t.popBoxfind(".had-uploadimg").length;
								if(imgupcount > 0){
									var maxnum = maxup - imgupcount;
									wechatcore.uploadImg({posturl:'/wechat/baping/upload',type:'baping',maxnum:maxnum,txt:'最多可上传'+maxnum+'张图片'},function(data){
										if(data.code==0){
											t.popBoxfind(".bpAddpicorvideo").before(wechatcore.tpl($("#upimg-tpl"),{img:data.msg.filesrc,filepath:data.msg.filepath}));
											var imgNum = t.popBoxfind(".had-uploadimg").length;
											if(imgNum >= maxup){
												t.popBoxfind(".bpImgBox .bpAddpicorvideo").addClass('hidden');
											}
										}else{
											wechatcore.msg(data.msg);
										}
									});
								}else if(t.popBoxfind(".had-uploadvideo").length>0){
									return wechatcore.msg('仅可上传一个小视频');
								}else{
									if(basicConfig.bpuploadvideo=='1'){
										t.popBoxfind('.bpUploadBox .videoItem').each(function(i,v){
											$(v).find('input').remove();
											if(i==0){							
												$(v).append('<input type="file" style="opacity: 0; position: absolute; top: 0px; left: 0px; width: 100%; height: 100%;" accept="video/*" capture="camcorder">');
											}else{
												$(v).append('<input type="file" style="opacity: 0; position: absolute; top: 0px; left: 0px; width: 100%; height: 100%;" accept="video/*">');
											}
										});
										if(XCV3Config.isiframe){
											$(".zam-app-sendBpBox").css('position','relative');
											$(".zam-app-sendBpBox .bpUploadBox").css('position','absolute');
										}
										t.popBoxfind('.bpUploadBox').show();
									}else{
										wechatcore.uploadImg({posturl:'/wechat/baping/upload',type:'baping',maxnum:maxup,txt:'最多可上传'+maxup+'张图片'},function(data){
											if(data.code==0){
												t.popBoxfind(".bpAddpicorvideo").before(wechatcore.tpl($("#upimg-tpl"),{img:data.msg.filesrc,filepath:data.msg.filepath}));
												var imgNum = t.popBoxfind(".had-uploadimg").length;
												if(imgNum>=maxup){
													t.popBoxfind(".bpImgBox .bpAddpicorvideo").addClass('hidden');
												}
											}else{
												wechatcore.msg(data.msg);
											}
										});
									}
								}
							});
							t.popBoxfind('.typeItemCover').bind('click',function(e){
								e.preventDefault();
								e.stopPropagation();
								t.popBoxfind('.bpUploadBox').hide();
							});
							t.popBoxfind('.bpUploadBox .picItem').bind('click',function(event){
								if(appsocket.isclose) return;
								var maxup = parseInt(t.popBoxfind(".bpTimeBox .sel").attr('data-imgnum')),imgupcount = t.popBoxfind(".had-uploadimg").length;;
								t.popBoxfind('.typeItemCover').trigger('click');
								var maxnum = maxup - imgupcount;
								wechatcore.uploadImg({posturl:'/wechat/baping/upload',type:'baping',maxnum:maxnum,txt:'最多可上传'+maxnum+'张图片'},function(data){
									if(data.code==0){
										t.popBoxfind(".bpAddpicorvideo").before(wechatcore.tpl($("#upimg-tpl"),{img:data.msg.filesrc,filepath:data.msg.filepath}));
										var imgNum = t.popBoxfind(".had-uploadimg").length;
										if(imgNum>=maxup){
											t.popBoxfind(".bpImgBox .bpAddpicorvideo").addClass('hidden');
										}
									}else{
										wechatcore.msg(data.msg);
									}
								});
							});
							t.popBoxfind('.bpUploadBox .videoItem').on('change','input',function(event){
								if(appsocket.isclose) return;
								wechatcore.uploadVideo({files:this.files,posturl:'/wechat/baping/uploadvideo',type:'baping'},function(data){
									if(data.code==0){
										$(".bpAddpicorvideo").before(wechatcore.tpl($("#upimg-tpl"),{img:data.msg.filesrc+'.jpg',video:data.msg.filepath}));
										$(".bpImgBox .bpAddpicorvideo").addClass('hidden');
									}else{
										wechatcore.msg(data.msg);
									}
								});
							});
							t.popBoxfind('.bpImgBox').on('click','.delupimg',function(event){
								var $this = $(this);
								var maxup = parseInt(t.popBoxfind(".bpTimeBox .sel").attr('data-imgnum'));
								var type = $this.parent().parent().hasClass('had-uploadimg');
								wechatcore.ask('警告','确定要删除此'+(type?'图片':'视频')+'么?',['确定','取消'],function(index){
									wechatcore.close(index);
									$this.parent().parent().remove();
									if(type){
										var imgNum = t.popBoxfind(".had-uploadimg").length;
										if(t.popBoxfind(".bpTimeBox .sel").length>0&&imgNum<maxup&&t.popBoxfind(".bpImgBox .bpAddpicorvideo").hasClass('hidden')){
											t.popBoxfind(".bpImgBox .bpAddpicorvideo").removeClass('hidden');	
										}
									}else{
										t.popBoxfind(".bpImgBox .bpAddpicorvideo").removeClass('hidden');
									}
								});
							});
						},
						click:function(clickType){
							  var t = this,selzhuti = t.popBoxfind(".zhuti-slider .sel"),selbptime = t.popBoxfind(".bptime-slider .sel"),bptxt = t.popBoxfind("textarea").val(),bpimg = t.popBoxfind(".had-uploadimg"),bpvideo = t.popBoxfind(".had-uploadvideo");
							  if(selzhuti.length<=0){
								return wechatcore.msg('请选择霸屏主题');
							  }
							  if(selbptime.length<=0){
								return wechatcore.msg('请选择霸屏时间');
							  }
							  if(bpimg.length<=0 && bpvideo.length<=0 && bptxt==''){
								return wechatcore.msg('请设置霸屏文字或上传霸屏图片或视频');
							  }
							  var bpdata = {
							  	bpid:selzhuti.attr('data-index'),
							  	fee:selbptime.attr('data-fee'),
							  	bptime: selbptime.attr('data-time'),
							  	bptxt:bptxt,
							  	iswxprogram:XCV3Config.isminiProgram,
							  };
							  var bpimgs = [];
							  if(bpimg.length > 0 ){
								bpimg.each(function(){
									bpimgs.push($(this).find('img').attr('data-filepath'));
								})
							  }
							  bpdata.bpimgs = bpimgs;
							  if(bpvideo.length > 0 ){
								bpdata.bpvideo = {
									video:bpvideo.attr('data-video'),
									pic:bpvideo.attr('data-video')+'.jpg',
								};
							  }
							  if(clickType == '1'){
								  	wechatcore.ajaxSubmit('/wechat/baping/sendbp',bpdata,'正在发起支付..').then(function(json){
										if(json.code==0){
										   wechatcore.showWxpay(json.msg,function(){
												t.popBoxclose();
												wechatcore.msg('支付成功');
										   },function(){
												wechatcore.msg('您已取消支付');
										   });
										}else if(json.code==1){
											t.popBoxclose();
											wechatcore.reloadpage(json.msg);
										}else if(json.code==2){
											t.popBoxclose();
											wechatcore.msg('免费霸屏成功');
										}else if(json.code==3){
											t.popBoxclose();
											(parent.wx||wx).miniProgram.navigateTo({'url':'/pages/minipay/index?orderdata=' + encodeURIComponent(JSON.stringify(json.msg))});
										}else{
											wechatcore.msg(json.msg);
										}
								  	}, function(){
										wechatcore.msg('网络太差,霸屏失败');
								  	});
							}else{
								swal({   
									title: "请输入霸屏券号",
								    text: "",
									type: "input",   
									showCancelButton: true,   
									closeOnConfirm: false,
									confirmButtonColor: "#00aeff",
									inputPlaceholder: "请输入霸屏券号" 
								}, function(inputValue){   
									if (inputValue === false) return false;
									if (inputValue === "") {
										swal.showInputError("请输入霸屏券号!");     
										return false;
									}
									inputValue = inputValue.replace(/\s/g,"");
									if (inputValue === "") {
										swal.showInputError("请输入霸屏券号!");     
										return false;
									}

			if(zanimgs.length > 0){
				zanimgs.forEach(function(src, index) {

						 var img = new Image;
						 img.onload = resolve.bind(null, img);

					 });

					 heartimages = images;
					 heartloaded = true;
					 heartstage = new BubbleHearts();
					 var canvas = heartstage.canvas;
					 var w = $(".zan-lefticon").width()*3,h = $(".zan-lefticon").height()*6;
					 canvas.width = w;
					 canvas.height = h;
					 canvas.style['width'] = w+'px';
					 canvas.style['height'] = h+'px';
					 $(".zan-lefticon").append(canvas);
				},function(error){
					console.log(error);
				});
			}
		}
