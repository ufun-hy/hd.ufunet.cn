<style type="text/css">
.loadadvbox{
	position: fixed;
	top: 0;
	left: 0;
	height: 100%;
	width: 100%;
	background-color: #fff;
	z-index: 99999999;
}
.loadadvbox .loadadv-iconbox{
	width: 30px;
	height: 30px;
}
.loadadvbox .loadadv-icon{
	width: 100%;
    height: 100%;
    margin: 0 auto;
    border: 2px solid #999;
    border-radius: 50%;
    border-left-color: transparent;
    border-right-color: transparent;
    animation: cssload-spin .4s infinite linear;
    -webkit-animation: cssload-spin .4s infinite linear;
}
@keyframes cssload-spin{100%{transform:rotate(360deg);transform:rotate(360deg)}}
.advbox{
	position: fixed;
	top: 0;
	left: 0;
    width: 100%;
    height: 100%;
	z-index: 99999999;
	transform: scale(1);
    -webkit-transform: scale(1); 
}
.advboxani {
    animation: scales 1.5s ease;
    -webkit-animation: scales 1.5s ease;
}
@keyframes scales {
    from {
        transform: scale(1.2);
    }

    to {
        transform: scale(1);
    }
}
.advboxanihide {
    animation: scalehide 1s ease;
    -webkit-animation: scalehide 1s ease;
}
@keyframes scalehide {
    from {
      opacity: 1
    }
    to {
      opacity: 0
    }
}
.advbox .scrollbox{
    position: relative;
    width: 100%;
    height: 100%;
    background: #fff;
    overflow-x: hidden;
    overflow-y: auto;
}
.advbox .scrollbox .advimg{
    width: 100%;
    height: auto;
}
.advbox .advinfobox{
    position: absolute;
    top:0;
    left:0;
    display: none;
}
.advbox .advinfobox .advdjsbox{
    position: fixed;
    top: 0.52rem;
    right: 0;
    height: 0.72rem;
    line-height: 0.72rem;
    background-color: rgba(0,0,0,0.5);
    color: #fff;
    border-top-left-radius:8px;
    border-bottom-left-radius:8px;
    padding: 0 0.2rem;
    font-size: 0.32rem;
}
.advbox .advinfobox .advdjsbox .advseconds{margin-right: 0.1rem;text-align: center;}
.advbox .advinfobox .advclose{
    position: fixed;
    bottom: 0.4rem;
    right: 0.24rem;
    height: 0.72rem;
    line-height: 0.72rem;
    background-color: rgba(0,0,0,0.42);
    color: #fff;
    border-radius: 0.36rem;
    padding: 0 0.42rem;
    font-size: 0.32rem;
    letter-spacing: 2px;
    z-index: 1;
}
</style>
<script type="text/javascript">
var liveadvconfig = {:json_encode($appconfig['liveconfig']['advconfig'])},advskep = {$appconfig['liveconfig']['advconfig']['skep']??'2'},advdjstimer = null;
if(liveadvconfig.open=='1'){
     $("body").append(`
        <section class="loadadvbox zam-app-flex-ajCenter">
            <div class="loadadv-iconbox">
                <div class="loadadv-icon"></div>
            </div>
        </section>`);
        var img = new Image();
        img.onload = img.onerror = function(){
            setTimeout(function(){
                $(".loadadvbox").remove();
                $("body").append(`
                    <section class="advbox zam-app-flex-ajCenter">
                        <div class="scrollbox">
                            <img class="advimg" src="${liveadvconfig.img}">
                        </div>
                        <div class="advinfobox">
                            <div class="advdjsbox zam-app-flex">
                                <div class="advseconds">${liveadvconfig.seconds}</div>秒后进入直播
                            </div>
                            <div class="advclose${advskep=='2' ? ' hidden' : ''}">跳过</div>
                            </div>
                    </section>
                `);
                $("body").on('click','.advbox .advinfobox img',function(){
                    if(liveadvconfig.url=='') return false;
                    clearInterval(advdjstimer);
                    window.location.href = liveadvconfig.url;
                });
                $("body").on('click','.advbox .advdjsbox,.advbox .advinfobox .advclose',function(){
                    if(advskep=='2') return false;
                    clearInterval(advdjstimer);
                    $(".advbox").remove();
                });
                $('.advbox').addClass('advboxani').one('webkitAnimationEnd mozAnimationEnd MSAnimationEnd oanimationend animationend', function () {
                    $(this).find('.advinfobox').fadeIn();
                    var advseconds = liveadvconfig.seconds;
                    advdjstimer = setInterval(function(){
                        advseconds--;
                        $(".advbox .advdjsbox .advseconds").text(advseconds);
                        if(advseconds <= 0){
                            clearInterval(advdjstimer);
                            $('.advbox').addClass('advboxanihide').one('webkitAnimationEnd mozAnimationEnd MSAnimationEnd oanimationend animationend', function () {
                                $(".advbox").remove();
                            })
                        }
                    },1e3);      
                });
            },20);
        }
        img.src = liveadvconfig.img;
}
</script>
