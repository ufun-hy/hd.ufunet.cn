<style>
.subbox{
    position: fixed;
    bottom: 80px;
    left: 0;
    width: 100%;
    height: 50px;
    margin: 0 auto;
    text-align: center;
}
.subbox.hidden{
    display: block;
    opacity: 0;
    pointer-events: none;
}
</style>
<div class="subbox hidden">

</script>
<script type="text/wxtag-template" slot="style">
<style>
.subscribe-btn {
    background-color: #00aeff;
	color: #fff;
	text-align: center;
    position: relative;
    border: none;
    pointer-events: auto;
    width: 200px;
    display: block;
    font-size: 16px;
    height: 50px;
    line-height: 50px;
    margin-top: 20px;
    border-radius: 5px;
}
</style>
</script>
</wx-open-subscribe>
