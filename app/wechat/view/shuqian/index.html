{include file="common/header" /}
<style>
.moneyBox{width: 100%; height:100%;  overflow: hidden; text-align: center;}
.money-tips{
	width: 100%;
    height: 100%;
    position: fixed;
	top:0;
	left:0;
	z-index:3;
	background-color:rgba(0,0,0,0.5);
	color:#fff;
	font-size:0.4rem;
}

.money-tips .gametip i.money-tips-arrowtop{
	display:inline-block;
	margin-top:0.6rem;
	font-size:0.7rem;
	animation:gear 3s ease infinite;
	-webkit-animation:gear 3s ease infinite;
}
@keyframes gear {
	0% {
	transform:translate3d(0,0,0);
	-webkit-transform:translate3d(0,0,0);
	-moz-transform:translate3d(0,0,0);
	-ms-transform:translate3d(0,0,0);
	-o-transform:translate3d(0,0,0);
	opacity:1
}
50% {
	transform:translate3d(0px,40px,0);
	-webkit-transform:translate3d(0px,40px,0);
	-moz-transform:translate3d(0px,40px,0);
	-ms-transform:translate3d(0px,40px,0);
	-o-transform:translate3d(0px,40px,0);
	opacity:1
}
100% {
	transform:translate3d(0,0,0);
	-webkit-transform:translate3d(0,0,0);
	-moz-transform:translate3d(0,0,0);
	-ms-transform:translate3d(0,0,0);
	-o-transform:translate3d(0,0,0);
	opacity:0
}
}
.gamestatus{
	padding:0.3rem 0.4rem;
	font-size:0.32rem;
	color:#fff;
	background-color:rgba(0,0,0,0.3);
	border-radius:5px;
	margin-bottom:0.4rem;
}
.phb-btn{
	width:3.6rem;
	height:1.25rem;
	background-image: url("{:tomedia($appconfig['style']['apppm'])}");
    background-size: cover;   
	background-repeat:no-repeat;
	
}
.money_count{
    width: 100%;
    height: 100%;
    position: fixed;
    overflow: hidden;
}
.money_count .reg_bag{
    width: 60%;
    height: 100%;
    position: absolute;
    bottom: -4rem;
	left:20%;
    background: url("{:tomedia($appconfig['style']['appredbag'])}") no-repeat center bottom;
    background-size: 100% auto;
    
}
.money_count .gold{
    width: 100%;
    height: 1.2rem;
    position: absolute;
    bottom: 0;
    background: url("{:tomedia($appconfig['style']['appgold'])}") no-repeat center 0;
    background-size: 100% auto;
}
.money_count .money_box{
    width: 60%;
    height:100%;
    position: relative;
    margin: 0 auto;
	overflow:hidden;
	z-index:1;
}
.money_count .money{
    background-color: #73dcff;
    width: 100%;
    height: 100%;
    position: absolute;
    bottom:-4.1rem;
    background: url("{:tomedia($appconfig['style']['appflymoney'])}") no-repeat center bottom;
    background-size: 100% auto;
	display:none;
}
.ri{display: none;overflow:hidden;pointer-events:none;}
.p{ position: absolute; width: 50px; }
.p img{animation: hovertreespin 30s linear 0s infinite; width: 100%; animation-duration:.3s;}
.p1{left:1rem;  top:-2rem;   animation: hovertreespinp 1.2s linear .5s infinite;}
.p2{left: 2rem;  top:-2.1rem;   animation: hovertreespinp 1.2s linear 1s infinite;}
.p3{left: 3rem;  top:-3rem;   animation: hovertreespinp 1.2s linear 0s infinite;}
.p4{left: 5rem; top:-2.3rem;   animation: hovertreespinp 1.2s linear 2s infinite;}
.p5{left: 6rem; top:-4rem;   animation: hovertreespinp 1.2s linear 3s infinite;}
.p6{right: 1rem; top:-4rem;   animation: hovertreespinp 1.2s linear 3s infinite;}
@keyframes hovertreespin {
    0%{
        transform: rotate(0deg)
    }
    100%{
        transform:rotate(360deg);
    }
}
@keyframes hovertreespinp {
    0%{
        margin-top: 0;
    }
    100%{
        margin-top: 1000px;

    }
}
.money-score{
	position:absolute;
	top:0;
	width:100%;
	z-index:2;
	color: #fff;
	font-size: .5rem;
}	
.money-score i{
	font-size:0.6rem;
	margin-right:0.1rem;
}
.money_add{
    margin:0.6rem auto;
    background-color:rgba(0,0,0,0.2);
    width:3rem;
    height:0.8rem;
    border-radius:0.1rem;
	color:gold;
}
.gametimeremain{
	margin:0.6rem auto;
    background-color:rgba(0,0,0,0.2);
    width:3rem;
    height:0.8rem;
    border-radius:0.1rem;
	color:#fff;
}
</style>
<div class="moneyBox">
	<div class="money-tips zam-app-flex-ajCenter hidden">
		<div class="gametip hidden">
			<p>游戏开始后，手指快速向上滑动</p>
			<i class="mxc-15 money-tips-arrowtop"></i>
		</div>
		<div class="gamestatus hidden"></div>
		<div class="phb-btn zam-app-flex-ajCenter hidden"></div>
	</div>
	<div class="money_count">
		<div class="money-score">
			<div class="money_add zam-app-flex-ajCenter2 {if $appconfig['appshowscore']=='2'}hidden{/if}"><i class="mxc-unie6ed"></i><span>0</span></div>
			<div class="gametimeremain zam-app-flex-ajCenter2"><i class="mxc-unie6b2"></i><span>0</span></div>
		</div>
		<div class="gold"></div>
		<div class="reg_bag"></div>
		<div class="money_box"><div class="money"></div></div>
		<div class="ri">
			<div class="p1 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
			<div class="p2 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
			<div class="p3 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
			<div class="p4 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
			<div class="p5 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
			<div class="p6 p"> <img src="{:tomedia($appconfig['style']['appdropimg'])}"></div>
		</div>
	</div>
</div>
<audio src="/{:WIMGURL}shuqian/piu.mp3" id="shakeaudio" ></audio>
<audio id="djsaudio" src="/{:WIMGURL}shake/count.mp3"></audio>
<script>
var powernum = parseInt("{$appconfig['powernum']??100}");
require(['wechatcore','appshuqian'],function (wechatcore,appshuqian) {	
	appshuqian.init();
	$(".phb-btn").on('click',function(){
		var $this = $(this);
		wechatcore.ajaxSubmit("{:gowechat('common/getphbdata')}",{gametype:XCV3Config.gametype,rotateid:$this.attr('data-rotateid'),gamephb:$this.attr('data-gamephb'),teamid:$this.attr('data-teamid')},'正在获取排行榜数据').then(function(data){
			 if(data.code==0){
				 if(data.msg.list.length>0){
				 	if(data.msg.myrank){
					 	data.msg.myrank.score = data.msg.score!='暂无成绩'?(data.msg.myrank.score*powernum):data.msg.score;
					 }
					 $("body").append(wechatcore.tpl($("#phb-tpl"),{list:data.msg.list,myrank:data.msg.myrank,powernum:powernum}));
				 }else{
					wechatcore.msg('暂无数据');
				 }
			 }else{
				wechatcore.msg(data.msg);
			 }
		}, function(){
			  wechatcore.msg('网络太差，请稍后重试');
		});
	});
})
</script>
{if !empty($appconfig['style']['diycss'])}
<style>{$appconfig['style']['diycss']}</style>
{/if}
