	<style type="text/css">
	.billauth-box{position: fixed;top:0;left:0;width: 100%;height: 100%;background: rgba(0,0,0,0.12);}
	.wrap{width:6.2rem;margin:0 auto;background:#fff;border-radius:6px;padding:0.46rem 0.24rem;}

<body>
<section class="billauth-box zam-app-flex-ajCenter">
    <div class="wrap zam-app-flex-ajCenter">
        <h3 class="title">开通免确认收款授权</h3>
        <p class="desc">开通后，红包奖励可直接发放到你的微信零钱，无需每次手动确认收款</p>
        <button id="authBtn" class="btn" disabled>获取授权中…</button>
        <div class="error hidden"></div>
        <div class="tip">仅在微信内打开本页面</div>
    </div>
</section>
</body>
<script>
var wxobj = (parent.wx||wx),packageinfo = {},authBtn = $("#authBtn"),errorbox = $(".error");
wxobj.ready(function () {
	wxobj.hideOptionMenu();
});
$(function(){
    require(['wechatcore'],function (wechatcore) {
        wechatcore.ajaxSubmit("{:gowechat('billauth/index')}",{},false).then(function(json){
            if(json.code==0){
                packageinfo = json.msg;
                authBtn.text('立即开通授权').prop('disabled', false);
                errorbox.text('').addClass('hidden');
            }else{
                packageinfo = {};
                authBtn.text('获取授权出现异常').prop('disabled', true);
                errorbox.text('原因：' + json.msg).removeClass('hidden');
            }
        });
    });
    authBtn.click(function(){
        wxobj.checkJsApi({
            jsApiList: ['requestMerchantTransfer'],
            success: function (res) {
                if (res.checkResult['requestMerchantTransfer']) {
                    WeixinJSBridge.invoke('requestMerchantTransfer', {
                        mchId: packageinfo.mch_id || '',
                        appId: packageinfo.app_id || '',
                        package: packageinfo.package_info || '',
                    },
                    function (res) {
                        var errmsg = res.err_msg || '';
                        if (errmsg === 'requestMerchantTransfer:ok') {
                            window.location.href = "{$targetUrl}";
                        }else if (errmsg === 'requestMerchantTransfer:fail') {
                            alert('授权出现异常，请稍后重试');
                        }else if (errmsg === 'requestMerchantTransfer:cancel') {
                            alert('您已取消授权');
                        }
                    }
                    );
                } else {
                    alert('你的微信版本过低，请更新至最新版本');
                }
            }
        });
    });
})
</script>
