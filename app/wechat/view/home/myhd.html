{include file="common/header" /}
<style>
.zam-app-myincome-box .zam-app-myincome-navbar .navbar-item i{
	margin-right:0.1rem;
}
.zam-app-myincome-box .zam-app-myincome-scroll {
    position: fixed;
    top: 0.9rem;
	left:0;
    bottom:0;
	width: 100%;
    overflow: hidden;
    overflow-y: scroll;
    -webkit-overflow-scrolling: touch;
	background-color:#fff;
	color:#333;
}
.hdrecord-list{border-top:0.2rem solid #eee;}
.hdrecord-list .hdrecord-item{
	display:block;
	border-bottom:0.2rem solid #eee;
	padding:0.3rem;
}
.hdrecord-item .hdname{
	height:0.6rem;line-height:0.6rem;font-size:0.3rem;
	white-space: nowrap;
    word-break: break-all;
    text-overflow: ellipsis;
    overflow: hidden;
}
.hdrecord-item .hdtime{
	height:0.36rem;line-height:0.36rem;font-size:0.26rem;color:gray
}
.zam-app-myincome-scroll .norecords{margin-top:1rem;font-size:0.3rem;text-align:center;}
</style>
<section class="g-flexview zam-app-myincome-box">
	<header class="m-navbar navbar-fixed zam-app-myincome-navbar">
		<a href="javascript:history.back(-1)" class="navbar-item">
			<i class="back-ico"></i>返回
		</a>
		<div class="navbar-center"></div>
	</header>
    <div class="zam-app-myincome-scroll hdrecord-list">
        {foreach $list as $okey=>$one}
            <a href="javascript:;" class="hdrecord-item" data-href="{:gowechat('',['hdid'=>$one['hdid']])}">
				<p class="hdname">{$one['hdtitle']}</p>
				<p class="hdtime">{$one['create_time']}</p>
			</a>
        {/foreach}
        {if empty($list)}<div class="norecords">暂无记录</div>{/if}
    </div>
</section>
{include file="common/footer" /}
