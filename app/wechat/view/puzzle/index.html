{include file="common/header" /}
<style>
.rule-btn{display:none}
@font-face {
    font-family: 'comicbook';
    src: url('/{:WIMGURL}/puzzle/fonts/comicbook.eot');
    src: url('/{:WIMGURL}/puzzle/fonts/comicbook.eot?#iefix') format('embedded-opentype'),
            url('/{:WIMGURL}/puzzle/fonts/comicbook.woff') format('woff'),
            url('/{:WIMGURL}/puzzle/fonts/comicbook.ttf') format('truetype'),
            url('/{:WIMGURL}/puzzle/fonts/comicbook.svg#comicbook') format('svg');
    font-weight: normal;
    font-style: normal;
}
.gamerule{
	position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background-color: rgba(0,0,0,.8);
}
.gamerule-main{
    position: absolute;
    top:30%;
    left: 0;
    width: 100%;
}
.gamerule-main .guide-txt{
    color: #fff;
    font-size: .28rem;
    font-weight: 700;
    text-align: center;
    line-height: 2;
}
.gamerule-main .guide-box {
    width: 100%;
    margin: 0.52rem auto;
    margin-bottom: 0.3rem;
}
.gamerule-main .guide-box .helpbox{
    position: relative;
    width: 3.7rem;
}
.gamerule-main .guide-box .helpbox img{
    width: 100%;
}
.guide-close{text-align:center;}
</style>
<div class="zam-app-mainbox" id="zam-app-mainbox"></div>
<audio id="djsaudio" src="/{:WIMGURL}shake/count.mp3"></audio>
<div class="gamerule hidden">
	<div class="gamerule-main">
		<div class="guide-txt">将拼图碎片拖动到正确的位置参与游戏</div>
		<div class="guide-box zam-app-flex-ajCenter">
            <div class="helpbox zam-app-flex-ajCenter">
                <img src="/{:WIMGURL}puzzle/images/help.gif" />
            </div>
        </div>
		<div class="guide-close"><a class="btn btn-primary">知道了</a></div>
	</div>
</div>
<div style="font-family:comicbook;visibility:hidden;">.</div>
<script>
var openrulebtn = "{if isset($appconfig['ruleinfo']) && isset($appconfig['ruleinfo']['open']) && $appconfig['ruleinfo']['open']=='1'}1{else /}2{/if}"
var game, puzzlGroup,sendscore = "{$appconfig['sendscore']}";
var Gameconfig = {
	gameW:750,
	gameH:750 / window.innerWidth * window.innerHeight,
	gameImgs:{
        title:"{if empty($appconfig['apptopimg'])}{:tomedia($appconfig['style']['apptopimg'])}{else}{:tomedia($appconfig['apptopimg'])}{/if}",
        rulebtn:"{:tomedia($appconfig['style']['apprulebtn'])}",
        topbg:"{:tomedia($appconfig['style']['apptopbg'])}",
        progress:"{:tomedia($appconfig['style']['progress'])}",
        progressbar:"{:tomedia($appconfig['style']['progressbar'])}",
        voibtn:"{:tomedia($appconfig['style']['appvoibtn'])}",
        overbox:"{:tomedia($appconfig['style']['appoverbg'])}",
        pmbtn: "{:tomedia($appconfig['style']['apppmbtn'])}",
        scorebgm:"{:tomedia($appconfig['style']['scorevoice'])}",
        overbgm:"{:tomedia($appconfig['style']['overvoice'])}",
        passbgm:"{:tomedia($appconfig['style']['passvoice'])}",
	},
    showvoibtn:"{$appconfig['showvoibtn']}",
    sortcorrectemove:"{$appconfig['sortcorrectemove']}",
    piecegap:parseInt("{$appconfig['style']['apppiececonfig']['piecegap']}"),
    kuanggap:parseInt("{$appconfig['style']['apppiececonfig']['kuanggap']}"),
    kuangwidth:parseInt("{$appconfig['style']['apppiececonfig']['kuangwidth']}"),
    kuangcolor:"{$appconfig['style']['apppiececonfig']['kuangcolor']}",
    kuangshadowwith:parseInt("{$appconfig['style']['apppiececonfig']['kuangshadowwith']}"),
    kuangshadowcolor:"{$appconfig['style']['apppiececonfig']['kuangshadowcolor']}",
    warninglineColor:"{$appconfig['style']['apppiececonfig']['warninglinecolor']}",
    warninglineWidth:parseInt("{$appconfig['style']['apppiececonfig']['warninglinewidth']}"),
    scoretipcolor:"{$appconfig['style']['apppiececonfig']['scoretipcolor']}",
    scoretipsize: parseInt("{$appconfig['style']['apppiececonfig']['scoretipsize']}"),
    showscorebox:"{$appconfig['appshowscore']??1}",
};
require(['apppuzzle'],function (apppuzzle) {	
	apppuzzle.init();
});
</script>
{if !empty($appconfig['style']['diycss'])}
<style>{$appconfig['style']['diycss']}</style>
{/if}
