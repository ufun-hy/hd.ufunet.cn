<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摇一摇抽奖游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Helvetica Rounded', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
            padding: 20px;
        }
        
        header {
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
        }
        
        .game-area {
            background-color: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }
        
        .game-area:hover {
            transform: translateY(-5px);
        }
        
        .shake-indicator {
            width: 200px;
            height: 200px;
            margin: 0 auto 30px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            border: 5px solid rgba(255, 255, 255, 0.3);
        }
        
        .shake-icon {
            font-size: 5rem;
            transition: transform 0.2s ease;
        }
        
        .shaking {
            animation: shake 0.5s infinite;
        }
        
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-15deg); }
            75% { transform: rotate(15deg); }
        }
        
        .result-display {
            min-height: 120px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.5s ease;
        }
        
        .prize {
            font-size: 2rem;
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }
        
        .prize-image {
            width: 60px;
            height: 60px;
            margin: 10px 0;
        }
        
        .prize-description {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 10px;
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 0.9rem;
            opacity: 0.8;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(to right, #ff8a00, #da1b60);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .instructions {
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-top: 30px;
            text-align: left;
        }
        
        .instructions h3 {
            margin-bottom: 15px;
            text-align: center;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
            line-height: 1.5;
        }
        
        .device-check {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            display: none;
        }
        
        .device-check.show {
            display: block;
        }
        
        .device-check p {
            margin-bottom: 10px;
        }
        
        .success {
            color: #4CAF50;
        }
        
        .error {
            color: #FF5252;
        }
        
        .shake-countdown {
            font-size: 1.2rem;
            margin-top: 10px;
            height: 24px;
        }
        
        .shake-strength {
            height: 10px;
            width: 80%;
            background-color: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 15px auto;
            overflow: hidden;
        }
        
        .shake-strength-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(to right, #4CAF50, #FFC107, #FF5252);
            transition: width 0.3s ease;
        }
        
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            
            .game-area {
                padding: 20px;
            }
            
            .shake-indicator {
                width: 150px;
                height: 150px;
            }
            
            .shake-icon {
                font-size: 4rem;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            button {
                width: 100%;
            }
            
            .stats {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> -->
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-dice"></i> 摇一摇抽奖</h1>
            <p class="subtitle">用力摇晃手机/设备，赢取惊喜大奖！</p>
        </header>
        
        <div class="game-area">
            <div class="shake-indicator">
                <div class="shake-icon">
                    <i class="fas fa-mobile-alt"></i>
                </div>
            </div>
            
            <div class="shake-strength">
                <div class="shake-strength-bar" id="strengthBar"></div>
            </div>
            
            <p class="shake-countdown" id="shakeCountdown">准备摇动！</p>
            
            <div class="result-display" id="resultDisplay">
                <p id="defaultMessage">摇一摇手机来抽奖！</p>
                <div id="prizeResult"></div>
            </div>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="shakeCount">0</div>
                    <div class="stat-label">摇动次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="prizeCount">0</div>
                    <div class="stat-label">中奖次数</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="todayLuck">85%</div>
                    <div class="stat-label">今日运气</div>
                </div>
            </div>
            
            <div class="controls">
                <button id="startBtn">
                    <i class="fas fa-play"></i> 开始游戏
                </button>
                <button id="resetBtn" disabled>
                    <i class="fas fa-redo"></i> 重置游戏
                </button>
                <button id="testBtn">
                    <i class="fas fa-vial"></i> 测试摇动
                </button>
            </div>
        </div>
        
        <div class="device-check" id="deviceCheck">
            <p id="deviceMessage">正在检测设备运动传感器...</p>
        </div>
        
        <div class="instructions">
            <h3><i class="fas fa-info-circle"></i> 游戏说明</h3>
            <ul>
                <li>点击"开始游戏"按钮启动摇一摇检测</li>
                <li>用力摇晃您的设备，触发抽奖</li>
                <li>每次摇动后，系统会随机抽取一个奖品</li>
                <li>摇动强度越高，获得高级奖品的机会越大</li>
                <li>您也可以点击"测试摇动"按钮来模拟摇动</li>
                <li>本游戏需要设备支持运动传感器（大多数智能手机都支持）</li>
            </ul>
        </div>
    </div>

    <script>
        // 奖品数据
        const prizes = [
            { name: "特等奖", value: "iPhone 15 Pro", probability: 1, color: "#FFD700", icon: "fas fa-gem" },
            { name: "一等奖", value: "iPad Air", probability: 3, color: "#C0C0C0", icon: "fas fa-tablet-alt" },
            { name: "二等奖", value: "AirPods Pro", probability: 10, color: "#CD7F32", icon: "fas fa-headphones" },
            { name: "三等奖", value: "￥500现金红包", probability: 20, color: "#FF6B6B", icon: "fas fa-money-bill-wave" },
            { name: "四等奖", value: "星巴克咖啡券", probability: 40, color: "#4ECDC4", icon: "fas fa-coffee" },
            { name: "五等奖", value: "10元优惠券", probability: 100, color: "#95E1D3", icon: "fas fa-ticket-alt" },
            { name: "参与奖", value: "谢谢参与", probability: 200, color: "#CCCCCC", icon: "fas fa-heart" }
        ];

        // 游戏状态变量
        let shakeCount = 0;
        let prizeCount = 0;
        let isGameActive = false;
        let lastShakeTime = 0;
        let shakeStrength = 0;
        let shakeInstance = null;

        // DOM元素
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const testBtn = document.getElementById('testBtn');
        const shakeCountElement = document.getElementById('shakeCount');
        const prizeCountElement = document.getElementById('prizeCount');
        const resultDisplay = document.getElementById('resultDisplay');
        const prizeResult = document.getElementById('prizeResult');
        const defaultMessage = document.getElementById('defaultMessage');
        const shakeCountdown = document.getElementById('shakeCountdown');
        const strengthBar = document.getElementById('strengthBar');
        const deviceCheck = document.getElementById('deviceCheck');
        const deviceMessage = document.getElementById('deviceMessage');
        const shakeIcon = document.querySelector('.shake-icon');
        const shakeIndicator = document.querySelector('.shake-indicator');

        // 初始化游戏
        function initGame() {
            // 检查设备是否支持运动传感器
            checkDeviceMotionSupport();
            
            // 设置事件监听器
            startBtn.addEventListener('click', startGame);
            resetBtn.addEventListener('click', resetGame);
            testBtn.addEventListener('click', simulateShake);
            
            // 初始化UI
            updateUI();
        }

        // 检查设备是否支持运动传感器
        function checkDeviceMotionSupport() {
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                // iOS 13+ 设备
                deviceCheck.classList.add('show');
                deviceMessage.innerHTML = '<i class="fas fa-exclamation-triangle"></i> iOS 13+ 需要授权访问运动传感器';
                deviceMessage.className = 'error';
            } else if ('ondevicemotion' in window) {
                // 支持运动传感器的设备
                deviceCheck.classList.add('show');
                deviceMessage.innerHTML = '<i class="fas fa-check-circle"></i> 设备支持摇一摇功能';
                deviceMessage.className = 'success';
            } else {
                // 不支持运动传感器的设备
                deviceCheck.classList.add('show');
                deviceMessage.innerHTML = '<i class="fas fa-times-circle"></i> 设备不支持摇一摇功能，您可以使用"测试摇动"按钮';
                deviceMessage.className = 'error';
            }
        }

        // 开始游戏
        function startGame() {
            if (isGameActive) {
                stopGame();
                return;
            }
            
            // 对于 iOS 13+，需要请求权限
            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            initializeShakeDetection();
                        } else {
                            alert('摇一摇功能需要授权访问设备运动传感器');
                            deviceMessage.innerHTML = '<i class="fas fa-times-circle"></i> 用户拒绝了运动传感器授权';
                            deviceMessage.className = 'error';
                        }
                    })
                    .catch(console.error);
            } else {
                initializeShakeDetection();
            }
        }

        // 初始化摇动检测
        function initializeShakeDetection() {
            // 创建 Shake 实例
            shakeInstance = new Shake({
                threshold: 12, // 摇动阈值，值越低越敏感
                timeout: 1000  // 摇动事件间隔
            });
            
            // 开始监听
            shakeInstance.start();
            
            // 监听摇动事件
            window.addEventListener('shake', handleShakeEvent);
            
            // 更新UI状态
            isGameActive = true;
            startBtn.innerHTML = '<i class="fas fa-stop"></i> 停止游戏';
            resetBtn.disabled = false;
            shakeCountdown.textContent = '检测中...请摇动设备！';
            
            // 添加摇动动画
            shakeIndicator.classList.add('shaking');
            
            console.log('摇一摇检测已启动');
        }

        // 停止游戏
        function stopGame() {
            if (shakeInstance) {
                shakeInstance.stop();
                window.removeEventListener('shake', handleShakeEvent);
            }
            
            isGameActive = false;
            startBtn.innerHTML = '<i class="fas fa-play"></i> 开始游戏';
            shakeCountdown.textContent = '游戏已停止';
            shakeIndicator.classList.remove('shaking');
            
            console.log('摇一摇检测已停止');
        }

        // 处理摇动事件
        function handleShakeEvent() {
            if (!isGameActive) return;
            
            const currentTime = Date.now();
            const timeSinceLastShake = currentTime - lastShakeTime;
            
            // 防止过于频繁的摇动
            if (timeSinceLastShake < 1000) {
                shakeCountdown.textContent = '摇动太快了，请稍后再试！';
                return;
            }
            
            lastShakeTime = currentTime;
            shakeCount++;
            
            // 计算摇动强度（随机模拟）
            shakeStrength = Math.min(100, Math.floor(Math.random() * 30) + 70);
            
            // 更新UI
            updateUI();
            
            // 显示摇动反馈
            showShakeFeedback();
            
            // 执行抽奖
            drawPrize();
            
            // 更新摇动计数
            shakeCountElement.textContent = shakeCount;
            
            console.log(`摇动检测到！次数: ${shakeCount}, 强度: ${shakeStrength}%`);
        }

        // 显示摇动反馈
        function showShakeFeedback() {
            // 更新强度条
            strengthBar.style.width = shakeStrength + '%';
            
            // 更新倒计时
            shakeCountdown.textContent = '摇动成功！抽奖中...';
            
            // 添加视觉反馈
            shakeIndicator.style.backgroundColor = 'rgba(76, 175, 80, 0.3)';
            setTimeout(() => {
                shakeIndicator.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
            }, 300);
            
            // 重置倒计时
            let countdown = 3;
            const countdownInterval = setInterval(() => {
                if (countdown > 0) {
                    shakeCountdown.textContent = `下次摇动准备: ${countdown}秒`;
                    countdown--;
                } else {
                    clearInterval(countdownInterval);
                    shakeCountdown.textContent = '可以继续摇动！';
                }
            }, 1000);
        }

        // 抽奖逻辑
        function drawPrize() {
            // 根据摇动强度调整中奖概率
            const strengthBonus = shakeStrength / 100;
            
            // 计算总概率
            let totalProbability = 0;
            prizes.forEach(prize => {
                // 强度越高，高级奖品概率增加
                const adjustedProbability = prize.name === "参与奖" 
                    ? prize.probability * (1 - strengthBonus * 0.5)
                    : prize.probability * (1 + strengthBonus * 2);
                
                totalProbability += adjustedProbability;
            });
            
            // 生成随机数
            let random = Math.random() * totalProbability;
            let selectedPrize = prizes[prizes.length - 1]; // 默认参与奖
            
            // 选择奖品
            for (let i = 0; i < prizes.length; i++) {
                const prize = prizes[i];
                const adjustedProbability = prize.name === "参与奖" 
                    ? prize.probability * (1 - strengthBonus * 0.5)
                    : prize.probability * (1 + strengthBonus * 2);
                
                if (random < adjustedProbability) {
                    selectedPrize = prize;
                    break;
                }
                random -= adjustedProbability;
            }
            
            // 显示奖品
            displayPrize(selectedPrize);
            
            // 更新中奖计数（如果不是参与奖）
            if (selectedPrize.name !== "参与奖") {
                prizeCount++;
                prizeCountElement.textContent = prizeCount;
            }
            
            // 更新今日运气
            updateLuck();
        }

        // 显示奖品
        function displayPrize(prize) {
            defaultMessage.style.display = 'none';
            prizeResult.innerHTML = '';
            
            const prizeElement = document.createElement('div');
            prizeElement.innerHTML = `
                <div class="prize" style="color: ${prize.color}">
                    <i class="${prize.icon}"></i> ${prize.name}
                </div>
                <div class="prize-description">
                    恭喜您获得: <strong>${prize.value}</strong>
                </div>
            `;
            
            prizeResult.appendChild(prizeElement);
            
            // 添加动画效果
            resultDisplay.style.backgroundColor = 'rgba(255, 255, 255, 0.25)';
            setTimeout(() => {
                resultDisplay.style.backgroundColor = '';
            }, 1000);
            
            // 显示庆祝效果
            if (prize.name !== "参与奖") {
                showCelebration();
            }
        }

        // 显示庆祝效果
        function showCelebration() {
            // 创建庆祝元素
            for (let i = 0; i < 20; i++) {
                const confetti = document.createElement('div');
                confetti.innerHTML = '<i class="fas fa-star"></i>';
                confetti.style.position = 'fixed';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.top = '-20px';
                confetti.style.color = ['#FFD700', '#FF6B6B', '#4ECDC4', '#FF8A00'][Math.floor(Math.random() * 4)];
                confetti.style.fontSize = Math.random() * 20 + 10 + 'px';
                confetti.style.opacity = '0.8';
                confetti.style.zIndex = '9999';
                confetti.style.pointerEvents = 'none';
                document.body.appendChild(confetti);
                
                // 动画
                const animation = confetti.animate([
                    { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                    { transform: `translateY(${window.innerHeight + 20}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                ], {
                    duration: Math.random() * 2000 + 1000,
                    easing: 'cubic-bezier(0.215, 0.61, 0.355, 1)'
                });
                
                animation.onfinish = () => confetti.remove();
            }
        }

        // 更新今日运气
        function updateLuck() {
            // 基于中奖率计算运气值
            const luck = shakeCount > 0 ? Math.min(99, Math.floor((prizeCount / shakeCount) * 100)) : 85;
            document.getElementById('todayLuck').textContent = luck + '%';
        }

        // 模拟摇动（用于测试）
        function simulateShake() {
            if (!isGameActive) {
                alert('请先开始游戏！');
                return;
            }
            
            // 模拟摇动事件
            handleShakeEvent();
        }

        // 重置游戏
        function resetGame() {
            if (isGameActive) {
                stopGame();
            }
            
            shakeCount = 0;
            prizeCount = 0;
            shakeStrength = 0;
            
            // 重置UI
            shakeCountElement.textContent = '0';
            prizeCountElement.textContent = '0';
            defaultMessage.style.display = 'block';
            prizeResult.innerHTML = '';
            strengthBar.style.width = '0%';
            shakeCountdown.textContent = '准备摇动！';
            updateLuck();
            
            resetBtn.disabled = true;
            
            console.log('游戏已重置');
        }

        // 更新UI
        function updateUI() {
            // 更新按钮状态
            resetBtn.disabled = !isGameActive && shakeCount === 0;
        }

        // 页面加载完成后初始化游戏
        document.addEventListener('DOMContentLoaded', initGame);
        
        // 页面可见性变化时处理
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && isGameActive) {
                // 页面隐藏时停止检测以节省资源
                stopGame();
            }
        });
    </script>
    
    <!-- 引入Shake.js库 -->
    <script>
        // 将之前提供的Shake.js代码放在这里
        (function(global, factory) {
            if (typeof define === 'function' && define.amd) {
                define(function() {
                    return factory(global, global.document);
                });
            } else if (typeof module !== 'undefined' && module.exports) {
                module.exports = factory(global, global.document);
            } else {
                global.Shake = factory(global, global.document);
            }
        } (typeof window !== 'undefined' ? window : this, function (window, document) {
            'use strict';
            function Shake(options) {
                this.hasDeviceMotion = 'ondevicemotion' in window;
                this.options = {
                    threshold: 15,
                    timeout: 300
                };
                if (typeof options === 'object') {
                    for (var i in options) {
                        if (options.hasOwnProperty(i)) {
                            this.options[i] = options[i];
                        }
                    }
                }
                this.lastTime = new Date();
                this.lastX = null;
                this.lastY = null;
                this.lastZ = null;
                if (typeof document.CustomEvent === 'function') {
                    this.event = new document.CustomEvent('shake', {
                        bubbles: true,
                        cancelable: true
                    });
                } else if (typeof document.createEvent === 'function') {
                    this.event = document.createEvent('Event');
                    this.event.initEvent('shake', true, true);
                } else {
                    return false;
                }
            }
            Shake.prototype.reset = function () {
                this.lastTime = new Date();
                this.lastX = null;
                this.lastY = null;
                this.lastZ = null;
            };
            Shake.prototype.start = function () {
                this.reset();
