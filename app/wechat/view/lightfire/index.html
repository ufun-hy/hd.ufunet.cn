{include file="common/header" /}
<style>
.zam-app-shake-main{position:fixed;top:0;left:0;width:100%;height:100%;overflow: hidden;color:#333;}
.zam-app-shaketip{
	font-size:0.32rem;font-weight:500;color:#fff
}
.zam-app-shake-main .zam-app-shaketip{
    margin-top:0.5rem;
}
.zam-app-shake-over{width:2.5rem;height:2.5rem;margin-bottom:0.5rem}
.zam-app-shake-over img{width:100%;height:100%;}

.zam-app-click-ing img{
	width:4rem;
	height:4rem;
}
/*游戏时间*/
.zam-app-gametime{
	position:fixed;
	left:0;
	top:0.4rem;
	background-color:rgba(0,0,0,0.4);
	color:#fff;
	padding:0.3rem;
	font-size:0.5rem;
}
.zam-app-gametime i{
	margin-right:0.3rem;
}
/*游戏结束弹窗*/
.zam-app-shake-over{
	position:fixed;
	top:0;
	left:0;
	width:100%;
	height:100%;
	overflow: hidden;
	color:blue;
	background-color:rgba(0,0,0,0.6);
	z-index:1;
}
.zam-app-shake-over .zam-app-shaketip{
    margin-bottom:0.5rem;
}
.phb-btn{
	width:3.6rem;
	height:1.25rem;
	background-image: url("{:tomedia($appconfig['style']['apppm']??'')}");
    background-size: cover;   
	background-repeat:no-repeat;
	
}
.shake-banglist{
	height:5.8rem;
	overflow-x:hidden;
	overflow-y:auto;
}
.shake-bangtitle{position:relative;font-size:0.32rem!important;text-align:center!important;}
.shake-bangtitle i{position:absolute;right:0.3rem;font-size: 0.5rem;color:gray}
.shake-banglist li {
	height:1rem;
    border-top: 1px solid #f0f0f0;
}
.shake-banglist li div{
	height:100%;
}
.shake-banglist .banglist-tag {
    width:0.6rem;
}
.shake-banglist .rolwnum {
    display: inline-block;
    width: 0.5rem;
    text-align: center;
    font-size: 0.32rem;
	color:#666
}
.shake-banglist .banglist-avatar {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 100%;
}
.shake-banglist .banglist-nickname {
    width: 100%;
	color:#666;
	font-size:0.3rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.shake-banglist .banglist-number em {
    color: #0084ff;
	font-size: 0.4rem;
}
</style>
{if !empty($appconfig['style']['diycss'])}<style>{$appconfig['style']['diycss']}</style>{/if}
<audio id="djsaudio" src="/{:WIMGURL}shake/count.mp3"></audio>
<audio id="shakeaudio" src="/{:WIMGURL}shake/shake.mp3"></audio>
<div class="zam-app-shake-main zam-app-flex-ajCenter">
	<div class="zam-app-click-ing zam-app-flex-ajCenter hidden">
		<img class="zam-app-clickimg" src="{:tomedia($appconfig['style']['lightimg'])}">
		<img class="zam-app-clickedimg hidden" src="{:tomedia($appconfig['style']['lightingimg'])}">
	</div>
	<div class="zam-app-shaketip"></div>
</div>
<div class="zam-app-shake-over zam-app-flex-ajCenter hidden">
	<div class="zam-app-shaketip"></div>
	<a href="javascript:;" class="phb-btn zam-app-flex-ajCenter hidden"></a>
</div>
<div class="zam-app-gametime">
	<i class="mxc-unie6b2"></i><span>0</span>
</div>
<script>
var boomaudio = "{:tomedia($appconfig['style']['boomaudio']??'')}";
require(['wechatcore','applightfire'],function (wechatcore,applightfire) {
	applightfire.init();
	$(".phb-btn").on('click',function(){
		var $this = $(this);
		wechatcore.ajaxSubmit("{:gowechat('common/getphbdata')}",{gametype:XCV3Config.gametype,rotateid:$this.attr('data-rotateid'),gamephb:$this.attr('data-gamephb'),teamid:$this.attr('data-teamid')},'正在获取排行榜数据').then(function(data){
			 if(data.code==0){
				 if(data.msg.list.length){
					 $("body").append(wechatcore.tpl($("#phb-tpl"),{list:data.msg.list,myrank:data.msg.myrank}));
				 }else{
					wechatcore.msg('暂无数据');
				 }
			 }else{
				wechatcore.msg(data.msg);
			 }
		}, function(){
			  wechatcore.msg('网络太差，请稍后重试');
		});
	});
})
</script>
