<body>
<style>
/**wechat  通用样式**/
.zam-app-bodyBg {
    position: fixed;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 100%;
	z-index:-1;
    background-color:rgba(0,0,0,0.8);
}
</style>
<section id="mapbox" style="display: none"></section>
<div class="zam-app-bodyBg"></div>
</body>
<script>
(parent.wx||wx).ready(function () {
	(parent.wx||wx).hideOptionMenu();
});
$(function(){
	var hadgetloc = 0,maptype = "{$map['type']??'1'}";
	if(XCV3Config.clienttype=='1'){
		require(['wechatcore'],function (wechatcore) {
			var loadindex = wechatcore.loading('正在获取您的位置信息');
			var t = setInterval(function(){
				if(hadgetloc==1){
					wechatcore.close(loadindex);
					clearInterval(t);
					wechatcore.showtopmsg('地理位置验证成功',1e3,function(){
						window.location.href = "{:$fromurl}";
					});
				}else if(hadgetloc==-1){
					wechatcore.close(loadindex);
					clearInterval(t);
					wechatcore.ask(false,'对不起，您所在位置不在活动范围内','好的',function(){
						if(XCV3Config.clienttype=='1') wechatcore.closewxwindow();
					});
				}
			},500);
			wechatcore.getwxlocation(function(res){
				wechatcore.ajaxSubmit("{:gowechat('area/index')}",{lat:res.latitude,lng:res.longitude},false).then(function(json){
					if(json.code==0){
						hadgetloc = 1;
					}else{
						hadgetloc = -1;
					}
				});
			},function(){
				wechatcore.msg('允许获取您的地理位置才可进入活动');
				setTimeout(function(){
					window.location.reload(true);
				},2e3);
			});
			
		});
	}else{
		if(maptype == '1'){
			require(['wechatcore','AMapLoader'],function (wechatcore,AMapLoader) {
				var loadindex = wechatcore.loading('正在获取您的位置信息');
				var t = setInterval(function(){
					if(hadgetloc==1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.showtopmsg('地理位置验证成功',1e3,function(){
							window.location.href = "{:$fromurl}";
						});
					}else if(hadgetloc==-1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.ask(false,'对不起，您所在位置不在活动范围内','好的',function(){
							if(XCV3Config.clienttype=='1') wechatcore.closewxwindow();
						});
					}
				},500);
				AMapLoader.load({
				    "key": "{$map['gdmap']['jskey']??''}",
				    "version": "1.4.15",
				    "plugins": ['AMap.Autocomplete'],
				}).then((AMap)=>{
				    AMap.plugin('AMap.Geolocation', function() {
					  var geolocation = new AMap.Geolocation({
					    enableHighAccuracy: true,
					    timeout: 10000,
					    offset: [10, 20],
					    zoomToAccuracy: false,
					  })
					  geolocation.getCurrentPosition(function(status,result){
					        if(status=='complete'){
					            var pos = result.position;
					            wechatcore.ajaxSubmit("{:gowechat('area/index')}",{lat:pos.lat,lng:pos.lng},false).then(function(json){
									if(json.code==0){
										hadgetloc = 1;
									}else{
										hadgetloc = -1;
									}
								});
					        }else{
					            wechatcore.msg('定位出现异常，请刷新重试');
					        }
					  });
					})
				}).catch(function(e){
				    wechatcore.msg('地图加载失败，请稍后重试');
				});
			});
		}else if(maptype == '2'){
			require(['wechatcore',"async!https://api.map.baidu.com/api?v=3.0&ak={$map['bdmap']['jsak']??''}"],function (wechatcore) {
				var loadindex = wechatcore.loading('正在获取您的位置信息');
				var t = setInterval(function(){
					if(hadgetloc==1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.showtopmsg('地理位置验证成功',1e3,function(){
							window.location.href = "{:$fromurl}";
						});
					}else if(hadgetloc==-1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.ask(false,'对不起，您所在位置不在活动范围内','好的',function(){
							if(XCV3Config.clienttype=='1') wechatcore.closewxwindow();
						});
					}
				},500);
				var map = new BMap.Map("mapbox");
				var point = new BMap.Point(116.331398,39.897445);
				map.centerAndZoom(point,12);
				var geolocation = new BMap.Geolocation();
				geolocation.getCurrentPosition(function(r){
					if(this.getStatus() == BMAP_STATUS_SUCCESS){
			            wechatcore.ajaxSubmit("{:gowechat('area/index')}",{lat:r.point.lat,lng:r.point.lng},false).then(function(json){
							if(json.code==0){
								hadgetloc = 1;
							}else{
								hadgetloc = -1;
							}
						});
					}else {
						wechatcore.msg('定位出现异常，请稍后重试');
					}        
				});
			});
		}else{
			require(['wechatcore',"https://mapapi.qq.com/web/mapComponents/geoLocation/v/geolocation.min.js"],function (wechatcore) {
				var loadindex = wechatcore.loading('正在获取您的位置信息');
				var t = setInterval(function(){
					if(hadgetloc==1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.showtopmsg('地理位置验证成功',1e3,function(){
							window.location.href = "{:$fromurl}";
						});
					}else if(hadgetloc==-1){
						wechatcore.close(loadindex);
						clearInterval(t);
						wechatcore.ask(false,'对不起，您所在位置不在活动范围内','好的',function(){
							if(XCV3Config.clienttype=='1') wechatcore.closewxwindow();
						});
					}
				},500);
				var geolocation = new qq.maps.Geolocation("{$map['txmap']['key']??''}", "默认应用");
				geolocation.getLocation(function(pos){
					wechatcore.ajaxSubmit("{:gowechat('area/index')}",{lat:pos.lat,lng:pos.lng},false).then(function(json){
						if(json.code==0){
							hadgetloc = 1;
						}else{
							hadgetloc = -1;
						}
					});
				}, function(e){
					wechatcore.msg('定位出现异常，请稍后重试');
				});
			});
		}
	}
});
</script>
