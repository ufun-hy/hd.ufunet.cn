{include file="common/header" /}
<style type="text/css">
.zam-app-subnoticeuser{position: absolute;top:0;left:0;width: 100%;height: 100%}
.zam-app-subnoticeuser-content{width: 100%;height: 100%}
.zam-app-subnoticeuser img{width:1.56rem;height:1.56rem;border-radius:50%;margin-bottom: 0.4rem;}
.zam-app-subnoticeuser .nickname{width:80%;font-size:0.32rem;margin-bottom:0.2rem;text-align: center;}
.zam-app-subnoticeuser .tip{
	margin-top: 30px;
	padding: 0 0.3rem;
}
.zam-app-subnoticeuser .tip .tipitem{
	font-size: 0.25rem;
	margin-bottom: 0.18rem;
}
.zam-app-subnoticeuser .tip .tipitem p{
	margin-bottom: 0.12rem;
}
.zam-app-subnoticeuser .tip .tipitem a{
	color: darkblue;
	font-size: 0.26rem;
}
</style>
<section class="zam-app-subnoticeuser g-flexview zam-app-flex-ajCenter">
<div class="zam-app-subnoticeuser-content zam-app-flex-ajCenter">
	<img src="{$wxuser['avatar']}" />
	<div class="nickname limitbox">{$wxuser['nickname']}</div>
	<wx-open-subscribe style="" template="{$subtplid}" id="subscribe-btn">
	<script type="text/wxtag-template">
		<a class="subscribe-btn">订阅中奖通知</a>
	</script>
	<script type="text/wxtag-template" slot="style">
	<style>
	  .subscribe-btn {
	    background-color: #00aeff;
    	color: #fff;
    	text-align: center;
	    position: relative;
	    border: none;
	    pointer-events: auto;
	    width: 200px;
	    display: block;
	    font-size: 16px;
	    height: 50px;
	    line-height: 50px;
	    margin-top: 20px;
	    border-radius: 5px;
	}
	</style>
	</script>
	</wx-open-subscribe>
	<div class="tip">
		<div class="tipitem">温馨提醒：参照以下步骤订阅成功后才可收到中奖推送并进入活动</div>
		<div class="tipitem">
			<p>1. 点击订阅中奖通知按钮，开启弹窗内的中奖结果通知开关</p>
			<p>2. 点击弹窗内的允许按钮</p>
		</div>
		<div class="tipitem">
			<p>特别注意：如果不小心点了拒绝按钮导致无法进入活动可</p>
			<a href="{:gowechatspecial('subnotice/index',['hdid'=>$hdinfo['hdid']??''])}">点击查看教程</a>
		</div>
	</div>
</div>
</section>
<script type="text/javascript">
require(['wechatcore'],function(wechatcore){
	var subbtn = document.getElementById('subscribe-btn');
	subbtn.addEventListener('success', function (e) {
		if(e.detail.errMsg=='subscribe:ok'){
			var isreject = false,subdetails = $.parseJSON(e.detail.subscribeDetails);
			$.each(subdetails,function(i,v){
				if(v.indexOf('reject')!=-1){
					isreject = true;
				}
			});
			if(isreject){
				wechatcore.msg('您已拒绝订阅无法进入活动，请点击下面的查看教程');
			}else{
				wechatcore.ajaxSubmit('/wechat/common/subnoticetpl',{type:'1',tplid:"{$subtplid}"}).then(function(data){
					 if(data.code==0){
						wechatcore.msg('订阅成功');
						$('.subscribe-btn').text('订阅成功');
				  		setTimeout(function(){
					  		window.location.href = "{$targetUrl}";
					  	},1e3);
					 }else{
						wechatcore.msg(data.msg);
					 }
				}, function(){
					  wechatcore.msg('网络太差，请稍后重试');
				});
			}
		}
	});   
	subbtn.addEventListener('error',function (e) {         
	  wechatcore.msg(wechatcore.subnoticeErrormsg(e.detail.errCode));
	});
});
</script>
{include file="common/footer" /}
