{include file="common/header" /}
<style>
.gamerule{
	position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    background-color: rgba(0,0,0,.8);
}
.gamerule-main{
    position: absolute;
    top:30%;
    left: 0;
    width: 100%;
}
.gamerule-main .guide-txt{
    color: #fff;
    font-size: .28rem;
    font-weight: 700;
    text-align: center;
    line-height: 2;
}
.gamerule-main .guide-box {
    width: 100%;
    margin: 0.52rem auto;
}
.gamerule-main .guide-box .playerbox{
    position: relative;
    width: 3.7rem;
    height: 2rem;  
    
}
.gamerule-main .guide-box .playerbox .player {
    width: 100%;
    height: 100%;  
    background-repeat: no-repeat;
    background-size: cover;
    background-image: url({:tomedia($appconfig['style']['appbutton'])});
}
.gamerule-main .guide-box .handbox{
    position: absolute;
    left: 1rem;
    top: 1rem;
}
.gamerule-main .guide-box .handbox .hand{
    transform: rotate(-30deg);
    -webkit-transform: rotate(-30deg);
    width: 1rem;
}
.pulse{
    position: absolute;
    left: -0.38rem;
    top: -0.2rem;
    width: 1.6rem;
    height: 1.6rem;
    background-color: #f7d30a;
    border: 2px solid #f7d30a;
    border-radius: 50%;
    z-index: 1;
    opacity: 0;
    -webkit-animation: warnwave 0.9s ease-out;
    animation: warnwave 0.9s ease-out;
    -webkit-animation-iteration-count: infinite;
    animation-iteration-count: infinite;
}
@keyframes warnwave {
    0% {
        -moz-transform: scale(0);
        transform: scale(0);
        opacity: 1;
    }
    100% {
        -moz-transform: scale(1);
        transform: scale(1);
        opacity: 0;
    }
}
.guide-close{text-align:center;}
</style>
<div class="zam-app-mainbox" id="zam-app-mainbox"></div>
<audio id="djsaudio" src="/{:WIMGURL}shake/count.mp3"></audio>
<div class="gamerule hidden">
	<div class="gamerule-main">
		<div class="guide-txt">点击左右按钮参与游戏</div>
		<div class="guide-box zam-app-flex-ajCenter">
            <div class="playerbox">
                <div class="player"></div>
                <div class="handbox">
                    <img src="/{:WIMGURL}jumprace/hand.png"  class="hand"/>
                    <div class="pulse"></div>
                </div>
            </div>
        </div>
		<div class="guide-close"><a class="btn btn-primary">知道了</a></div>
	</div>
</div>
<script>
var game, sendscore = "{$appconfig['sendscore']}";
var Gameconfig = {
	gameW:640,
	gameH:640 / window.innerWidth * window.innerHeight,
	gameImgs:{
        title:"{if empty($appconfig['apptopimg'])}{:tomedia($appconfig['style']['apptopimg'])}{else}{:tomedia($appconfig['apptopimg'])}{/if}",
        player:"{:tomedia($appconfig['style']['appplayer'])}",
        gamebg:"{:tomedia($appconfig['style']['appgamebg'])}",
        pmbtn: "{:tomedia($appconfig['style']['apppmbtn'])}",
        boomvoice:"{:tomedia($appconfig['style']['boomvoice'])}",
        buttons:"{:tomedia($appconfig['style']['appbutton'])}",
        box:"{:tomedia($appconfig['style']['appbox'])}",
        boom:"{:tomedia($appconfig['style']['appboom'])}",
        scorebox:"{:tomedia($appconfig['style']['appscorebg'])}",
        timebox:"{:tomedia($appconfig['style']['apptimebg'])}",
        gameover:"{:tomedia($appconfig['style']['appoverbg'])}",
        scorevoice:"{:tomedia($appconfig['style']['scorevoice'])}",
        fontpng:"/{:WIMGURL}clickrace/font.png",
        fontxml:"/{:WIMGURL}clickrace/font.xml",
        
	},
    showscorebox:"{$appconfig['appshowscore']??1}",
};
require(['appclickrace'],function (appclickrace) {	
	appclickrace.init();
});
</script>
{if !empty($appconfig['style']['diycss'])}
<style>{$appconfig['style']['diycss']}</style>
{/if}
