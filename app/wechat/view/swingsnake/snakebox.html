<style>
    .appswingsnake-box{
        position: relative;
        height: 5.2rem;
        width: 1.68rem;
        margin-bottom: 0.3rem;
    }
    .appswingsnake-wrapper{
        position: relative;
        width: 100%;
        height: 100%;
    }
    .appswingsnake-box .appswingsnake-holebox{
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
    }
    .appswingsnake-box .appswingsnake-holebox img{
        width: 100%;
    }
    .appswingsnake-box .appswingsnake-info{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4.8rem;
        text-align: center;
        overflow: hidden;
    }
    .appswingsnake-box .appswingsnake-info .appswingsnake-info-inner{
        position: absolute;
        left: 0;
        top: 100%;
        width: 100%;
        text-align: center;
        transition: top .6s linear;
        -webkit-transition: top .6s linear;
    }
    .appswingsnake-box .appswingsnake-info .appswingsnake-info-inner .snakebox{
        width: 100%;
    }
    .appswingsnake-box .appswingsnake-info .appswingsnake-info-inner .snakebox img{
        width: 100%;
    }
</style>
<div class="appswingsnake-box hidden">
    <div class="appswingsnake-wrapper">
        <div class="appswingsnake-holebox">
            <img src="{:tomedia($appconfig['style']['shakeconfig']['hole'])}">
        </div>
        <div class="appswingsnake-info">
            <div class="appswingsnake-info-inner">
                <div class="snakebox">
                    <img src="{:tomedia($appconfig['style']['shakeconfig']['role'])}">
                </div>
            </div>
        </div>
    </div>
</div>
