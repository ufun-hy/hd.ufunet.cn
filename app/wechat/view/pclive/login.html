		!function (window) {
		    var docWidth = 1920,doc = window.document,docEl = doc.documentElement,resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';
		    var recalc = (function refreshRem () {
		        var clientWidth = docEl.getBoundingClientRect().width;
		        docEl.style.fontSize = Math.max(Math.min(20 * (clientWidth / docWidth), 20), 20) * 5 + 'px';
		        return refreshRem;
		    })();
		    docEl.setAttribute('data-dpr', window.navigator.appVersion.match(/iphone/gi) ? window.devicePixelRatio : 1);
		    if (/iP(hone|od|ad)/.test(window.navigator.userAgent)) {
		        doc.documentElement.classList.add('ios');
		        if (parseInt(window.navigator.appVersion.match(/OS (\d+)_(\d+)_?(\d+)?/)[1], 10) >= 8)
		            doc.documentElement.classList.add('hairline');
		    }
		    if (!doc.addEventListener) return;
		    window.addEventListener(resizeEvt, recalc, false);
		    doc.addEventListener('DOMContentLoaded', recalc, false);
	    }(window);
	 </script>

		{/*互动登录框*/}
		.login-pop{border-radius: 0.12rem!important}
		.login-pop-main{
			position: relative;
			display: flex;
		    flex-direction: column;
		    align-items: center;
		    padding: 0.72rem;
		    padding-top: 0.7rem;
		}
		.login-pop-main .close{
			position: absolute;
			top: 0.1rem;
			right:0.1rem;
			font-size: 0.26rem;
			font-weight: 100;
			cursor: pointer;
			color: #999;
		}
		.login-pop-main .qrcode {
		    width: 2rem;
		    height: 2rem;
		    padding: 0.02rem;
		    border: 1px solid #d5d5d5;
		    border-radius: 0.12rem;
		}
		.login-pop-main .qrcode .qrimg{
		    width: 100%;
		    height: 100%;
		}
		.qrcode-loading{
			height: 100%;
			width: 100%;
		}
		.qrcode-loading img{
			margin-bottom: 0.2rem;
			animation: foreverrotate 2s linear infinite;
		}
		@keyframes foreverrotate {
			0% {
				transform: rotate(0)
			}

			to {
				transform: rotate(-1turn)
			}
		}
		.qrcode-loading p,.errortip{font-size: 0.14rem;color: #999}
		.login-pop-main .tip {
			height: 0.4rem;
			line-height: 0.4rem;
		    font-size: .16rem;
		    color: #000;
		    font-weight: 300;
		}
		.login-type-icon{width: 0.32rem;height: 0.28rem;background-image: url("/{:SIMGURL}pclive/wechat.png");background-size: cover;background-repeat: no-repeat;}

<body>
<script id="login-tpl" type="text/html">
	<div class="login-pop-main">
		<div class="qrcode zam-app-flex-ajCenter">
			<img class="qrimg hidden" src="">
			<div class="qrcode-loading zam-app-flex-ajCenter">
				<img src="__STATIC__/images/sys/loading2.png">
				<p>正在生成二维码</p>
			</div>
			<div class="errortip hidden"></div>
		</div>
		<p class="tip">微信扫码登录</p>
		<div class="login-type-icon"></div>
	</div>
</script>
<script type="text/javascript">
require(['livecore','appsocket'],function(livecore,appsocket){
appsocket.init({
	onmessage:function(data){
		if(data.type=='connected'){
			appsocket.isclose = false;
			livecore.clientid = data.clientid;
			livecore.showloginbox('1');
		}else if(data.type=='pclivelogin'){
			if(data.authinfo){
				livecore.ajaxSubmit('/wechat/pclive/login',{authinfo:data.authinfo},false).then(function(data){
					if(data.code==0){
						livecore.closeall();
						livecore.msg('授权成功');
						setTimeout(function(){
							livecore.reloadpage();
						},1e3);
					}else{
						livecore.msg(data.msg);
					}
				}, function(){
					livecore.msg('网络太差，请稍后重试');
				});
			}
		}
	}
})
})
</script>
