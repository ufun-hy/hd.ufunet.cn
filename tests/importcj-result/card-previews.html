<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>中奖卡片缩略图源</title>
<link rel="stylesheet" href="/public/static/css/screencss/screenimportcj-stage-ui.css">
<style>
html,body{margin:0;width:400px;height:224px;overflow:hidden}
.import-result{width:400px;height:224px;--u:2.24px;background:#0c1732;display:flex;align-items:center;justify-content:center}
.import-result-card{--fs:48px;--import-card-border-size:2px;width:232px;height:184px;border-radius:18px}
.import-result-main{font-size:48px}
</style>
<section class="import-result"><div class="import-result-card"></div></section>
<script src="/public/static/js/require.js"></script>
<script>
require.config({baseUrl:'/public/static/js'});
require(['screenjs/screenimportcj-result'],function(result){
    var mode=new URLSearchParams(location.search).get('style')||'gold';
    result.applyCardBackground(document.querySelector('.import-result'),{resultcardmode:mode,resultcardcolor:'#e6f0ff'});
    var winner=result.selectFields({datafield1:'A09',datafield2:'张伟',datafield3:'市场部',datafield4:'020902'}, {}, ['座位号','姓名','部门','编号'].map(function(fieldname){return {fieldname:fieldname};}));
    result.appendFields(document.querySelector('.import-result-card'),winner,'import-result',false);
    document.documentElement.dataset.ready='true';
});
</script>
</html>
