<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中奖界面布局演示</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--gold:#f0c96b;--brown:#3a1c06}
*{box-sizing:border-box}
html,body{margin:0;background:#120803;font-family:'PingFang SC','Microsoft YaHei',sans-serif;color:#fff}
#wrap{display:flex;justify-content:center}
#stage{position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 75% at 50% 45%,#9a5a16 0%,#5a2e0a 55%,#1f0e03 100%)}
#rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,214,128,.07) 0 6deg,transparent 6deg 14deg)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 80% at 50% 50%,transparent,rgba(10,4,1,.55))}
#head{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;text-align:center}
#thumb{border:2px dashed rgba(240,201,107,.8);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.5;color:var(--gold);background:rgba(255,255,255,.06)}
.badge{display:inline-block;border-radius:40px;background:linear-gradient(160deg,#ffe29a,#d9a03a);color:var(--brown);font-weight:800}
#prize{font-weight:800;letter-spacing:.03em}
#total{color:var(--gold)}
#grid{position:absolute;display:flex;align-items:center;justify-content:center}
#inner{display:flex;flex-wrap:wrap;justify-content:center}
.card{position:relative;overflow:hidden;border:solid #fff3c4;background:linear-gradient(160deg,#ffe29a,#e8b04a 55%,#c98a25);color:var(--brown);
 display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;
 box-shadow:0 0 40px rgba(255,190,70,.55),0 14px 26px rgba(0,0,0,.35)}
.card .code{font-weight:900;line-height:1;white-space:nowrap}
.card .sub{margin-top:.2em;font-weight:700;color:#6b3d10;white-space:nowrap}
.card.rolling{filter:brightness(.82)}
.card.done{animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
.card.sw::after{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);animation:sweep 1s .15s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:.4}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}
@keyframes sweep{to{left:120%}}
.p{position:absolute;width:12px;height:12px;border-radius:3px;pointer-events:none;animation:fly 1.3s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
#pager{position:absolute;left:0;right:0;text-align:center;color:var(--gold)}
#bar{display:flex;gap:10px 18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 12px;font-size:14px}
#bar .g{display:flex;gap:6px;align-items:center}
#bar button{font:inherit;font-weight:700;padding:6px 12px;border-radius:6px;border:1px solid var(--gold);background:transparent;color:var(--gold);cursor:pointer}
#bar button.on{background:var(--gold);color:var(--brown)}
#bar input[type=number]{width:60px;font:inherit;padding:5px 6px;border-radius:6px;border:1px solid var(--gold);background:rgba(0,0,0,.3);color:#fff}
#bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
 <div id="rays"></div><div id="vig"></div>
 <div id="head"><div id="thumb">奖品图<br>小图 · 可选</div><div id="ht"><span class="badge" id="badge">二等奖</span><div id="prize">外交官行李箱 / 外交官电脑包</div><div id="total"></div></div></div>
 <div id="grid"></div>
 <div id="pager"></div>
</div></div>
<div id="bar">
 <div class="g"><span>中奖人数</span><input type="number" id="num" min="1" max="60" value="3">
  <span id="qn"></span></div>
 <div class="g"><span>屏幕比例</span><span id="qr"></span></div>
 <label><input type="checkbox" id="imgTog" checked>奖品图（4 人以上自动隐藏）</label>
 <button id="replay">重新揭晓</button>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const stage=$('stage'),grid=$('grid'),pager=$('pager'),head=$('head'),thumb=$('thumb'),ht=$('ht');
const pad=(x,l=2)=>String(x).padStart(l,'0');
const RATIOS=[['16:9',16/9],['16:10',16/10],['4:3',4/3],['21:9',21/9],['9:16 竖屏',9/16]];
const NS=[1,2,3,6,10,20,40];
let n=3,ratio=16/9,W=0,H=0,u=0,timers=[],iv=null,rot=null;
function code(i){
 if(i<3)return [["A09","020902"],["B14","031403"],["B01","030102"]][i];
 const li=(i*5+1)%6,num=1+(i*7+3)%40;
 return ['ABCDEF'[li]+pad(num),pad(li+1)+pad(num)+pad(1+i%4)];
}
function rnd(len){let s='';for(let i=0;i<len;i++)s+=Math.floor(Math.random()*10);return s}
function scr(){return 'ABCDEF'[Math.floor(Math.random()*6)]+rnd(2)}
function best(m,aw,ah){
 let b=null;
 for(let c=1;c<=m;c++){
  const r=Math.ceil(m/c),g=Math.min(aw,ah)*0.03;
  const cw=(aw-(c-1)*g)/c,ch=(ah-(r-1)*g)/r;
  let fs=Math.min(ch*0.5,cw/2.6,H*0.24);
  if(!b||fs>b.fs+0.5)b={c,r,g,cw,ch,fs};
 }
 return b;
}
function burst(card,count){
 const r=card.getBoundingClientRect(),f=stage.getBoundingClientRect();
 const cx=r.left-f.left+r.width/2,cy=r.top-f.top+r.height/2,cols=['#ffe29a','#f0c96b','#fff','#e8803a'];
 for(let i=0;i<count;i++){
  const p=document.createElement('div');p.className='p';
  p.style.left=cx+'px';p.style.top=cy+'px';p.style.background=cols[i%4];
  const a=Math.random()*Math.PI*2,d=(0.08+Math.random()*0.12)*u;
  p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',Math.sin(a)*d-u*0.03+'px');
  stage.appendChild(p);setTimeout(()=>p.remove(),1400);
 }
}
function stopAll(){timers.forEach(clearTimeout);timers=[];clearInterval(iv);clearInterval(rot)}
function play(){
 stopAll();
 const barH=$('bar').offsetHeight;
 let w=innerWidth,h=w/ratio,maxH=innerHeight-barH-6;
 if(h>maxH){h=maxH;w=h*ratio}
 W=w;H=h;u=Math.min(H,W*9/16);
 stage.style.width=W+'px';stage.style.height=H+'px';
 const showThumb=$('imgTog').checked&&n<=3&&ratio>1;
 thumb.style.display=showThumb?'flex':'none';
 thumb.style.width=0.225*u+'px';thumb.style.height=0.15*u+'px';thumb.style.fontSize=0.02*u+'px';thumb.style.marginRight=0.04*u+'px';
 head.style.top=0.05*u+'px';
 const bd=$('badge');bd.style.fontSize=0.037*u+'px';bd.style.padding=0.006*u+'px '+0.03*u+'px';
 $('prize').style.fontSize=0.063*u+'px';$('prize').style.marginTop=0.012*u+'px';
 $('total').style.fontSize=0.028*u+'px';$('total').style.marginTop=0.006*u+'px';
 $('total').textContent='共 '+n+' 名';
 ht.style.maxWidth=(showThumb?0.9*W-0.265*u:0.9*W)+'px';
 const aw=0.9*W,top=0.27*u;
 let m=n,ah=H*0.93-top;
 if(best(n,aw,ah).fs<0.07*H){
  ah=H*0.88-top;
  for(m=Math.min(15,n);m>1;m--)if(best(m,aw,ah).fs>=0.07*H)break;
 }
 const lay=best(m,aw,ah),pages=Math.ceil(n/m);
 const cardW=Math.min(lay.cw,lay.fs*3.6),cardH=Math.min(lay.ch,lay.fs*2.0);
 grid.style.cssText='left:'+(W-aw)/2+'px;top:'+top+'px;width:'+aw+'px;height:'+ah+'px';
 pager.style.top=H*0.9+'px';pager.style.fontSize=0.026*u+'px';
 pager.textContent='';
 function render(p,roll){
  const start=p*m,cnt=Math.min(m,n-start);
  grid.innerHTML='';
  const inner=document.createElement('div');inner.id='inner';
  inner.style.cssText='width:'+(lay.c*cardW+(lay.c-1)*lay.g)+'px;gap:'+lay.g+'px';
  grid.appendChild(inner);
  const cards=[];
  for(let i=0;i<cnt;i++){
   const c=document.createElement('div');c.className='card'+(roll?' rolling':'');
   c.style.cssText='width:'+cardW+'px;height:'+cardH+'px;border-width:'+Math.max(2,H*0.003)+'px;border-radius:'+Math.min(28,cardH*0.12)+'px';
   const a=document.createElement('div'),b=document.createElement('div');
   a.className='code';b.className='sub';
   a.style.fontSize=lay.fs+'px';b.style.fontSize=Math.max(12,lay.fs*0.3)+'px';
   if(!roll){const d=code(start+i);a.textContent=d[0];b.textContent=d[1];c.classList.add('done')}
   c.appendChild(a);c.appendChild(b);inner.appendChild(c);cards.push(c);
  }
  if(pages>1)pager.textContent='第 '+(p+1)+' / '+pages+' 页';
  return cards;
 }
 const cards=render(0,true);
 iv=setInterval(()=>{cards.forEach(c=>{if(c.classList.contains('rolling')){c.children[0].textContent=scr();c.children[1].textContent=rnd(6)}})},60);
 const step=Math.min(380,2200/cards.length);
 cards.forEach((c,i)=>timers.push(setTimeout(()=>{
  const d=code(i);c.children[0].textContent=d[0];c.children[1].textContent=d[1];
  c.classList.remove('rolling');c.classList.add('done','sw');
  if(i<12)burst(c,cards.length>6?8:14);
  if(i===cards.length-1)clearInterval(iv);
 },1200+i*step)));
 if(pages>1){
  let p=0;
  timers.push(setTimeout(()=>{rot=setInterval(()=>{p=(p+1)%pages;render(p,false)},4000)},1200+cards.length*step+2500));
 }
}
NS.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{$('num').value=v;n=v;sync();play()};$('qn').appendChild(b)});
RATIOS.forEach(([t,v])=>{const b=document.createElement('button');b.textContent=t;b.dataset.r=v;b.onclick=()=>{ratio=v;sync();play()};$('qr').appendChild(b)});
function sync(){
 [...$('qn').children].forEach(b=>b.classList.toggle('on',+b.textContent===n));
 [...$('qr').children].forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.r-ratio)<1e-6));
}
$('num').onchange=()=>{n=Math.max(1,Math.min(60,parseInt($('num').value,10)||1));$('num').value=n;sync();play()};
$('imgTog').onchange=play;$('replay').onclick=play;
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(play,150)});
sync();play();
})();
</script>
</body>
</html>
