<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>大屏得分区预览</title>
<style>
body{margin:16px;font:13px/1.5 system-ui,sans-serif;background:#f4f4f2;color:#222}
table{border-collapse:collapse;margin-bottom:16px}
td,th{border:1px solid #ccc;padding:4px 8px;text-align:left}
.bad{color:#b00;font-weight:600}
.cell{display:inline-block;margin:0 12px 16px 0;vertical-align:top}
.wrap{overflow:hidden;border:1px solid #999}
iframe{border:0;transform-origin:0 0}
</style>
</head>
<body>
<table id="report"><tr><th>场景</th><th>屏幕</th><th>汇总区高度</th><th>得分区内容高度</th><th>评委列表高度</th><th>算式宽度/可用宽度</th><th>截断的名称</th><th>被裁掉的占比/人数</th></tr></table>
<div id="frames"></div>
<script src="fixtures.js"></script>
<script>
var sizes = [[1920, 1080], [1440, 1080]];
var scale = 0.42;
window.__report = [];
Object.keys(SCORE_FORMULA_FIXTURES).forEach(function (name) {
    sizes.forEach(function (size) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = '<div>' + SCORE_FORMULA_FIXTURES[name].label + ' · ' + size.join('×') + '</div>';
        var wrap = document.createElement('div');
        wrap.className = 'wrap';
        wrap.style.width = Math.round(size[0] * scale) + 'px';
        wrap.style.height = Math.round(330 * scale * 1.6) + 'px';
        var frame = document.createElement('iframe');
        frame.width = size[0];
        frame.height = size[1];
        frame.style.transform = 'scale(' + scale + ')';
        frame.src = 'frame.html#' + encodeURIComponent(name);
        wrap.appendChild(frame);
        cell.appendChild(wrap);
        document.getElementById('frames').appendChild(cell);
        var poll = setInterval(function () {
            var r = frame.contentWindow && frame.contentWindow.__result;
            if (!r) return;
            clearInterval(poll);
            var row = { name: name, size: size.join('×'), result: r };
            window.__report.push(row);
            var tr = document.createElement('tr');
            var overflow = r.formulaWidth !== null && r.formulaWidth > r.formulaBox;
            tr.innerHTML = '<td>' + SCORE_FORMULA_FIXTURES[name].label + '</td><td>' + row.size + '</td>'
                + '<td class="' + (r.summary > 160 ? 'bad' : '') + '">' + r.summary + '</td><td>' + r.scoreArea + '</td><td>' + r.detailPanel + '</td>'
                + '<td class="' + (overflow ? 'bad' : '') + '">' + (r.formulaWidth === null ? '-' : r.formulaWidth + ' / ' + r.formulaBox) + '</td><td>' + r.truncatedCaptions + '</td><td class="' + (r.clippedMeta ? 'bad' : '') + '">' + r.clippedMeta + '</td>';
            document.getElementById('report').appendChild(tr);
        }, 100);
    });
});
</script>
</body>
</html>
